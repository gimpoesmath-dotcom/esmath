<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교재 일괄 추가 도구</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f5f5f5; padding: 20px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h2 { font-size: 16px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #1a1a1a; color: #fff; padding: 8px; text-align: left; }
td { padding: 7px 8px; border-bottom: 1px solid #eee; }
tr:hover td { background: #f9f9f9; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; }
.btn-black { background: #1a1a1a; color: #fff; }
.btn-green { background: #1e6e3a; color: #fff; }
.btn-blue { background: #1558a8; color: #fff; }
.btn:disabled { background: #999; cursor: not-allowed; }
.log { font-size: 12px; font-family: monospace; background: #111; color: #fff; padding: 14px; border-radius: 8px; min-height: 80px; max-height: 200px; overflow-y: auto; line-height: 1.8; }
.tip { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.8; }
</style>
</head>
<body>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app-check.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD8QW7ho0PavzdA5sb8H2GZzatakRRbDMw",
  authDomain: "esmath-122f1.firebaseapp.com",
  projectId: "esmath-122f1",
  storageBucket: "esmath-122f1.firebasestorage.app",
  messagingSenderId: "914321018838",
  appId: "1:914321018838:web:452cd8d68446b1c6ec1e77"
};

const app = initializeApp(firebaseConfig);
try {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LetIP0sAAAAAOLYkVNNXK6RP07CnsN8qCT62uoQ'),
    isTokenAutoRefreshEnabled: true
  });
} catch(e) {}
const db = getFirestore(app);

function log(msg, type='info'){
  const el = document.getElementById('log');
  const color = type==='ok'?'#4caf50':type==='err'?'#f44336':type==='warn'?'#ffb74d':'#90caf9';
  el.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

async function loadCfg(){
  try{
    const snap = await getDoc(doc(db,'config','main'));
    return snap.exists() ? snap.data() : {textbooks:[]};
  }catch(e){ return {textbooks:[]}; }
}

window.handleFile = async function(input){
  const file = input.files[0];
  if(!file) return;

  if(!window.XLSX){
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    await new Promise(r=>script.onload=r);
  }

  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:''});

  if(!rows.length){ log('데이터가 없습니다.', 'err'); return; }

  const tbody = document.getElementById('previewBody');
  tbody.innerHTML = '';

  window._parsedBooks = rows.map((r,i)=>{
    const name      = String(r['교재명']||'').trim();
    const series    = String(r['시리즈명']||'').trim();
    const grade     = String(r['학년']||'').trim();
    const semester  = String(r['학기']||'').trim();
    const unitCount = parseInt(r['단원수'])||0;
    const tier      = String(r['포인트등급']||'').trim().toLowerCase();
    const unitNames = String(r['단원명(쉼표구분)']||'').trim();
    // 단원명 파싱: "1단원 소수와 합성수, 2단원 약수" → 배열
    const units = unitNames ? unitNames.split(',').map((u,i)=>({
      name: u.trim()||`${i+1}단원`,
      checked: false, score: null, checkedDate: '', addedDate: new Date().toISOString().slice(0,10)
    })) : Array.from({length:unitCount||0},(_,i)=>({
      name:`${i+1}단원`, checked:false, score:null, checkedDate:'', addedDate:new Date().toISOString().slice(0,10)
    }));

    // 포인트 등급 정규화
    const masterTier = tier==='high'||tier==='높음'?'high':
                       tier==='low'||tier==='낮음'?'low':'none';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><b>${name||'❌미입력'}</b></td>
      <td>${series||'-'}</td>
      <td>${grade||'-'}</td>
      <td>${semester||'-'}</td>
      <td>${units.length||'-'}</td>
      <td style='color:#555;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>${units.slice(0,3).map(u=>u.name).join(', ')}${units.length>3?' ...':''}</td>
      <td>${masterTier}</td>
    `;
    if(!name) tr.style.background='#fff0f0';
    tbody.appendChild(tr);

    return { name, series, grade, semester, unitCount:units.length, masterTier, units };
  }).filter(b=>b.name);

  document.getElementById('previewCount').textContent = `${window._parsedBooks.length}권 확인됨`;
  document.getElementById('preview').style.display = '';
  document.getElementById('importBtn').disabled = false;
  log(`📋 ${window._parsedBooks.length}권 파싱 완료. 확인 후 저장 버튼을 누르세요.`, 'ok');
};

window.importToFirebase = async function(){
  if(!window._parsedBooks?.length){ log('데이터 없음', 'err'); return; }
  if(!confirm(`${window._parsedBooks.length}권을 Firebase에 추가하시겠어요?`)) return;

  document.getElementById('importBtn').disabled = true;
  log('🚀 저장 시작...', 'info');

  try{
    const cfg = await loadCfg();
    if(!cfg.textbooks) cfg.textbooks = [];

    let added=0, skipped=0;
    window._parsedBooks.forEach(b=>{
      if(cfg.textbooks.some(x=>x.name===b.name && x.series===b.series)){
        log(`  ⚠️ ${b.name}: 이미 존재 (스킵)`, 'warn');
        skipped++; return;
      }
      const tbId = 'tb'+Date.now()+Math.random().toString(36).slice(2,6);
      cfg.textbooks.push({
        id: tbId,
        name: b.name,
        series: b.series,
        grade: b.grade,
        semester: b.semester,
        unitCount: b.unitCount,
        masterTier: b.masterTier,
      });
      // 단원명이 있으면 textbook_units에도 저장 (나중에 학생별 배정 시 사용)
      if(b.units && b.units.length){
        window._unitData = window._unitData||{};
        window._unitData[tbId] = b.units;
      }
      log(`  ✅ ${b.name} 추가 (단원 ${b.units?.length||0}개)`, 'ok');
      added++;
    });

    await setDoc(doc(db,'config','main'), cfg, {merge:true});
    log(`\n🎉 완료! ${added}권 추가 · ${skipped}권 스킵`, 'ok');
  }catch(e){
    log(`❌ 오류: ${e.message}`, 'err');
    document.getElementById('importBtn').disabled = false;
  }
};

window.downloadSample = function(){
  if(!window.XLSX){
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    script.onload = _dl;
  } else { _dl(); }
};

function _dl(){
  const data = [
    ['교재명','시리즈명','학년','학기','단원수','포인트등급','단원명(쉼표구분)'],
    ['디딤돌 수학 중1-1','디딤돌 수학','중1','1학기',8,'high','1단원 소수와 합성수, 2단원 약수와 배수, 3단원 최대공약수, 4단원 최소공배수'],
    ['디딤돌 수학 중1-2','디딤돌 수학','중1','2학기',8,'high',''],
    ['쎈 중2-1','쎈','중2','1학기',10,'low',''],
    ['수학의 정석 고1','수학의 정석','고1','공통',12,'high',''],
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:20},{wch:14},{wch:6},{wch:8},{wch:7},{wch:10},{wch:50}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '교재목록');
  XLSX.writeFile(wb, '교재_일괄추가_양식.xlsx');
}
</script>

<div class="card">
  <h2>📚 교재 일괄 추가 도구</h2>
  <p style="font-size:12px;color:#888;margin-bottom:16px">엑셀 파일로 교재를 한 번에 Firebase에 추가합니다.</p>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn btn-black" onclick="downloadSample()">📥 양식 다운로드</button>
    <label class="btn btn-blue" style="cursor:pointer">
      📂 엑셀 파일 선택
      <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
    </label>
  </div>

  <div class="tip">
    📌 포인트등급: <b>high</b>(높음·5,000P) · <b>low</b>(낮음·2,000P) · <b>none</b>(없음)<br>
    📌 단원명: 쉼표로 구분 예) <b>1단원 소수와 합성수, 2단원 약수와 배수</b> (비워두면 1단원·2단원... 자동 생성)<br>
    📌 단원수: 숫자만 입력 (없으면 0 또는 비워두세요)<br>
    📌 시리즈명: 같은 시리즈 교재끼리 묶어줍니다 (없으면 비워두세요)
  </div>
</div>

<div class="card" id="preview" style="display:none">
  <h2>👀 미리보기 <span id="previewCount" style="font-size:12px;color:#888;font-weight:400"></span></h2>
  <div style="overflow-x:auto;margin-bottom:14px">
    <table>
      <thead>
        <tr>
          <th>#</th><th>교재명</th><th>시리즈명</th><th>학년</th><th>학기</th><th>단원수</th><th>포인트등급</th><th>단원명 미리보기</th>
        </tr>
      </thead>
      <tbody id="previewBody"></tbody>
    </table>
  </div>
  <button class="btn btn-green" id="importBtn" onclick="importToFirebase()" disabled>
    🚀 Firebase에 저장
  </button>
</div>

<div class="card">
  <h2>📟 로그</h2>
  <div class="log" id="log">대기 중...\n</div>
</div>

</body>
</html>
