<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>진도표 업로드 도구</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f5f5f5; padding: 20px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h2 { font-size: 16px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { background: #1a1a1a; color: #fff; padding: 7px; text-align: left; }
td { padding: 6px 8px; border-bottom: 1px solid #eee; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; }
.btn-green { background: #1e6e3a; color: #fff; }
.btn-blue { background: #1558a8; color: #fff; }
.btn:disabled { background: #999; cursor: not-allowed; }
.log { font-size: 12px; font-family: monospace; background: #111; color: #fff; padding: 14px; border-radius: 8px; min-height: 100px; max-height: 300px; overflow-y: auto; line-height: 1.8; }
.tip { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.8; }
progress { width: 100%; height: 8px; border-radius: 4px; margin-bottom: 8px; }
.status { font-size: 12px; color: #555; margin-bottom: 6px; }
</style>
</head>
<body>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app-check.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD8QW7ho0PavzdA5sb8H2GZzatakRRbDMw",
  authDomain: "esmath-122f1.firebaseapp.com",
  projectId: "esmath-122f1",
  storageBucket: "esmath-122f1.firebasestorage.app",
  messagingSenderId: "914321018838",
  appId: "1:914321018838:web:452cd8d68446b1c6ec1e77"
};

const app = initializeApp(firebaseConfig);
try {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LetIP0sAAAAAOLYkVNNXK6RP07CnsN8qCT62uoQ'),
    isTokenAutoRefreshEnabled: true
  });
} catch(e) {}
const db = getFirestore(app);

function log(msg, type='info'){
  const el = document.getElementById('log');
  const color = type==='ok'?'#4caf50':type==='err'?'#f44336':type==='warn'?'#ffb74d':'#90caf9';
  el.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function parseAttendance(v){
  if(!v) return '';
  const s = String(v).trim().toUpperCase();
  if(['O','출석','출','◯','○'].includes(s)) return 'attend';
  if(['X','결석','결','✕','×'].includes(s)) return 'absent';
  if(['지각','지','△'].includes(s)) return 'late';
  return '';
}

function parseDate(v){
  if(!v) return '';
  if(typeof v === 'number'){
    const d = new Date(Math.round((v-25569)*86400*1000));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // MM-DD 형식 (예: 05-04)
  if(/^\d{2}-\d{2}$/.test(s)) return `2026-${s}`;
  if(/^\d{1,2}[\/\.]\d{1,2}$/.test(s)){
    const [m,d] = s.split(/[\/\.]/);
    return `2026-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // '4월 3일(금)' 형식
  const korean = s.match(/(\d{1,2})월\s*(\d{1,2})일/);
  if(korean){
    const m = korean[1].padStart(2,'0');
    const d = korean[2].padStart(2,'0');
    const year = '2026';
    return `${year}-${m}-${d}`;
  }
  return '';
}

function lk(sid, dateStr){ return `${sid}_${dateStr}`; }

window.handleFile = async function(input){
  const file = input.files[0];
  if(!file) return;

  if(!window.XLSX){
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    await new Promise(r=>script.onload=r);
  }

  log('📂 파일 읽는 중...', 'info');

  let students = [];
  try{
    const snap = await getDoc(doc(db,'config','main'));
    students = snap.exists() ? (snap.data().students||[]) : [];
    log(`✅ 학생 ${students.length}명 로드 완료`, 'ok');
  }catch(e){
    log(`❌ Firebase 학생 로드 실패: ${e.message}`, 'err'); return;
  }

  const nameToId = {};
  students.forEach(s=>{ nameToId[s.name]=s.id; });

  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, {type:'array', cellDates:false});

  window._lessons = {};
  let totalParsed=0, notFound=[];

  // 구조:
  // 1행: 제목
  // 2행: 학생명·학년·레벨·담당(고정4칸) | 1회차(병합) | 2회차(병합) ...
  // 3행: (고정4칸 빈칸) | 날짜 | 날짜 | ...  ← 공유 날짜
  // 4행: (고정4칸 빈칸) | 목표진도·출결·과제·시험·오늘진도·오늘과제·보강·특이사항 반복
  // 5행~: 학생 데이터

  const FIXED = 4;
  const SUB_COLS = ['목표진도','출결','과제','시험','오늘진도','오늘과제','보강','특이사항'];
  const N_SUB = SUB_COLS.length;

  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
    if(rows.length < 5) return;

    const row2 = rows[1]; // 회차 헤더
    const row3 = rows[2]; // 날짜 (공유)
    const row4 = rows[3]; // 서브헤더

    // 2행에서 회차 시작 컬럼 파악
    const sessions = [];
    for(let ci=FIXED; ci<row2.length; ci++){
      const v = String(row2[ci]||'').trim();
      if(v.includes('회차')){
        const n = parseInt(v);
        if(!isNaN(n)){
          // 3행에서 날짜 읽기
          const dateVal = row3[ci];
          const dateStr = parseDate(dateVal);
          sessions.push({sess:n, startCol:ci, dateStr});
        }
      }
    }

    if(!sessions.length){ log(`⚠️ ${sheetName}: 회차 없음 스킵`, 'warn'); return; }
    log(`  📋 ${sheetName}: ${sessions.length}회차 파악`, 'info');

    // 5행~: 학생 데이터
    for(let ri=4; ri<rows.length; ri++){
      const row = rows[ri];
      const name = String(row[0]||'').trim();
      if(!name) continue;

      const sid = nameToId[name];
      if(!sid){
        if(!notFound.includes(name)) notFound.push(name);
        continue;
      }

      sessions.forEach(({sess, startCol, dateStr}) => {
        if(!dateStr) return; // 날짜 없으면 스킵

        const ym = dateStr.substring(0,7);
        if(!window._lessons[ym]) window._lessons[ym]={};

        const key = lk(sid, dateStr);
        const get = (colName) => {
          const idx = SUB_COLS.indexOf(colName);
          return idx>=0 ? row[startCol+idx] : '';
        };

        const att   = parseAttendance(get('출결'));
        const hw    = parseFloat(get('과제'));
        const test  = parseFloat(get('시험'));
        const todayProg = String(get('오늘진도')||'').trim();
        const todayHw   = String(get('오늘과제')||'').trim();
        const makeup    = String(get('보강')||'').trim().toUpperCase()==='O';
        const note      = String(get('특이사항')||'').trim();

        // 모두 비어있으면 스킵
        if(!att && isNaN(hw) && isNaN(test) && !todayProg && !todayHw && !note) return;

        window._lessons[ym][key] = {
          key, studentId:sid, date:dateStr,
          attendance: att,
          homeworkScore: isNaN(hw)?'':hw,
          testScore: isNaN(test)?'':test,
          progress: todayProg,
          homework: todayHw,
          makeupClass: makeup,
          note,
          updatedAt: new Date().toISOString(),
          updatedBy: '엑셀업로드'
        };
        totalParsed++;
      });
    }
  });

  log(`📋 총 ${totalParsed}건 파싱 완료`, totalParsed>0?'ok':'warn');
  if(notFound.length) log(`⚠️ 미매칭 학생: ${notFound.join(', ')}`, 'warn');

  const months = Object.keys(window._lessons).sort();
  let html='';
  months.forEach(ym=>{
    html+=`<tr><td>${ym}</td><td>${Object.keys(window._lessons[ym]).length}건</td></tr>`;
  });
  document.getElementById('previewBody').innerHTML = html;
  document.getElementById('previewCount').textContent = `총 ${totalParsed}건 · ${months.length}개월`;
  document.getElementById('preview').style.display = '';
  document.getElementById('importBtn').disabled = totalParsed===0;
};

window.importToFirebase = async function(){
  if(!window._lessons||!Object.keys(window._lessons).length){ log('데이터 없음','err'); return; }
  const total = Object.values(window._lessons).reduce((a,b)=>a+Object.keys(b).length,0);
  if(!confirm(`${total}건을 Firebase에 저장하시겠어요?`)) return;

  document.getElementById('importBtn').disabled = true;
  let saved=0, failed=0;

  for(const ym of Object.keys(window._lessons).sort()){
    const lessons = window._lessons[ym];
    document.getElementById('statusText').textContent = `저장 중: ${ym}`;
    try{
      for(const [key,data] of Object.entries(lessons)){
        await setDoc(doc(db,`lessons_${ym}`,key), data, {merge:true});
        saved++;
        document.getElementById('prog').value = Math.round((saved/total)*100);
      }
      log(`  ✅ ${ym}: ${Object.keys(lessons).length}건`, 'ok');
    }catch(e){
      log(`  ❌ ${ym}: ${e.message}`, 'err');
      failed+=Object.keys(lessons).length;
    }
  }

  document.getElementById('statusText').textContent = '완료!';
  document.getElementById('prog').value = 100;
  log(`\n🎉 ${saved}건 저장 완료${failed?` · ${failed}건 실패`:''}`, saved>0?'ok':'err');
  document.getElementById('importBtn').disabled = false;
};
</script>

<div class="card">
  <h2>📚 진도표 업로드 도구</h2>
  <p style="font-size:12px;color:#888;margin-bottom:16px">반별 진도표 엑셀을 Firebase에 업로드합니다.</p>
  <label class="btn btn-blue" style="cursor:pointer;display:inline-block">
    📂 진도표 엑셀 선택
    <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
  </label>
  <div class="tip">
    📌 날짜는 3행 상단에 고정 (05-04, 05-06 ... 형식)<br>
    📌 출결: <b>O</b>=출석 · <b>X</b>=결석 · <b>지각</b>=지각<br>
    📌 내용 없는 학생/회차는 자동 스킵 · 덮어쓰기 가능
  </div>
</div>

<div class="card" id="preview" style="display:none">
  <h2>👀 미리보기 <span id="previewCount" style="font-size:12px;color:#888;font-weight:400"></span></h2>
  <table style="max-width:300px;margin-bottom:14px">
    <thead><tr><th>월</th><th>건수</th></tr></thead>
    <tbody id="previewBody"></tbody>
  </table>
  <button class="btn btn-green" id="importBtn" onclick="importToFirebase()" disabled>🚀 Firebase에 저장</button>
</div>

<div class="card">
  <div class="status" id="statusText">대기 중</div>
  <progress id="prog" value="0" max="100"></progress>
  <h2 style="margin-bottom:8px">📟 로그</h2>
  <div class="log" id="log">대기 중...\n</div>
</div>

</body>
</html>
