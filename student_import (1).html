<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학생 일괄 추가 도구</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f5f5f5; padding: 20px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h2 { font-size: 16px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #1a1a1a; color: #fff; padding: 8px; text-align: left; }
td { padding: 7px 8px; border-bottom: 1px solid #eee; }
tr:hover td { background: #f9f9f9; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; }
.btn-black { background: #1a1a1a; color: #fff; }
.btn-green { background: #1e6e3a; color: #fff; }
.btn-blue { background: #1558a8; color: #fff; }
.btn-red { background: #a02828; color: #fff; }
.btn:disabled { background: #999; cursor: not-allowed; }
select, input { padding: 5px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; font-family: inherit; }
.log { font-size: 12px; font-family: monospace; background: #111; color: #fff; padding: 14px; border-radius: 8px; min-height: 80px; max-height: 200px; overflow-y: auto; line-height: 1.8; }
.ok { color: #4caf50; }
.err { color: #f44336; }
.warn { color: #ffb74d; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
.tip { font-size: 11px; color: #888; margin-top: 6px; }
</style>
</head>
<body>

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-app-check.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyD8QW7ho0PavzdA5sb8H2GZzatakRRbDMw",
  authDomain: "esmath-122f1.firebaseapp.com",
  projectId: "esmath-122f1",
  storageBucket: "esmath-122f1.firebasestorage.app",
  messagingSenderId: "914321018838",
  appId: "1:914321018838:web:452cd8d68446b1c6ec1e77"
};

const app = initializeApp(firebaseConfig);

// App Check (GitHub Pages에서 실행 시 작동)
try {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LetIP0sAAAAAOLYkVNNXK6RP07CnsN8qCT62uoQ'),
    isTokenAutoRefreshEnabled: true
  });
} catch(e) {}

const db = getFirestore(app);

function log(msg, type='info'){
  const el = document.getElementById('log');
  const color = type==='ok'?'#4caf50':type==='err'?'#f44336':type==='warn'?'#ffb74d':'#90caf9';
  el.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

// Firebase에서 현재 config 가져오기
async function loadCfg(){
  try{
    const snap = await getDoc(doc(db,'config','main'));
    return snap.exists() ? snap.data() : {students:[]};
  }catch(e){ return {students:[]}; }
}

// 엑셀 파일 파싱
window.handleFile = async function(input){
  const file = input.files[0];
  if(!file) return;

  // SheetJS CDN 로드
  if(!window.XLSX){
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    await new Promise(r=>script.onload=r);
  }

  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:''});

  if(!rows.length){ log('데이터가 없습니다.', 'err'); return; }

  const preview = document.getElementById('preview');
  const tbody = document.getElementById('previewBody');
  tbody.innerHTML = '';

  window._parsedStudents = rows.map((r,i)=>{
    const name = String(r['이름']||'').trim();
    const grade = String(r['학년']||'').trim();
    const cls = String(r['반']||'').trim();
    const level = String(r['레벨']||'').trim().toUpperCase();
    const wdTime = String(r['평일교시']||'').trim();
    const teacher = String(r['평일담당']||'').trim();
    const friTime = String(r['금요일교시']||'').trim();
    const friTeacher = String(r['금요일담당']||'').trim();
    const joinDate = String(r['등록일']||'').trim();
    const note = String(r['특이사항']||'').trim();

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${teacher||'-'}</td>
      <td>${level||'-'}</td>
      <td>${grade}</td>
      <td><b>${name||'❌미입력'}</b></td>
      <td>${cls}</td>
      <td>${wdTime?wdTime+'교시':'-'}</td>
      <td>${friTime?friTime+'교시':'-'}</td>
      <td>${friTeacher||'-'}</td>
      <td>${note||'-'}</td>
      <td>${joinDate||'-'}</td>
    `;
    if(!name) tr.style.background='#fff0f0';
    tbody.appendChild(tr);

    return { name, grade, cls, level, wdTime, teacher, friTime, friTeacher, joinDate, note };
  }).filter(s=>s.name);

  document.getElementById('previewCount').textContent = `${window._parsedStudents.length}명 확인됨`;
  preview.style.display = '';
  document.getElementById('importBtn').disabled = false;
  log(`📋 ${window._parsedStudents.length}명 파싱 완료. 확인 후 "Firebase에 저장" 버튼을 누르세요.`, 'ok');
};

// Firebase에 저장
window.importToFirebase = async function(){
  if(!window._parsedStudents?.length){ log('파싱된 데이터가 없습니다.', 'err'); return; }
  if(!confirm(`${window._parsedStudents.length}명을 Firebase에 추가하시겠어요?`)) return;

  document.getElementById('importBtn').disabled = true;
  log('🚀 저장 시작...', 'info');

  try{
    const cfg = await loadCfg();
    if(!cfg.students) cfg.students = [];

    let added=0, skipped=0;
    window._parsedStudents.forEach(s=>{
      // 이름 중복 체크
      if(cfg.students.some(x=>x.name===s.name)){
        log(`  ⚠️ ${s.name}: 이미 존재 (스킵)`, 'warn');
        skipped++;
        return;
      }
      cfg.students.push({
        id: 's'+Date.now()+Math.random().toString(36).slice(2,7),
        name: s.name,
        grade: s.grade,
        classType: s.cls,
        weekdayTime: s.wdTime,
        teacher: s.teacher,
        fridayTime: s.friTime,
        fridayTeacher: s.friTeacher,
        joinDate: s.joinDate,
        specialNote: s.note,
        level: s.level||'',
      });
      log(`  ✅ ${s.name} 추가`, 'ok');
      added++;
    });

    await setDoc(doc(db,'config','main'), cfg);
    log(`\n🎉 완료! ${added}명 추가 · ${skipped}명 스킵`, 'ok');
  }catch(e){
    log(`❌ 오류: ${e.message}`, 'err');
    document.getElementById('importBtn').disabled = false;
  }
};

// 샘플 엑셀 다운로드
window.downloadSample = function(){
  if(!window.XLSX){
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    script.onload = _downloadSample;
  } else { _downloadSample(); }
};

function _downloadSample(){
  const data = [
    ['평일담당','레벨','학년','이름','반','평일교시','금요일교시','금요일담당','특이사항','등록일'],
    ['김시현','B','중1','홍길동','TT','2','','','','2026-03-01'],
    ['박수현','A','중2','김철수','TTF','3','4','김은정','','2026-03-01'],
    ['김시현','C','초6','이영희','MWF','1','2','원장','','2026-05-12'],
    ['김은정','A','고1','박지원','MW','2','','','','2026-03-01'],
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:10},{wch:6},{wch:8},{wch:5},{wch:8},{wch:10},{wch:10},{wch:10},{wch:12},{wch:15}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '학생목록');
  XLSX.writeFile(wb, '학생_일괄추가_양식.xlsx');
}
</script>

<div class="card">
  <h2>📋 학생 일괄 추가 도구</h2>
  <p style="font-size:12px;color:#888;margin-bottom:16px">엑셀 파일로 학생을 한 번에 Firebase에 추가합니다.</p>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn btn-black" onclick="downloadSample()">📥 양식 다운로드</button>
    <label class="btn btn-blue" style="cursor:pointer">
      📂 엑셀 파일 선택
      <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this)">
    </label>
  </div>

  <div class="tip">
    📌 반 코드: <b>MW</b>=월수반 · <b>MWF</b>=월수금반 · <b>TT</b>=화목반 · <b>TTF</b>=화목금반<br>
    📌 레벨: <b>A</b> · <b>B</b> · <b>C</b> · <b>D</b> (없으면 비워두세요)<br>
    📌 금요일 수업이 없으면 금요일교시·금요일담당 비워두세요<br>
    📌 등록일: YYYY-MM-DD 형식 (예: 2026-05-12)
  </div>
</div>

<div class="card" id="preview" style="display:none">
  <h2>👀 미리보기 <span id="previewCount" style="font-size:12px;color:#888;font-weight:400"></span></h2>
  <div style="overflow-x:auto;margin-bottom:14px">
    <table>
      <thead>
        <tr>
          <th>#</th><th>평일담당</th><th>레벨</th><th>학년</th><th>이름</th><th>반</th>
          <th>평일교시</th><th>금교시</th><th>금담당</th><th>특이사항</th><th>등록일</th>
        </tr>
      </thead>
      <tbody id="previewBody"></tbody>
    </table>
  </div>
  <button class="btn btn-green" id="importBtn" onclick="importToFirebase()" disabled>
    🚀 Firebase에 저장
  </button>
</div>

<div class="card">
  <h2>📟 로그</h2>
  <div class="log" id="log">대기 중...\n</div>
</div>

</body>
</html>
