/* ── 클립보드 복사 ── */
function copyScoreClip(sid, dateStr){
  const l = getLesson(sid, dateStr) || {};
  const parts = [];
  if(l.homeworkScore || l.homeworkScore===0) parts.push('과제 ' + l.homeworkScore + '점');
  if(l.testScore || l.testScore===0){
    const fullRange = l.testIsFullRange ? '(전범위)' : '';
    parts.push('시험 ' + l.testScore + '점' + fullRange);
  }
  if(!parts.length){ toast('점수 데이터가 없습니다.', true); return; }
  const text = parts.join(', ');
  navigator.clipboard.writeText(text).then(()=>toast('📋 점수 복사됨: ' + text)).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('📋 점수 복사됨: ' + text);
  });
}

function copyProgressClip(sid, dateStr){
  const l = getLesson(sid, dateStr) || {};
  const parts = [];
  if(l.progress && l.progress.trim()) parts.push('진도: ' + l.progress.trim());
  if(l.homework && l.homework.trim()) parts.push('과제: ' + l.homework.trim());
  if(!parts.length){ toast('진도/과제 데이터가 없습니다.', true); return; }
  const text = parts.join(' / ');
  navigator.clipboard.writeText(text).then(()=>toast('📋 진도/과제 복사됨')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('📋 진도/과제 복사됨');
  });
}

// ── 실시간 커서 프레즌스 시스템 (최적화: 읽기/쓰기 최소화) ──
// 전략: 단일 문서 'presence/active' 에 {cellKey: {username, displayName, ts}} 형태로 저장
// - focus 시: 문서 1회 읽기 → 충돌 확인 후 → 1회 쓰기
// - blur 시: 1회 쓰기 (내 항목 제거)
// - input 이벤트에서는 Firestore 호출 없음 (로컬 캐시만 사용)
const _presenceDoc = 'active'; // presence 컬렉션의 단일 문서 ID
let _presenceLocal = {};   // 로컬에 캐시한 전체 프레즌스 상태
let _myActiveCells = new Set(); // 내가 현재 점유 중인 셀들
let _presenceRefreshTimer = null;

function _presenceDocRef(){
  const {doc}=fb();
  return doc(fbDb(),'presence',_presenceDoc);
}

// focus 시: 로컬 캐시 우선 사용, 캐시 만료(60초)된 경우에만 Firestore 읽기
let _presenceLastFetch = 0;
async function presenceFocus(cellKey){
  if(!session) return;
  try{
    const {getDoc,setDoc}=fb();
    const ref=_presenceDocRef();
    const now=Date.now();
    let current = _presenceLocal;
    // 60초 이상 지났을 때만 Firestore 읽기 (읽기 최소화)
    if(now - _presenceLastFetch > 60000){
      const snap=await getDoc(ref);
      current=snap.exists()?snap.data():{};
      _presenceLastFetch=now;
    }
    // 만료 항목 정리 (60초 초과)
    const cleaned={};
    Object.entries(current).forEach(([k,v])=>{
      if(now-new Date(v.ts).getTime()<60000) cleaned[k]=v;
    });
    // 충돌 확인 (로컬 캐시 기준)
    if(cleaned[cellKey] && cleaned[cellKey].username!==session.username){
      const other=cleaned[cellKey];
      toastConflict(`${other.displayName||other.username}님이 현재 이 셀을 입력 중입니다.`);
    }
    // 내 셀 등록 (쓰기 1회)
    cleaned[cellKey]={username:session.username, displayName:session.displayName||session.username, ts:new Date().toISOString()};
    _presenceLocal=cleaned;
    _myActiveCells.add(cellKey);
    await setDoc(ref, cleaned);
  }catch(e){}
}

// blur 시: 쓰기 1회(내 셀 제거) — getDoc 없이 로컬 캐시로 처리 (읽기 절약)
async function presenceBlur(cellKey){
  if(!session) return;
  _myActiveCells.delete(cellKey);
  try{
    const {setDoc}=fb();
    const ref=_presenceDocRef();
    // 로컬 캐시 기준으로 내 항목 제거 (Firestore 읽기 없이 쓰기만)
    if(_presenceLocal[cellKey]?.username===session.username){
      delete _presenceLocal[cellKey];
      await setDoc(ref, _presenceLocal);
    }
  }catch(e){}
}

// 페이지 닫힐 때 내 프레즌스 정리
window.addEventListener('beforeunload', ()=>{
  if(!_myActiveCells.size || !session) return;
  // beacon으로 비동기 정리 (best effort)
  try{
    const {doc,setDoc,getDoc}=fb();
    const ref=_presenceDocRef();
    getDoc(ref).then(snap=>{
      if(!snap.exists()) return;
      const d=snap.data();
      _myActiveCells.forEach(k=>{ if(d[k]?.username===session.username) delete d[k]; });
      setDoc(ref,d);
    });
  }catch(e){}
});

function toastConflict(msg){
  let t=document.getElementById('presenceToast');
  if(t){ t.querySelector('span:last-child').textContent=msg; return; }
  t=document.createElement('div');
  t.id='presenceToast';
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:#a05a00;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.25)';
  t.innerHTML=`<span>⚠️</span><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>t.style.opacity='1',10);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{ if(t.parentElement) t.remove(); },300);},3500);
}

// addPresenceToInput: input 이벤트에서 Firestore 호출 없음
function addPresenceToInput(inp, sid, dateStr, field){
  const cellKey=`${sid}__${dateStr}__${field}`;
  inp.addEventListener('focus',()=>presenceFocus(cellKey));
  inp.addEventListener('blur',()=>presenceBlur(cellKey));
  // input 이벤트: 로컬 캐시만 확인 (Firestore 호출 없음)
  inp.addEventListener('input',()=>{
    const cached=_presenceLocal[cellKey];
    if(cached && cached.username!==session?.username){
      const age=Date.now()-new Date(cached.ts).getTime();
      if(age<=30000) toastConflict(`${cached.displayName||cached.username}님이 현재 이 셀을 입력 중입니다.`);
    }
  });
}

function toast(msg,isErr=false){
  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:20px;right:20px;background:${isErr?'#a02828':'#1a1a1a'};color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.style.opacity='1',10);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);
}

// 자동 로그인 — 이전 세션 복원
(async function autoLogin(){
  const saved=localStorage.getItem('session');
  if(!saved) return;
  try{
    session=JSON.parse(saved);
    // Firebase 준비 대기
    let waited=0;
    while(!window._fbReady&&waited<5000){ await new Promise(r=>setTimeout(r,100)); waited+=100; }
    if(!window._fbReady){ return; }
    // 세션 검증: USERS(원장) 또는 cfg.teachers(선생님)에 있는지
    const isPrincipal=Object.values(USERS).find(u=>u.username===session.username);
    if(!isPrincipal){
      // cfg 로드 후 선생님 명단 확인
      if(!cfg) await loadConfig();
      const teachers=(cfg?.teachers||[]).filter(Boolean);
      if(!teachers.includes(session.username)){
        session=null; localStorage.removeItem('session'); return;
      }
    }
    await showApp();
  }catch(e){ localStorage.removeItem('session'); }
})();
