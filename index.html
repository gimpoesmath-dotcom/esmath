// 출결 포인트 정산 실행
async function confirmAttendSettle(year, month){
  const selMap = st.ptAttendSel||{};
  const studs  = cfg.students||[];
  const targets = studs.filter(s=>selMap[s.id]==='perfect'||selMap[s.id]==='steady');
  if(!targets.length){ toast('선택된 학생이 없습니다',true); return; }

  const yl = `${year}년 ${month}월`;
  const lines = targets.map(s=>`${s.name}: ${selMap[s.id]==='perfect'?'PERFECT +'+PT.PERFECT.toLocaleString()+'P':'STEADY +'+PT.STEADY.toLocaleString()+'P'}`);
  if(!confirm(`${yl} 출결 포인트를 적립합니다.\n\n${lines.join('\n')}\n\n계속하시겠어요?`)) return;

  setSyncState('syncing','출결 포인트 적립 중...');
  const settleKey = `attend_${year}-${String(month).padStart(2,'0')}`;

  for(const s of targets){
    const grade = selMap[s.id];
    const pts   = grade==='perfect' ? PT.PERFECT : PT.STEADY;
    const label = grade==='perfect' ? 'PERFECT 출석상' : 'STEADY 출석상';
    const type  = grade==='perfect' ? 'PERFECT' : 'STEADY';
    const pd = pointsData[s.id]||{balance:0,history:[],attendSettled:[]};
    pd.balance = (pd.balance||0) + pts;
    pd.history = [...(pd.history||[]), {
      id:'h'+Date.now()+Math.random(),
      type, label, points:pts,
      note:`어나더클래스 출결 인증 · ${yl}`,
      year, month,
      date:dk(new Date()),
      by:session?.username||'',
    }];
    pd.attendSettled = [...(pd.attendSettled||[]), settleKey];
    await savePointsData(s.id, pd);
  }

  // 선택 안 된 학생도 "정산완료" 마킹 (없음 선택)
  const allFiltered = (cfg.students||[]).filter(s=>!isAttendSettled(s.id,year,month));
  for(const s of allFiltered){
    if(selMap[s.id]==='perfect'||selMap[s.id]==='steady') continue;
    const pd = pointsData[s.id]||{balance:0,history:[],attendSettled:[]};
    pd.attendSettled = [...(pd.attendSettled||[]), settleKey];
    await savePointsData(s.id, pd);
  }

  st.ptAttendSel={};
  setSyncState('ok','완료');
  toast(`${yl} 출결 포인트 적립 완료 (${targets.length}명)`);
  render();
}

// 출결 포인트 없음으로 정산 완료 처리
async function skipAttendSettle(year, month){
  if(!confirm(`${year}년 ${month}월 출결 포인트를 '없음'으로 정산 완료 처리합니다.\n계속하시겠어요?`)) return;
  const settleKey = `attend_${year}-${String(month).padStart(2,'0')}`;
  const studs = cfg.students||[];
  setSyncState('syncing','처리 중...');
  for(const s of studs){
    if(isAttendSettled(s.id,year,month)) continue;
    const pd = pointsData[s.id]||{balance:0,history:[],attendSettled:[]};
    pd.attendSettled = [...(pd.attendSettled||[]), settleKey];
    await savePointsData(s.id, pd);
  }
  setSyncState('ok','완료');
  toast('출결 정산 완료 처리됐습니다'); render();
}

// 출결 정산 취소 (개별)
async function resetAttendSettle(sid, year, month){
  if(!confirm('이 학생의 출결 정산을 취소하고 다시 선택할 수 있게 합니다.\n(이미 적립된 포인트는 내역에서 직접 삭제해주세요)')) return;
  const settleKey = `attend_${year}-${String(month).padStart(2,'0')}`;
  const pd = pointsData[sid];
  if(!pd) return;
  pd.attendSettled = (pd.attendSettled||[]).filter(k=>k!==settleKey);
  await savePointsData(sid, pd);
  toast('정산 취소됐습니다'); render();
}

// 출결 정산 여부 확인 (attendSettled 기준)
function isAttendSettled(sid, year, month){
  const settleKey = `attend_${year}-${String(month).padStart(2,'0')}`;
  return (pointsData[sid]?.attendSettled||[]).includes(settleKey);
}

// 기타 포인트 (DAILY/MASTER) 개별 적립
// 특정 연/월의 lesson 데이터를 로드 (캐시 활용)
// 현재 보는 달(mdb)과 같으면 mdb.lessons 반환, 다르면 Firestore에서 로드
// 단순 Firestore 로드 (머지 없음) — 내부 전용
const _rawLessonsCache = {}; // 머지 전 단순 캐시 (prevMonthLessonsCache와 분리)
async function _fetchMonthRaw(y, m){
  const k=`${y}-${String(m).padStart(2,'0')}`;
  if(_rawLessonsCache[k]) return _rawLessonsCache[k];
  try{
    const {getDocs,collection}=fb();
    const snaps=await getDocs(collection(fbDb(),`lessons_${k}`));
    const d={};
    snaps.forEach(s=>{ const v=s.data(); d[v.key||s.id]=v; });
    _rawLessonsCache[k]=d;
    return d;
  }catch(e){ return {}; }
}

// 머지 완료 캐시 (3-way merge)
const _mergedLessonsCache = {};

async function _loadLessonsForMonth(year, month){
  if(year===st.year && month===st.month) return mdb.lessons;
  const cacheKey=`${year}-${String(month).padStart(2,'0')}`;
  if(_mergedLessonsCache[cacheKey]) return _mergedLessonsCache[cacheKey];
  try{
    // mdb.lessons 와 동일하게 이전달 + 해당달 + 다음달 3-way 머지
    // 우선순위: 이전달 < 다음달 < 해당달
    const pm = month===1?12:month-1, py = month===1?year-1:year;
    const nm = month===12?1:month+1, ny = month===12?year+1:year;
    const [prevL, curL, nextL] = await Promise.all([
      _fetchMonthRaw(py, pm),
      _fetchMonthRaw(year, month),
      _fetchMonthRaw(ny, nm),
    ]);
    const merged = Object.assign({}, prevL, nextL, curL);
    _mergedLessonsCache[cacheKey]=merged;
    // prevMonthLessonsCache도 동기화 (다른 코드에서 참조할 수 있으므로)
    prevMonthLessonsCache[cacheKey]=merged;
    return merged;
  }catch(e){
    console.warn('월 데이터 로드 실패:', cacheKey, e);
    return {};
  }
}

async function settleOtherPoints(sid, year, month){
  const s = (cfg.students||[]).find(x=>x.id===sid);
  if(!s) return;
  // 정산 기준월이 현재 보는 월과 다르면 해당 월 데이터 로드
  const lessonsOverride = await _loadLessonsForMonth(year, month);
  const earned = calcMonthPoints(sid, s.classType, year, month, lessonsOverride)
    .filter(e=>e.type==='DAILY'||e.type==='MASTER_HIGH'||e.type==='MASTER_LOW');
  if(!earned.length){ toast('적립할 포인트가 없습니다',true); return; }
  const total = earned.reduce((a,e)=>a+e.points,0);
  if(!confirm(`${s.name} — ${earned.map(e=>e.label+' +'+e.points.toLocaleString()+'P').join(', ')} 적립하시겠어요?`)) return;
  const pd = pointsData[sid]||{balance:0,history:[],attendSettled:[]};
  for(const e of earned){
    pd.balance = (pd.balance||0)+e.points;
    pd.history = [...(pd.history||[]),{
      id:'h'+Date.now()+Math.random(),
      type:e.type, label:e.label, points:e.points,
      note:e.note, year, month,
      date:dk(new Date()), by:session?.username||'',
    }];
  }
  await savePointsData(sid, pd);
  toast(`+${total.toLocaleString()}P 적립됐습니다`); render();
}

/* ── WEEKLY EXCEL EXPORT ── */
function exportWeeklyExcel(){
  const isPrin=session?.role==='principal';
  const allStuds=cfg.students||[];
  // 선생님이고 viewAll 꺼져있으면 본인 담당 학생만 엑셀에 포함
  const studs=(!isPrin && !st.viewAll)
    ? allStuds.filter(s=>isStudentOfTeacher(s, session?.username))
    : allStuds;
  if(!studs.length){ toast('학생이 없습니다',true); return; }

  // 학생별 4주차 계산 (rWeekly와 동일한 로직)
  const calcWeeks=(s)=>{
    const sessions=sessionsForMonthWithCycle(s.classType,st.year,st.month);
    if(!sessions.length) return [];
    const perWeek=Math.max(1, Math.round(sessions.length/4));
    const weeks=[];
    for(let i=0; i<sessions.length; i+=perWeek){
      const chunk=sessions.slice(i,i+perWeek);
      if(!chunk.length) break;
      weeks.push({weekNo:weeks.length+1, sessions:chunk, dates:chunk.map(x=>x.dateStr)});
      if(weeks.length>=4) break;
    }
    return weeks;
  };
  const calcStats=(sid, dates)=>{
    let attend=0,absent=0,late=0,hwScores=[],testScores=[];
    dates.forEach(d=>{
      const l=mdb.lessons[lk(sid,d)]; if(!l) return;
      if(l.attendance==='attend') attend++;
      else if(l.attendance==='absent') absent++;
      else if(l.attendance==='late') late++;
      const hs=parseFloat(l.homeworkScore); if(!isNaN(hs)) hwScores.push(hs);
      if(!l.testIsFullRange){
        const ts=parseFloat(l.testScore); if(!isNaN(ts)) testScores.push(ts);
      }
    });
    const hwAvg=hwScores.length?Math.round(hwScores.reduce((a,b)=>a+b,0)/hwScores.length):null;
    const testAvg=testScores.length?Math.round(testScores.reduce((a,b)=>a+b,0)/testScores.length):null;
    return {attend,absent,late,hwAvg,testAvg};
  };

  const wb=XLSX.utils.book_new();
  const rows=[['학생','반','주차','회차','출석','지각','결석','과제평균','시험평균','응용력','집중도','과제충실도','전범위 시험','메모','관리필요']];
  studs.forEach(s=>{
    const ct=CT()[s.classType];
    const weeks=calcWeeks(s);
    weeks.forEach(w=>{
      const stats=calcStats(s.id, w.dates);
      const wKey=`${st.year}-${String(st.month).padStart(2,'0')}-w${w.weekNo}`;
      const ev=getWkEval(s.id,wKey);
      const alerts=getAlerts(stats, ev);
      // 전범위 시험 (주차 범위 안)
      const sortedDates=[...w.dates].sort();
      const fullTests=getFullRangeTestsInWeek(s.id, sortedDates[0], sortedDates[sortedDates.length-1]);
      const fullTestText=fullTests.map(t=>{
        const ord=t.attempt===1?'시험':`${t.attempt}차시험`;
        return `${t.textbookName} 전범위 ${ord}: ${t.score}점 ${t.passed?'합격':'불합격'}`;
      }).join(' / ');
      const sessionRange=w.sessions.length?`${w.sessions[0].sessionNo}~${w.sessions[w.sessions.length-1].sessionNo}회차`:'';
      rows.push([
        s.name, ct?.label||s.classType, `${w.weekNo}주차`, sessionRange,
        stats.attend, stats.late, stats.absent,
        stats.hwAvg!==null?stats.hwAvg:'',
        stats.testAvg!==null?stats.testAvg:'',
        ev.app||'', ev.focus||'', ev.hw||'',
        fullTestText,
        ev.memo||'',
        alerts.length?'⚠️ '+alerts.map(a=>a.text).join(', '):''
      ]);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:12},{wch:8},{wch:12},{wch:6},{wch:6},{wch:6},{wch:10},{wch:10},{wch:8},{wch:8},{wch:10},{wch:40},{wch:24},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws,`${st.year}년 ${st.month}월 주간요약`);
  XLSX.writeFile(wb,`주간요약_${st.year}${String(st.month).padStart(2,'0')}.xlsx`);
  toast('주간요약 엑셀 다운로드 완료');
}

/* ── MATRIX ── */
function rMatrix(){
  const isPrin=session?.role==='principal';
  const teacherFilter=isPrin?(st.matrixTeacher||''):'';
  const allCTs=CT();

  // 큰 틀 그룹 정의 (요일 패턴 기준)
  const daySetStr=(days)=>[...days].sort((a,b)=>a-b).join(',');
  const BASE_GROUPS=[
    {key:'mw',  label:'월수반',   dayPat:'1,3'},
    {key:'mwf', label:'월수금반', dayPat:'1,3,5'},
    {key:'tt',  label:'화목반',   dayPat:'2,4'},
    {key:'ttf', label:'화목금반', dayPat:'2,4,5'},
  ];

  // 큰 틀 드롭다운: 해당 큰 틀에 속하는 classType이 있는 것만 표시
  const groupsWithClasses=BASE_GROUPS.filter(g=>
    Object.values(allCTs).some(ct=>daySetStr(ct.days||[])===g.dayPat)
  );

  // 현재 선택: 큰 틀 key ('__all__' = 전체)
  const selGroup=st.matrixGroup||'__all__';
  const curGroup=BASE_GROUPS.find(g=>g.key===selGroup)||null;

  // 전체 반: 등록된 모든 classType
  const allClsEntries=Object.entries(allCTs).sort(([,a],[,b])=>{
    const baseOrder=['MW','MWF','TT','TTF'];
    const oa=baseOrder.indexOf(a.baseType||''), ob=baseOrder.indexOf(b.baseType||'');
    return (oa<0?99:oa)-(ob<0?99:ob);
  });

  // 선택된 그룹에 해당하는 classType 목록
  const clsInGroup= selGroup==='__all__'
    ? allClsEntries
    : allClsEntries.filter(([k,v])=>daySetStr(v.days||[])===curGroup?.dayPat);

  const groupOpts=`<option value="__all__" ${selGroup==='__all__'?'selected':''}>전체 반</option>`
    +groupsWithClasses.map(g=>`<option value="${g.key}" ${selGroup===g.key?'selected':''}>${g.label}</option>`).join('');

  if(!clsInGroup.length){
    return `<div class="toolbar">
      <div class="tleft">
        <select onchange="st.matrixGroup=this.value;render()" style="font-size:13px;font-weight:600">
          ${groupOpts}
        </select>
      </div>
    </div><div class="empty">등록된 반이 없습니다.<br><small style="color:var(--text3)">설정 탭에서 반을 먼저 추가해주세요.</small></div>`;
  }

  const todayStr=dk(new Date());

  // 필터 바 데이터 계산
  const _gradeF0=st.studentGradeFilter||'';
  const _levelF0=st.studentLevelFilter||'';
  const _attF0=st.studentAttFilter||'';
  const _teacherF0=st.studentTeacherFilter||'';
  const allStuds=cfg.students||[];
  // 학년 목록
  const gradeSet=[...new Set(allStuds.map(s=>s.grade).filter(Boolean))].sort();
  const byGrade0={};
  gradeSet.forEach(g=>{ byGrade0[g]=(allStuds.filter(s=>s.grade===g)).length; });
  const elems0=gradeSet.filter(g=>g.startsWith('초'));
  const middle0=gradeSet.filter(g=>g.startsWith('중'));
  const high0=gradeSet.filter(g=>g.startsWith('고'));
  const renderGradeGroup=(label,color,bg,border,arr)=>{
    if(!arr.length) return '';
    const groupActive=arr.some(g=>g===_gradeF0);
    const items=arr.map(g=>{
      const active=_gradeF0===g;
      return `<span onclick="st.studentGradeFilter=st.studentGradeFilter==='${g}'?'':'${g}';render()" style="font-size:11px;font-weight:600;cursor:pointer;padding:1px 4px;border-radius:10px;${active?'background:rgba(0,0,0,0.12);text-decoration:underline;':''}">${g.replace('초','').replace('중','').replace('고','')}학년 ${byGrade0[g]}</span>`;
    }).join('<span style="color:#ccc;margin:0 2px">·</span>');
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:${bg};color:${color};border:1px solid ${border};border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;${groupActive?'outline:2px solid '+color+';outline-offset:1px;':''}">${label} ${items}</span>`;
  };
  // 이름 검색 필터
  const _nameF0=st.matrixNameSearch||'';
  const isFiltered0=_gradeF0||_levelF0||_teacherF0||_nameF0;

  let filterBar=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px">`;
  // 이름 검색 인풋 (DOM 직접 필터 방식 — render 없이 실시간)
  filterBar+=`<div style="display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border2);border-radius:20px;padding:2px 10px">
    <span style="font-size:12px;color:var(--text3)">🔍</span>
    <input type="text" id="matrixNameSearch" placeholder="이름 검색" value="${esc(_nameF0)}"
      oninput="matrixNameSearchFilter(this.value)"
      style="border:none;outline:none;font-size:12px;width:100px;background:transparent;font-family:inherit;color:var(--text)">
    ${_nameF0?`<span onclick="matrixNameSearchFilter('');document.getElementById('matrixNameSearch').value=''" style="font-size:12px;cursor:pointer;color:var(--text3)">✕</span>`:''}
  </div>`;
  if(gradeSet.length){ filterBar+=renderGradeGroup('초등','#5a3c00','#fef3e2','#e8c87a',elems0); filterBar+=renderGradeGroup('중등','#1e4a80','#e5effc','#90b8e8',middle0); filterBar+=renderGradeGroup('고등','#3a1e6e','#f0e8fc','#c090e0',high0); }
  if(isFiltered0) filterBar+=`<button class="btn btn-sm" onclick="st.studentGradeFilter='';st.studentLevelFilter='';st.studentTeacherFilter='';matrixNameSearchFilter('');const ni=document.getElementById('matrixNameSearch');if(ni)ni.value='';render()" style="font-size:11px">✕ 필터 초기화</button>`;
  filterBar+=`</div>`;

  let h=`<div class="toolbar">
    <div class="tleft" style="flex-wrap:wrap;gap:8px">
      <select onchange="st.matrixGroup=this.value;render()" style="font-size:13px;font-weight:600;padding:5px 10px">
        ${groupOpts}
      </select>
      ${isPrin?`<select onchange="setMTeacher(this.value)" title="선생님별 필터">
        <option value="" ${!teacherFilter?'selected':''}>👩‍🏫 전체 선생님</option>
        ${allTeachers().map(t=>`<option value="${esc(t)}" ${teacherFilter===t?'selected':''}>${esc(t)}</option>`).join('')}
      </select>`:''}
    </div>
    <button class="btn btn-green" onclick="exportExcel()">📥 엑셀 다운로드</button>
  </div>`;
  h+=filterBar;

  // 교시별로 각각 테이블 렌더
  let anyRendered=false;
  clsInGroup.forEach(([cls, ct])=>{
    let studs=(cfg.students||[]).filter(s=>s.classType===cls);
    if(teacherFilter) studs=studs.filter(s=>isStudentOfTeacher(s,teacherFilter));
    if(!isPrin && !st.viewAll) studs=studs.filter(s=>isStudentOfTeacher(s,session?.username));
    // 학년/선생님 필터
    const _gradeF=st.studentGradeFilter||'';
    const _levelF=st.studentLevelFilter||'';
    const _teacherF=st.studentTeacherFilter||'';
    const _nameF=st.matrixNameSearch||'';
    if(_gradeF) studs=studs.filter(s=>s.grade===_gradeF);
    if(_levelF) studs=studs.filter(s=>s.level===_levelF);
    if(_teacherF) studs=studs.filter(s=>isStudentOfTeacher(s,_teacherF));
    if(_nameF) studs=studs.filter(s=>(s.name||'').includes(_nameF));
    if(!studs.length) return;

    const monthSessions=sessionsForMonthWithCycle(cls,st.year,st.month);
    const dates=monthSessions.map(x=>x.dateStr);
    if(!dates.length) return;

    // 데일리테스트 평균 계산 (결석·전범위 제외)
    window._matrixTestAvg=window._matrixTestAvg||{};
    studs.forEach(s=>{
      const scores=dates.map(d=>{
        const l=getLesson(s.id,d);
        if(!l||l.attendance==='absent'||l.testIsFullRange) return null;
        const v=parseFloat(l.testScore); return isNaN(v)?null:v;
      }).filter(v=>v!==null);
      window._matrixTestAvg[s.id]=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
    });

    const satDays=getMakeupDays();
    const mergedCols=[];
    monthSessions.forEach(info=>mergedCols.push({type:'session',dateStr:info.dateStr,sessionNo:info.sessionNo,prevCycle:info.prevCycle||false,info}));
    satDays.forEach(e=>mergedCols.push({type:'sat',dateStr:e.date}));
    mergedCols.sort((a,b)=>a.dateStr.localeCompare(b.dateStr));

    // 교시 헤더
    const periodLabel=ct.period?`${ct.period}교시`:'';
    h+=`<div style="margin-bottom:20px">
      <div style="padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;gap:8px">
        <span class="badge ${ct.badge||'b-mwf'}">${esc(ct.label)}</span>
        ${periodLabel?`<b style="font-size:14px">⏰ ${periodLabel}</b>`:''}
        <span style="font-size:12px;color:var(--text2)">${studs.length}명</span>
      </div>`;
    h+=renderMatrixTable(studs,mergedCols,todayStr,cls);
    h+=`</div>`;
    anyRendered=true;
  });

  if(!anyRendered){
    h+=`<div class="empty">${curGroup?.label||''} 에 표시할 학생이 없습니다.</div>`;
  }
  return h;
}

function renderMatrixTable(studs,mergedCols,todayStr,cls){
  let h=`<div class="matrix-wrap" id="matrixWrap"><table class="mtbl"><thead><tr><th class="col-student hdr" rowspan="2">학생</th>`;
  mergedCols.forEach(col=>{
    const d=col.dateStr;
    const isT=d===todayStr;
    const dl=DAY[parseDate(d).getDay()];
    if(col.type==='session'){
      const dDate=parseDate(d);
      const dY=dDate.getFullYear(), dM=dDate.getMonth()+1;
      const isOtherMonth=(dY!==st.year || dM!==st.month);
      const isPrevMonth=isOtherMonth && (dY<st.year || (dY===st.year && dM<st.month));
      const overflowCls=isOtherMonth?' overflow-month':'';
      const monthLabel=isOtherMonth?`<span style="font-size:9px;color:#a05a00;font-weight:600;display:block">${isPrevMonth?'↰':'↳'} ${dM}월</span>`:'';
      // 이전달 사이클에 속한 회차 (이번달 탭에서 이전달 회차로 표시)
      if(col.prevCycle){
        const pm=st.month===1?12:st.month-1;
        h+=`<th class="sess-group overflow-month${isT?' today-g':''}" colspan="7" style="background:#f0e8ff;color:#5a2080;border-left:3px solid #c090e0">
          <span style="font-size:9px;color:#7a4e00;font-weight:700;display:block">↰ ${pm}월 이월</span>
          ${col.sessionNo}회차
          <span style="font-size:9px;font-weight:400">${d.slice(5)} (${dl})</span>
        </th>`;
      } else {
        h+=`<th class="sess-group${isT?' today-g':''}${overflowCls}" colspan="7">
          ${col.sessionNo}회차
          <span style="font-size:9px;font-weight:400">${d.slice(5)} (${dl})</span>
          ${monthLabel}
        </th>`;
      }
    } else {
      // 토요보강
      h+=`<th class="sess-group sat-group${isT?' today-g':''}" colspan="7">
        <span style="color:#7a4e00">📅 토요보강</span>
        <span style="font-size:9px;font-weight:400">${d.slice(5)} (${dl})</span>
      </th>`;
    }
  });
  h+=`</tr><tr>`;
  mergedCols.forEach(col=>{
    const isT=col.dateStr===todayStr;
    const isSat=col.type==='sat';
    const isPrevCycle=col.prevCycle||false;
    SUBS.forEach(sc=>{

        h+=`<td class="dcell${tc}" style="min-width:100px;max-width:130px">${ph?`<span class="prev-chip" title="${ph.date?ph.date+' 과제: ':''} ${esc(ph.hw)}">📋 ${esc(ph.hw)}</span>`:''}<textarea class="tinp" onblur="mSaveHw('${s.id}','${d}','${cls}',this.value)">${esc(l.homework||'')}</textarea></td>`;
        h+=`<td class="dcell c${tc}"><span class="chk" onclick="mToggle('${s.id}','${d}','makeupClass')">${l.makeupClass?'✅':'☐'}</span></td>`;
        h+=`<td class="dcell${tc}" style="min-width:90px;max-width:130px"><textarea class="tinp" onblur="mSave('${s.id}','${d}','note',this.value)">${esc(l.note||'')}</textarea></td>`;
      }
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;return h;
}

/* ── 단원 체크 패널 렌더 ── */
function renderUnitCheckPanels(sid, tbs, dow, dateStr){
  if(!tbs||!tbs.length) return '';
  const isFriday=(dow===5);
  const books=cfg.textbooks||[];
  let html='<div style="margin-top:8px">';
  let anyPanel=false;

  tbs.forEach(function(t){
    const bk=t.tbId?(books.find(function(b){return b.id===t.tbId;})||null):null;
    // unitCount가 설정된 교재에만 단원 패널 표시
    if(!bk || !bk.unitCount || bk.unitCount<=0) return;
    const tbName=bk?bk.name:(t.name||'교재');
    const tbId=t.tbId||('p_'+sid+'_'+encodeURIComponent(t.name||''));
    const key=sid+'_'+tbId;
    let units=textbookUnits[key]||[];

    // 오늘 입력에서만: 전범위 시험 통과 또는 모든 단원을 명시적으로 완료처리한 경우 패널 숨김
    // 단순 체크박스 체크는 숨김 조건 아님 — manualComplete만 해당
    if(dateStr){
      const myTests=textbookTests[sid]||{};
      const attempts=myTests[tbId]||[];
      const tbPassed=attempts.some(function(a){return a.passed;});
      // 모든 단원이 명시적 완료처리(manualComplete===true)인 경우만 숨김
      const hasUnits=units.length>0;
      const allManualComplete=hasUnits && units.every(function(u){return u.manualComplete===true;});
      if(tbPassed || allManualComplete) return;
    }
    anyPanel=true;

    // 단원이 없고 교재에 unitCount가 설정된 경우 자동 초기화
    // 단, textbookUnits가 아직 로드 중이면 절대 초기화하지 않음 (기존 데이터 덮어쓰기 방지)
    if(!units.length && bk && bk.unitCount>0 && _loaded.textbookUnits){
      // 교재 추가 시 저장된 템플릿 단원명 참조
      const templateKey='__template___'+tbId;
      const templateUnits=textbookUnits[templateKey]||[];
      units=[];
      for(let i=1;i<=bk.unitCount;i++){
        units.push({
          name: templateUnits[i-1]?.name||`${i}단원`,
          checked:false, score:null, checkedDate:'', addedDate:dk(new Date())
        });
      }
      saveTbUnits(sid,tbId,units).catch(e=>console.warn('단원 자동 초기화 실패:',e));
      textbookUnits[key]=units;
    }
    const safeId='up_'+sid.replace(/[^a-z0-9]/gi,'_')+'__'+tbId.replace(/[^a-z0-9]/gi,'_');
    // 패널이 닫혀 있어도 _unitMap에 항상 등록 (저장 함수가 찾을 수 있도록)
    if(!window._unitMap) window._unitMap={};
    window._unitMap[safeId]={sid, tbId, dateStr: dateStr||''};

    const needsTestCount=units.filter(u=>u.checked&&!u.manualComplete&&(u.score===null||u.score===undefined||u.score==='')).length;
    const checkedCount=units.filter(u=>u.checked||u.manualComplete).length;
    const scoredCount=units.filter(u=>u.checked&&u.score!==null&&u.score!==undefined&&u.score!=='').length;
    const completeCount=units.filter(u=>u.manualComplete).length;
    const needsTestNames=units.filter(u=>u.checked&&!u.manualComplete&&(u.score===null||u.score===undefined||u.score==='')).map(u=>u.name||'').filter(Boolean);

    // 금요일 알림 배지 — 시험 필요한 단원명 직접 표시
    const friBadgeLabel=needsTestNames.length
      ? needsTestNames.join(', ')+'  시험'
      : '';
    const friBadge=isFriday&&needsTestCount>0
      ?`<span class="unit-fri-badge">🔔 ${friBadgeLabel}</span>`:'';

    // 금요일 알림 배지 (패널은 항상 닫힌 채로 시작 — 배지로만 알림)
    const autoOpen=false;

    html+=`<div class="unit-panel" id="upanel_${safeId}">
      <div class="unit-panel-hdr" onclick="toggleUnitPanel('ubody_${safeId}','uarrow_${safeId}')">
        <span style="font-size:11px;font-weight:700;color:var(--blue)">📖 ${esc(tbName)}</span>
        <span style="display:flex;align-items:center;gap:5px;flex-shrink:0">
          <span id="ustat_${safeId}" style="display:flex;align-items:center;gap:5px">
            ${friBadge}
            <span style="font-size:10px;color:var(--text2)">${checkedCount}/${units.length}완료${scoredCount?` · ${scoredCount}점수`:''}${completeCount?` · ${completeCount}완료처리`:''}</span>
          </span>
          <span id="uarrow_${safeId}" style="font-size:10px;color:var(--text3)">${autoOpen?'▲':'▼'}</span>
        </span>
      </div>
      <div class="unit-panel-body" id="ubody_${safeId}" style="display:${autoOpen?'block':'none'}">
        ${buildUnitRows(sid, tbId, safeId, units, isFriday)}
      </div>
    </div>`;
  });

  html+='</div>';
  return anyPanel ? html : '';
}

/* 단원 행 HTML 생성 (렌더 + 리프레시 공용) */
// safeId → {sid, tbId} 맵 (페이지 내 룩업용)
if(!window._unitMap) window._unitMap={};

function buildUnitRows(sid, tbId, safeId, units, isFriday){
  // 전역 맵에 등록 (이벤트 핸들러에서 tbId 역참조용) — dateStr은 기존 값 유지
  if(!window._unitMap) window._unitMap={};
  const existing=window._unitMap[safeId]||{};
  window._unitMap[safeId]={sid, tbId, dateStr: existing.dateStr||''};

  let inner='';
  if(!units.length){
    inner+=`<div style="font-size:11px;color:var(--text3);padding:4px 2px">등록된 단원이 없습니다. 아래에서 추가하세요.</div>`;
  } else {
    units.forEach(function(u,ui){
      const hasScore=(u.score!==null&&u.score!==undefined&&u.score!=='');
      const isComplete=!!u.manualComplete;
      const needsTest=isFriday&&u.checked&&!hasScore&&!isComplete;
      inner+=`<div class="unit-row" id="urow_${safeId}_${ui}">
        <input type="checkbox" class="unit-chk" ${u.checked||isComplete?'checked':''}
          onchange="unitToggleCheck('${safeId}',${ui},this.checked)">
        <span class="unit-name" style="${u.checked||isComplete?'text-decoration:line-through;color:var(--text3)':'color:var(--text)'}">${esc(u.name||'단원 '+(ui+1))}</span>
        ${isComplete
          ? `<span style="font-size:10px;color:var(--green);font-weight:700;padding:2px 6px;background:var(--green-bg);border-radius:4px;border:1px solid #80c090">✅ 완료</span>
             <button onclick="unitMarkComplete('${safeId}',${ui},false)" style="flex-shrink:0;padding:1px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text3);cursor:pointer">취소</button>`
          : `<input type="text" class="unit-score-inp${needsTest?' needs-test':''}"
              value="${hasScore?esc(String(u.score)):''}"
              placeholder="${needsTest?'🔔점수':'점수'}"
              title="${needsTest?'금요일 시험 예정':''}"
              onblur="unitSaveScore('${safeId}',${ui},this.value)">
             <button onclick="unitMarkComplete('${safeId}',${ui},true)" style="flex-shrink:0;padding:1px 6px;font-size:10px;border:1px solid #80c090;border-radius:4px;background:var(--green-bg);color:var(--green);cursor:pointer;white-space:nowrap" title="시험 없이 완료 처리">완료</button>`
        }
      </div>`;
    });
  }
  return inner;
}

/* ── 교재 설정에서 전체 학생 단원 일괄 초기화 ── */
async function unitResetAllStudents(tbId, count){
  if(!count||count<=0){ toast('단원 수가 설정되지 않았습니다.', true); return; }
  // 이 교재를 배정받은 학생 목록
  const assigned = (cfg.students||[]).filter(s=>(s.textbooks||[]).some(t=>t.tbId===tbId));
  if(!assigned.length){ toast('이 교재를 배정받은 학생이 없습니다.', true); return; }
  if(!confirm(`${count}단원 기준으로 ${assigned.length}명 학생의 단원 목록을 초기화합니다.
기존 체크/점수는 유지됩니다.
계속하시겠어요?`)) return;

  let ok=0, fail=0;
  for(const s of assigned){
    const key=s.id+'_'+tbId;
    const existing=JSON.parse(JSON.stringify(textbookUnits[key]||[]));
    const existingMap={};
    existing.forEach(u=>{ if(u.name) existingMap[u.name]=u; });
    const newUnits=[];
    for(let i=1;i<=count;i++){
      const name=`${i}단원`;
      newUnits.push(existingMap[name]||{name,checked:false,score:null,checkedDate:'',addedDate:dk(new Date())});
    }
    try{
      await saveTbUnits(s.id,tbId,newUnits);
      ok++;
    }catch(e){ fail++; }
  }
  toast(`단원 초기화 완료: ${ok}명 성공${fail?` · ${fail}명 실패`:''}`);
  render();
}

/* ── 단원 강제 초기화 (unitCount 기준, 기존 데이터 병합) ── */
async function unitResetToCount(safeId, count){
  const r=window._unitMap[safeId];
  if(!r){ toast('단원 정보를 찾을 수 없습니다.', true); return; }
  const {sid, tbId}=r;
  const key=sid+'_'+tbId;
  const existing=JSON.parse(JSON.stringify(textbookUnits[key]||[]));

  // 기존 단원명 맵 (이름 기준으로 체크/점수 유지)
  const existingMap={};
  existing.forEach(u=>{ if(u.name) existingMap[u.name]=u; });

  // unitCount 기준으로 1~N단원 생성, 기존 데이터 있으면 병합
  const newUnits=[];
  for(let i=1;i<=count;i++){
    const name=`${i}단원`;
    if(existingMap[name]){
      newUnits.push(existingMap[name]); // 기존 데이터 유지
    } else {
      newUnits.push({name,checked:false,score:null,checkedDate:'',addedDate:dk(new Date())});
    }
  }

  try{
    await saveTbUnits(sid,tbId,newUnits);
    refreshUnitPanelById(sid,tbId,safeId);
    toast(`${count}단원 기준으로 초기화 완료 (기존 체크/점수 유지)`);
  }catch(e){ toast('초기화 실패: '+e.message, true); }
}

/* ── 단원 패널 토글 ── */
function toggleUnitPanel(bodyId, arrowId){
  const el=document.getElementById(bodyId);
  const arrow=document.getElementById(arrowId);
  if(!el) return;
  const opening=el.style.display==='none';
  el.style.display=opening?'block':'none';
  if(arrow) arrow.textContent=opening?'▲':'▼';
  // 열릴 때 입력창에 포커스
  if(opening){
    const inp=el.querySelector('.unit-add-inp');
    if(inp) setTimeout(()=>inp.focus(),50);
  }
}

/* ── 공통 리프레시 ── */

  const d = st.todayDate instanceof Date ? st.todayDate : parseDate(dk(new Date()));
  const isFriday=(d.getDay()===5);
  const key=sid+'_'+tbId;
  const units=textbookUnits[key]||[];
  const needsTestCount=units.filter(u=>u.checked&&!u.manualComplete&&(u.score===null||u.score===undefined||u.score==='')).length;
  const checkedCount=units.filter(u=>u.checked||u.manualComplete).length;
  const scoredCount=units.filter(u=>u.checked&&u.score!==null&&u.score!==undefined&&u.score!=='').length;
  const completeCount=units.filter(u=>u.manualComplete).length;
  const needsTestNames2=units.filter(u=>u.checked&&!u.manualComplete&&(u.score===null||u.score===undefined||u.score==='')).map(u=>u.name||'').filter(Boolean);

  // 통계 배지 업데이트
  const statEl=document.getElementById('ustat_'+safeId);

    const friBadgeLabel2=needsTestNames2.length ? needsTestNames2.join(', ')+'  시험' : '';

/* ── 단원 체크 토글 ── */
async function unitToggleCheck(safeId, idx, checked){
  const r=window._unitMap[safeId];
  if(!r){ toast('단원 정보를 찾을 수 없습니다. 페이지를 새로고침해주세요.', true); return; }
  const {sid,tbId}=r;
  const key=sid+'_'+tbId;
  const units=JSON.parse(JSON.stringify(textbookUnits[key]||[]));
  if(!units[idx]) return;
  units[idx].checked=checked;
  units[idx].checkedDate=checked?dk(new Date()):'';
  // 체크 해제 시 완료처리도 함께 해제
  if(!checked) units[idx].manualComplete=false;
  try{
    await saveTbUnits(sid,tbId,units);
    refreshUnitPanelById(sid,tbId,safeId);
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

/* ── 단원 점수 저장 ── */
async function unitSaveScore(safeId, idx, val){
  const r=window._unitMap[safeId];
  if(!r){ toast('단원 정보를 찾을 수 없습니다. 페이지를 새로고침해주세요.', true); return; }
  const {sid,tbId}=r;
  const key=sid+'_'+tbId;
  const units=JSON.parse(JSON.stringify(textbookUnits[key]||[]));
  if(!units[idx]) return;
  const trimmed=val.trim();
  const prev=String(units[idx].score??'');
  const next=trimmed===''?null:(isNaN(parseFloat(trimmed))?trimmed:parseFloat(trimmed));
  if(prev===String(next??'')) return; // 변화 없으면 생략
  units[idx].score=next;
  try{
    await saveTbUnits(sid,tbId,units);
    refreshUnitPanelById(sid,tbId,safeId);
    // 시험점수 input에도 동일한 값 반영
    // 단, 전범위 시험이 이미 입력된 경우는 덮어쓰지 않음
    if(next!==null){
      const dateStr=r.dateStr||(dk(st.todayDate instanceof Date ? st.todayDate : new Date()));
      const existingLesson=getLesson(sid,dateStr);
      if(!existingLesson?.testIsFullRange){
        const scoreInp=document.getElementById('testScoreInp_'+sid+'_'+dateStr);
        if(scoreInp){
          scoreInp.value=String(next);
          // lesson에도 저장
          const cls=(cfg.students||[]).find(x=>x.id===sid)?.classType||'';
          tSave(sid,dateStr,cls,'testScore',String(next));
        }
      }
    }
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

/* ── 단원 시험 없이 완료 처리 ── */
async function unitMarkComplete(safeId, idx, complete){
  const r=window._unitMap[safeId]; if(!r){ toast('단원 정보를 찾을 수 없습니다. 새로고침해주세요.', true); return; }
  const {sid,tbId}=r;
  const key=sid+'_'+tbId;
  const units=JSON.parse(JSON.stringify(textbookUnits[key]||[]));
  if(!units[idx]) return;
  units[idx].manualComplete=complete;
  if(complete){
    units[idx].checked=true;
    units[idx].checkedDate=units[idx].checkedDate||dk(new Date());
    units[idx].score=null; // 점수 없음
  } else {
    units[idx].manualComplete=false;
  }
  try{
    await saveTbUnits(sid,tbId,units);
    if(!complete){
      // 완료 취소 시 — 패널이 다시 나타나도록 전체 재렌더
      render();
      toast('완료가 취소됐습니다.');
    } else {
      refreshUnitPanelById(sid,tbId,safeId);
      toast('단원 완료 처리됐습니다.');
    }
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

async function unitAddNew(safeId){

/* 토요일 오늘입력 — 보강 신청한 학생들을 1교시/2교시로 그룹핑 표시 */
function renderSaturdayInput(dateStr, dy, dm, teacherFilter){
  const studs=cfg.students||[];
  // 이 토요일에 등록된 보강 학생 목록 가져오기
  const entry=getMkEntryByDate(dateStr);
  if(!entry){
    return `<div class="empty">이 토요일은 보강일로 등록되지 않았습니다.<br><span style="font-size:11px;color:var(--text3)">설정 → 토요보강일 관리에서 먼저 등록해주세요.</span></div>`;
  }
  const arr=getMakeupStudents(entry);
  // 권한/필터
  const isPrin=session?.role==='principal';
  const filtered=arr.filter(es=>{
    const s=studs.find(x=>x.id===es.id);
    if(!s) return false;
    if(!isPrin && !st.viewAll){
      if(es.teacher !== session?.username) return false;
    }
    if(teacherFilter && es.teacher !== teacherFilter) return false;
    return true;
  });
  if(!filtered.length){
    return `<div class="empty">${teacherFilter?esc(teacherFilter)+' 담당 학생이 없습니다.':'표시할 학생이 없습니다.'}</div>`;
  }

  // 1교시/2교시별로 그룹
  const byPeriod={1:[],2:[],_:[]};
  filtered.forEach(es=>{
    const p=es.period||'_';
    if(byPeriod[p]) byPeriod[p].push(es); else byPeriod._.push(es);
  });

  let h='';
  const renderPeriodBlock=(p, label, time)=>{
    const list=byPeriod[p];
    if(!list||!list.length) return '';
    // 담당 선생님별 부그룹
    const teacherGroups=new Map();
    list.forEach(es=>{
      const t=es.teacher||'__미지정__';
      if(!teacherGroups.has(t)) teacherGroups.set(t,[]);
      teacherGroups.get(t).push(es);
    });
    const teacherList=cfg.teachers||[];
    const ordered=[];
    teacherList.forEach(t=>{ if(teacherGroups.has(t)) ordered.push([t, teacherGroups.get(t)]); });
    [...teacherGroups.entries()].forEach(([k,v])=>{
      if(k!=='__미지정__' && !teacherList.includes(k) && !ordered.find(x=>x[0]===k)) ordered.push([k,v]);
    });
    if(teacherGroups.has('__미지정__')) ordered.push(['__미지정__', teacherGroups.get('__미지정__')]);

    let block=`<div class="timeslot-hdr"><b style="font-size:14px">⏰ ${label}</b>
      <span style="font-size:11px;color:var(--text3);margin-left:6px">${time}</span>
      <span style="font-size:12px;color:var(--text3);margin-left:6px">${list.length}명</span>
    </div><div class="timeslot-body">`;

    ordered.forEach(([tname, glist])=>{
      const isUnassigned = tname==='__미지정__';
      const displayName = isUnassigned?'담당 미지정':tname;
      block+=`<div style="padding:6px 12px 4px;font-size:11px;font-weight:700;color:${isUnassigned?'#a05a00':'var(--blue)'};background:${isUnassigned?'#fffbef':'#f5f9fd'};border-bottom:1px solid var(--border)">
        ${isUnassigned?'❓':'👩‍🏫'} ${esc(displayName)} <span style="font-weight:500;color:var(--text3);margin-left:4px">${glist.length}명</span>
      </div><div class="student-grid">`;
      glist.forEach(es=>{
        const s=studs.find(x=>x.id===es.id);
        if(!s) return;
        block+=renderTodayStudentCard(s, dateStr, dy, dm, null);
      });
      block+=`</div>`;
    });
    block+=`</div>`;
    return block;
  };

  h+=renderPeriodBlock('1', '1교시', '오전 10시 ~ 12시');
  h+=renderPeriodBlock('2', '2교시', '오후 12시 ~ 2시');
  if(byPeriod._.length){
    h+=`<div class="timeslot-hdr" style="background:#fffbef"><b style="font-size:13px;color:#a05a00">⚠️ 교시 미지정 (${byPeriod._.length}명)</b></div>
      <div class="timeslot-body"><div class="student-grid">`;
    byPeriod._.forEach(es=>{
      const s=studs.find(x=>x.id===es.id);
      if(!s) return;
      h+=renderTodayStudentCard(s, dateStr, dy, dm, null);
    });
    h+=`</div></div>`;
  }
  return h;
}

function rToday(){
  const d=st.todayDate;const dow=d.getDay();const dateStr=dk(d);const holiday=isHol(dateStr);
  const dy=d.getFullYear(),dm=d.getMonth()+1;
  const isThisMonth=(dy===st.year&&dm===st.month);
  const isPrin=session?.role==='principal';
  const teacherFilter=isPrin?(st.todayTeacher||''):'';
  const isFridayDow=(dow===5);
  let h=`<div class="toolbar"><div class="tleft" style="flex-wrap:wrap">
    <button class="btn btn-sm" onclick="chgD(-1)">◀ 전날</button>
    <b style="font-size:14px;padding:0 4px">${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${DAY[dow]})</b>
    <button class="btn btn-sm" onclick="chgD(1)">다음날 ▶</button>
    <button class="btn btn-sm" onclick="goTodayDate()">오늘</button>
    <input type="date" value="${dateStr}" onchange="if(this.value){const p=this.value.split('-');const nd=new Date(+p[0],+p[1]-1,+p[2]);st.todayDate=nd;ensureMonthLoaded(nd.getFullYear(),nd.getMonth()+1).then(()=>render());}" style="font-size:12px;padding:3px 7px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);font-family:inherit;cursor:pointer" title="날짜 직접 선택">
    ${holiday?'<span class="badge" style="background:#fce6e6;color:#a02828">휴일</span>':''}
    ${isPrin?`<select onchange="setTodayTeacher(this.value)" style="margin-left:6px" title="선생님별 필터">
      <option value="" ${!teacherFilter?'selected':''}>👩‍🏫 전체 선생님</option>
      ${allTeachers().map(t=>`<option value="${esc(t)}" ${teacherFilter===t?'selected':''}>${esc(t)}</option>`).join('')}
    </select>`:''}
  </div></div>`;
  if(!isThisMonth) h+=`<div class="notice" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">📅 현재 보고 있는 날짜는 <b>${dy}년 ${dm}월</b>입니다. (월별 탭은 ${st.year}년 ${st.month}월 기준)<button class="btn btn-sm" onclick="switchMonth(${dy},${dm})">→ ${dy}년 ${dm}월로 전환</button></div>`;
  if(holiday)return h+`<div class="empty">휴일입니다.</div>`;

  // ── 토요일 처리: 결석보강 신청 학생만 표시 ──
  const isSaturday=(dow===6);
  if(isSaturday){
    return h + renderSaturdayInput(dateStr, dy, dm, teacherFilter);
  }

  // 오늘 수업 가능한 모든 학생 (그 요일에 수업 있는 반 + 담당 일치 + 선생님 필터)
  const allStudsToday=(cfg.students||[]).filter(s=>{
    const ct=CT()[s.classType];
    if(!ct||!ct.days.includes(dow)) return false;
    if(!isMyStudentToday(s,dow)) return false;
    // 선생님 필터: 그 요일의 담당이 해당 선생님과 일치하는지
    if(teacherFilter){
      const t = isFridayDow ? (s.fridayTeacher||s.teacher||'') : (s.teacher||'');
      if(t !== teacherFilter) return false;
    }
    return true;
  });
  if(!allStudsToday.length){
    if(teacherFilter) return h+`<div class="empty">${DAY[dow]}요일에 ${esc(teacherFilter)} 담당 학생이 없습니다.</div>`;
    return h+`<div class="empty">${DAY[dow]}요일은 수업이 없습니다.</div>`;
  }

  const renderStudentCard=(s,dateStr,dy,dm,sn,ctk)=>renderTodayStudentCard(s,dateStr,dy,dm,sn);

  // 학생을 타임별로 그룹화
  // 금요일이면 fridayTime, 그 외엔 weekdayTime 기준
  // 같은 타임 안에서는 담당 선생님별 부그룹으로 나눠서 표시
  const isFriday = (dow===5);
  const timeGroups = {}; // {1: [...], 2: [...], ...}
  const noTime = []; // 교시 미지정 학생

  allStudsToday.forEach(s=>{
    const t = isFriday ? s.fridayTime : s.weekdayTime;
    if(!t) { noTime.push(s); return; }
    if(!timeGroups[t]) timeGroups[t]=[];
    timeGroups[t].push(s);
  });

  // 실제 학생 데이터 기준 최대 교시 (하드코딩 제거)
  const usedTimes = Object.keys(timeGroups).map(Number).filter(n=>!isNaN(n)&&n>0);
  const timeCount = usedTimes.length ? Math.max(...usedTimes) : (isFriday ? 4 : 3);

  // 각 타임마다 렌더링
  for(let t=1; t<=timeCount; t++){
    const studs=timeGroups[t]||[];
    if(!studs.length) continue;

    // 회차 번호 (학생 반별로 다를 수 있음 — 여기서는 첫 학생 기준 표시 + 학생 카드에서 본인 회차 표시)
    // 같은 타임 내에서 담당 선생님별 부그룹화
    const teacherGroups=new Map(); // teacher -> [students]
    studs.forEach(s=>{
      const t2 = isFriday ? (s.fridayTeacher||s.teacher||'') : (s.teacher||'');
      const key = t2||'__미지정__';
      if(!teacherGroups.has(key)) teacherGroups.set(key, []);
      teacherGroups.get(key).push(s);
    });

    // 명단 순서대로 정렬
    const teacherList=cfg.teachers||[];
    const ordered=[];
    teacherList.forEach(tn=>{ if(teacherGroups.has(tn)) ordered.push([tn, teacherGroups.get(tn)]); });
    [...teacherGroups.entries()].forEach(([k,v])=>{
      if(k!=='__미지정__' && !teacherList.includes(k) && !ordered.find(x=>x[0]===k)){
        ordered.push([k,v]);
      }
    });
    if(teacherGroups.has('__미지정__')) ordered.push(['__미지정__', teacherGroups.get('__미지정__')]);

    // ── 출결 미기록 학생 감지 ──
    // 규칙: 오늘 날짜(dateStr)가 속한 사이클의 1회차 ~ 오늘(당일 포함)까지 출결 체크
    // - 당일 아직 미입력이면 알람 표시, 입력하면 이름 사라짐
    // - 사이클이 바뀌면 새 사이클 기준으로 리셋 (이전 사이클 누락과 무관)
    const unrecorded = studs.filter(s=>{
      // 오늘 날짜(dateStr)가 속한 사이클 찾기
      const allCycles = _getAllCycles(s.classType);
      let currentCycle = null;
      for(const cycle of allCycles){
        if(cycle.dates.includes(dateStr)){ currentCycle = cycle; break; }
      }
      // 오늘이 사이클에 없으면(비수업일 등) 알람 없음
      if(!currentCycle) return false;
      // 현재 사이클 내에서 오늘(포함)까지의 날짜만 확인
      const checkDates = currentCycle.dates.filter(d => d <= dateStr);
      // 그 중 출결 기록이 없는 날이 하나라도 있으면 알람
      return checkDates.some(d=>{
        const l = mdb.lessons[lk(s.id, d)];
        return !l || !l.attendance;
      });
    });

    h+=`<div class="timeslot-hdr"><b style="font-size:14px">⏰ ${t}교시</b>
      <span style="font-size:12px;color:var(--text3);margin-left:6px">${studs.length}명</span>
      ${unrecorded.length ? `<span style="display:inline-flex;align-items:center;gap:5px;margin-left:auto;font-size:11px;font-weight:700;color:#a02828;background:#fce6e6;border:1px solid #e0a0a0;border-radius:20px;padding:3px 10px">⚠️ 출결 확인 필요: ${unrecorded.map(s=>esc(s.name)).join(', ')}</span>` : ''}
    </div><div class="timeslot-body">`;

    ordered.forEach(([tname, glist])=>{
      const isUnassigned = tname==='__미지정__';
      const displayName = isUnassigned?'담당 미지정':tname;
      h+=`<div style="padding:6px 12px 4px;font-size:11px;font-weight:700;color:${isUnassigned?'#a05a00':'var(--blue)'};background:${isUnassigned?'#fffbef':'#f5f9fd'};border-bottom:1px solid var(--border)">
        ${isUnassigned?'❓':'👩‍🏫'} ${esc(displayName)} <span style="font-weight:500;color:var(--text3);margin-left:4px">${glist.length}명</span>
      </div>`;
      h+=`<div class="student-grid">`;
      glist.forEach(s=>{
        // 학생별 회차 번호 계산 — 날짜가 속한 사이클을 전체에서 직접 검색 (월 귀속 불일치 방지)
        const allCycleInfos = _getAllCycles(s.classType);
        let sn = null;
        for(const cycle of allCycleInfos){
          const idx = cycle.dates.indexOf(dateStr);
          if(idx !== -1){ sn = idx + 1; break; }
        }
        h+=renderStudentCard(s,dateStr,dy,dm,sn,s.classType);
      });
      h+=`</div>`;
    });

    h+=`</div>`;
  }

  // 교시 미지정 학생 표시 (원장에게)
  if(noTime.length && session?.role==='principal'){
    h+=`<div class="timeslot-hdr" style="background:#fffbef"><b style="font-size:13px;color:#a05a00">⚠️ 교시 미지정 학생 (${noTime.length}명)</b>
      <span style="font-size:11px;color:var(--text3);margin-left:6px">학생 관리에서 ${isFriday?'금요일':'월~목'} 교시를 지정해주세요</span>
    </div><div class="timeslot-body"><div class="student-grid">`;
    noTime.forEach(s=>{
      const allCycleInfos2 = _getAllCycles(s.classType);
      let sn = null;
      for(const cycle of allCycleInfos2){
        const idx = cycle.dates.indexOf(dateStr);
        if(idx !== -1){ sn = idx + 1; break; }
      }
      h+=renderStudentCard(s,dateStr,dy,dm,sn,s.classType);
    });
    h+=`</div></div>`;
  }

  return h;
}

/* ── SCHEDULE TAB ── */
/* 시간표: 가로=요일(월~금), 세로=교시(1~4). 각 칸마다 그 시간에 오는 학생을 담당 선생님별로 자동 분반 */
function rSchedule(){
  const isPrin=session?.role==='principal';
  const allStuds=cfg.students||[];
  const studs=(!isPrin && !st.viewAll)
    ? allStuds.filter(s=>isStudentOfTeacher(s, session?.username))
    : allStuds;

  const dayDefs=[
    {dow:1, label:'월'},
    {dow:2, label:'화'},
    {dow:3, label:'수'},
    {dow:4, label:'목'},
    {dow:5, label:'금', isFri:true},
  ];
  const allTimes=[1,2,3,4]; // 최대 교시

  function studentsAt(dow, time){
    return studs.filter(s=>{
      const ct=CT()[s.classType];
      if(!ct||!ct.days.includes(dow)) return false;
      return String(dow===5?s.fridayTime||'':s.weekdayTime||'')===String(time);
    });
  }

  function groupByTeacher(list, dow){
    const groups=new Map();
    list.forEach(s=>{
      const t=(dow===5?s.fridayTeacher||s.teacher:s.teacher)||'';
      const key=t||'__미지정__';
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(s);
    });
    const teacherList=cfg.teachers||[];
    const ordered=[];
    teacherList.forEach(t=>{ if(groups.has(t)) ordered.push([t,groups.get(t)]); });
    [...groups.entries()].forEach(([k,v])=>{
      if(k!=='__미지정__'&&!teacherList.includes(k)&&!ordered.find(x=>x[0]===k)) ordered.push([k,v]);
    });
    if(groups.has('__미지정__')) ordered.push(['__미지정__',groups.get('__미지정__')]);
    return ordered;
  }

  function stuChip(s, dow){
    const lvlHtml=s.level?`<span class="sch-lvl" style="background:${LEVEL_COLORS[s.level].bg};color:${LEVEL_COLORS[s.level].fg};border-color:${LEVEL_COLORS[s.level].br}">${s.level}</span>`:'';
    const gradeHtml=s.grade?`<span class="sch-grade">${esc(s.grade)}</span>`:'';
    const ct=CT()[s.classType];
    const ctBadge=ct?`<span class="sch-grade" style="color:${ct.color||'#666'}">[${esc(ct.label||s.classType)}]</span>`:'';
    const popClick=isPrin?`onclick="event.stopPropagation();schPopover('${s.id}',${dow},this)"`:`onclick="openM('studentProfile','${s.id}')"`;
    const fridayInherit=(dow===5&&!s.fridayTeacher&&s.teacher);
    const inheritMark=fridayInherit?`<span style="font-size:8px;color:var(--text3)" title="평일 담당과 동일">↩</span>`:'';
    const titleAttr=isPrin?'클릭하여 담당/교시 변경':'클릭하여 학생 상세 보기';
    return `<span class="sch-stu" ${popClick} title="${esc(titleAttr)}">${esc(s.name)}${gradeHtml}${lvlHtml}${inheritMark}${ctBadge}</span>`;
  }

  const noWeekday=studs.filter(s=>{
    const ct=CT()[s.classType];
    return ct&&ct.days.some(d=>d>=1&&d<=4)&&!s.weekdayTime;
  });
  const noFriday=studs.filter(s=>{
    const ct=CT()[s.classType];
    return ct&&ct.days.includes(5)&&!s.fridayTime;
  });

  let h=`<div class="toolbar">
    <div class="tleft">
      <b style="font-size:14px">🗓️ 주간 시간표</b>
      <span style="font-size:11px;color:var(--text3);margin-left:6px">학생 클릭${isPrin?' → 담당/교시 빠른 변경':' → 상세 보기'} · ↩ 금요일 담당이 평일과 동일</span>
    </div>
  </div>`;

  if(noWeekday.length||noFriday.length){
    h+=`<div class="sch-summary">`;
    if(noWeekday.length) h+=`<div class="sch-summary-card" style="border-color:#e0c060;background:#fdf0d8;color:#7a4e00">⚠️ <b>${noWeekday.length}명</b> 월~목 교시 미지정</div>`;
    if(noFriday.length)  h+=`<div class="sch-summary-card" style="border-color:#90b8e8;background:#e5effc;color:#1558a8">⚠️ <b>${noFriday.length}명</b> 금요일 교시 미지정</div>`;
    h+=`</div>`;
  }

  // ── 표: 가로=요일, 세로=교시 ──
  h+=`<div style="overflow-x:auto"><table class="sch-tbl" style="table-layout:fixed">
    <thead><tr>
      <th class="sch-th-day" style="width:70px">교시</th>
      ${dayDefs.map(d=>`<th style="${d.isFri?'background:#fff5cc;color:#7a4e00':''}">${d.label}요일</th>`).join('')}
    </tr></thead><tbody>`;

  allTimes.forEach(time=>{
    const isFriOnly=(time===4); // 4교시는 금요일만
    h+=`<tr>`;
    // 교시 라벨 열
    h+=`<td class="sch-time-lbl" style="text-align:center;font-weight:700;font-size:13px;background:var(--bg2);border-right:2px solid var(--blue);white-space:nowrap">
      ${time}교시
    </td>`;
    // 요일별 칸
    dayDefs.forEach(d=>{
      const isFri=d.dow===5;
      if(isFriOnly && !isFri){
        // 4교시 행의 월~목 칸 → 빈 칸
        h+=`<td class="sch-cell empty-cell" style="background:#f5f5f5;text-align:center;font-size:10px;color:var(--text3);font-style:italic">-</td>`;
        return;
      }
      // 그 요일에 수업이 없는 요일(해당 반이 없는 경우)
      const hasClassOnDay=studs.some(s=>{ const ct=CT()[s.classType]; return ct&&ct.days.includes(d.dow); });
      if(!hasClassOnDay){
        h+=`<td class="sch-cell empty-cell" style="background:#f8f8f8;text-align:center;font-size:10px;color:var(--text3)">수업없음</td>`;
        return;
      }
      const list=studentsAt(d.dow, time);
      if(!list.length){
        h+=`<td class="sch-cell empty-cell"><div class="sch-empty">-</div></td>`;
        return;
      }
      const groups=groupByTeacher(list, d.dow);
      h+=`<td class="sch-cell"${isFri?' style="background:#fffef5"':''}>`;
      h+=`<div class="sch-cell-meta">${list.length}명</div>`;
      groups.forEach(([tname,glist])=>{
        const isUnassigned=tname==='__미지정__';
        const displayName=isUnassigned?'미지정':tname;
        h+=`<div class="sch-slot${isUnassigned?' unassigned':''}">`;
        h+=`<div class="sch-slot-hdr">${isUnassigned?'❓':'👩‍🏫'} ${esc(displayName)}<span class="sch-slot-cnt" style="margin-left:auto">${glist.length}명</span></div>`;
        h+=`<div class="sch-slot-body">`;
        glist.forEach(s=>{ h+=stuChip(s,d.dow); });
        h+=`</div></div>`;
      });
      h+=`</td>`;
    });
    h+=`</tr>`;
  });

  h+=`</tbody></table></div>`;

  // 미지정 학생 목록 (원장만)
  if(isPrin&&(noWeekday.length||noFriday.length)){
    h+=`<div style="margin-top:18px"><div class="sec-lbl">📌 교시 미지정 학생</div>`;
    if(noWeekday.length){
      h+=`<div class="card"><div style="font-weight:600;margin-bottom:6px;font-size:12px">월~목 교시 미지정 (${noWeekday.length}명)</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;
      noWeekday.forEach(s=>{ h+=stuChip(s,1); });
      h+=`</div></div>`;
    }
    if(noFriday.length){
      h+=`<div class="card"><div style="font-weight:600;margin-bottom:6px;font-size:12px">금요일 교시 미지정 (${noFriday.length}명)</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;
      noFriday.forEach(s=>{ h+=stuChip(s,5); });
      h+=`</div></div>`;
    }
    h+=`</div>`;
  }

  // ── 토요 보강 시간표 ──
  h+=renderSaturdayTable();
  return h;
}

/* 토요일 보강 시간표 — 이번 달 보강일들의 학생을 1교시(10-12)/2교시(12-14)별로 담당 그룹핑하여 표시 */
function renderSaturdayTable(){
  // 이번 달 + 다음 달 보강일 표시 (전월 결석 → 다음달 보강 케이스 대응)
  const nm=st.month===12?1:st.month+1, ny=st.month===12?st.year+1:st.year;
  const nextKey=`${ny}-${String(nm).padStart(2,'0')}`;
  const days=getMakeupDays();
  const nextDays=(cfg.makeupDays||{})[nextKey]||[];
  // 다음 달 보강일 중 학생이 등록된 경우만 표시
  const nextDaysWithStuds=nextDays.filter(e=>getMakeupStudents(e).length>0);
  const allDays=[...days, ...nextDaysWithStuds].sort((a,b)=>a.date.localeCompare(b.date));
  if(!allDays.length) return '';
  const isPrin=session?.role==='principal';
  const allStuds=cfg.students||[];
  const studs=(!isPrin && !st.viewAll)
    ? allStuds.filter(s=>isStudentOfTeacher(s, session?.username))
    : allStuds;

  // 등록된 보강일을 모두 표시 (학생 없어도)
  const activeDays=allDays;
  if(!activeDays.length) return '';

  let h=`<div style="margin-top:24px">
    <div class="toolbar" style="margin-bottom:6px">
      <div class="sec-lbl" style="margin:0">🗓 토요 보강 시간표</div>
      <button class="btn btn-primary btn-sm" onclick="openM('addSatStudent')">+ 학생 추가</button>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:8px">${st.year}년 ${st.month}월 보강일별 학생 배치 · 1교시 10:00~12:00 / 2교시 12:00~14:00 · 학생 칩 클릭 → 변경/제거</div>`;

  h+=`<div style="overflow-x:auto"><table class="sch-tbl">
    <thead><tr>
      <th style="width:120px">교시</th>
      ${activeDays.map(e=>{
        const dt=parseDate(e.date);
        return `<th>${e.date.slice(5)} (${DAY[dt.getDay()]})</th>`;
      }).join('')}
    </tr></thead><tbody>`;

  // 각 교시별 행 (1교시, 2교시, 그리고 교시 미정)
  [
    {p:'1', label:'1교시', time:'10:00~12:00'},
    {p:'2', label:'2교시', time:'12:00~14:00'},
    {p:'_unassigned_', label:'교시 미정', time:'⚠️ 정리 필요'},
  ].forEach(period=>{
    // 교시 미정 행은 해당 학생이 있는 경우만 표시
    if(period.p==='_unassigned_'){
      const hasUnassigned=activeDays.some(entry=>{
        return getMakeupStudents(entry).some(es=>!es.period || (es.period!=='1' && es.period!=='2'));
      });
      if(!hasUnassigned) return;
    }
    h+=`<tr${period.p==='_unassigned_'?' style="background:#fff8e8"':''}><td class="sch-time-lbl">
      <b style="${period.p==='_unassigned_'?'color:var(--amber)':''}">${period.label}</b>
      <div style="font-size:10px;color:var(--text3);font-weight:400">${period.time}</div>
    </td>`;
    activeDays.forEach(entry=>{
      // 교시 매칭 (미정 행은 빈/이상한 값 모두)
      const arr=getMakeupStudents(entry).filter(es=>{
        if(period.p==='_unassigned_'){
          return !es.period || (es.period!=='1' && es.period!=='2');
        }
        return es.period===period.p;
      });
      // 담당 선생님별 그룹
      const byTeacher=new Map();
      arr.forEach(es=>{
        const t=es.teacher||'__미지정__';
        if(!byTeacher.has(t)) byTeacher.set(t,[]);
        byTeacher.get(t).push(es);
      });
      // 정렬 (선생님 명단 순서대로)
      const teacherList=cfg.teachers||[];
      const ordered=[];
      teacherList.forEach(t=>{ if(byTeacher.has(t)) ordered.push([t, byTeacher.get(t)]); });
      [...byTeacher.entries()].forEach(([t,v])=>{
        if(t!=='__미지정__' && !teacherList.includes(t) && !ordered.find(x=>x[0]===t)) ordered.push([t,v]);
      });
      if(byTeacher.has('__미지정__')) ordered.push(['__미지정__', byTeacher.get('__미지정__')]);

      h+=`<td class="sch-cell">`;
      if(!ordered.length){
        h+=`<div style="color:var(--text3);font-size:11px;text-align:center;padding:8px 0">-</div>`;
      } else {
        ordered.forEach(([t, list])=>{
          const isUnassigned=t==='__미지정__';
          h+=`<div style="margin-bottom:6px">
            <div style="font-size:10px;font-weight:700;color:${isUnassigned?'#a05a00':'var(--blue)'};margin-bottom:3px">
              ${isUnassigned?'❓ 담당 미지정':'👩‍🏫 '+esc(t)} <span style="font-weight:400;color:var(--text3)">${list.length}명</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:3px">
              ${list.map(es=>{
                const stu=studs.find(x=>x.id===es.id);
                if(!stu) return '';
                return `<span class="badge" style="font-size:10px;background:var(--bg2);color:var(--text);padding:2px 6px;cursor:pointer" onclick="event.stopPropagation();satStuPopover('${es.id}','${entry.date}',this)" title="클릭하여 변경/제거">${esc(stu.name)}</span>`;
              }).join('')}
            </div>
          </div>`;
        });
      }
      h+=`</td>`;
    });
    h+=`</tr>`;
  });

  h+=`</tbody></table></div></div>`;
  return h;
}

/* 시간표에서 학생 칩 클릭 시 빠른 담당/타임 변경 팝오버 (원장만) */
function schPopover(sid, dow, anchor){
  // 기존 팝오버 닫기
  const existing=document.getElementById('schPop'); if(existing) existing.remove();

  const s=(cfg.students||[]).find(x=>x.id===sid);
  if(!s) return;

  const teacherList=cfg.teachers||[];
  const isFriday=dow===5;
  const ct=CT()[s.classType];
  const hasFridayClass=!!(ct&&Array.isArray(ct.days)&&ct.days.includes(5));

  const buildTeacherOpts=(currentVal)=>{
    let opts='<option value="">- 미지정 -</option>';
    teacherList.forEach(t=>{
      opts+=`<option value="${esc(t)}"${currentVal===t?' selected':''}>${esc(t)}</option>`;
    });
    if(currentVal && !teacherList.includes(currentVal)){
      opts+=`<option value="${esc(currentVal)}" selected>⚠️ ${esc(currentVal)} (명단 외)</option>`;
    }
    return opts;
  };
  const wTimes=[1,2,3], fTimes=[1,2,3,4];
  const wdOpts=['<option value="">-</option>'].concat(wTimes.map(t=>`<option value="${t}"${String(s.weekdayTime||'')===String(t)?' selected':''}>${t}교시</option>`)).join('');
  const frOpts=['<option value="">-</option>'].concat(fTimes.map(t=>`<option value="${t}"${String(s.fridayTime||'')===String(t)?' selected':''}>${t}교시</option>`)).join('');

  const pop=document.createElement('div');
  pop.id='schPop';
  pop.className='sch-popover';
  pop.innerHTML=`
    <button class="pop-close" onclick="document.getElementById('schPop').remove()">✕</button>
    <h4>${esc(s.name)} ${ct?`<span style="color:${ct.color||'#666'};font-weight:500">[${esc(ct.label)}]</span>`:''}</h4>
    ${isFriday?`
      <div class="sch-popover-row"><label>금요일 담당</label>
        <select onchange="schQuickSave('${sid}','fridayTeacher',this.value)">${buildTeacherOpts(s.fridayTeacher||'')}</select>
      </div>
      ${hasFridayClass?`<div class="sch-popover-row"><label>금요일 교시</label>
        <select onchange="schQuickSave('${sid}','fridayTime',this.value)">${frOpts}</select>
      </div>`:''}
    `:`
      <div class="sch-popover-row"><label>평일 담당</label>
        <select onchange="schQuickSave('${sid}','teacher',this.value)">${buildTeacherOpts(s.teacher||'')}</select>
      </div>
      <div class="sch-popover-row"><label>월~목 교시</label>
        <select onchange="schQuickSave('${sid}','weekdayTime',this.value)">${wdOpts}</select>
      </div>
    `}
    <div class="sch-popover-row" style="border-top:1px solid var(--border);padding-top:7px;margin-top:4px">
      <button class="btn btn-sm" style="width:100%;font-size:11px" onclick="document.getElementById('schPop').remove();openM('studentProfile','${sid}')">📋 학생 상세 보기</button>
    </div>
  `;

  // 위치: 칩 바로 아래에
  document.body.appendChild(pop);
  const rect=anchor.getBoundingClientRect();
  const popH=pop.offsetHeight, popW=pop.offsetWidth;
  let top=rect.bottom+window.scrollY+4;
  let left=rect.left+window.scrollX;
  // 화면 우측 넘어가면 보정
  if(left+popW>window.innerWidth-10) left=window.innerWidth-popW-10;
  // 화면 하단 넘어가면 위로
  if(rect.bottom+popH>window.innerHeight-10) top=rect.top+window.scrollY-popH-4;
  pop.style.top=top+'px';
  pop.style.left=left+'px';

  // 외부 클릭 시 닫기
  setTimeout(()=>{
    const closer=(e)=>{
      if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('click',closer,true); }
    };
    document.addEventListener('click',closer,true);
  },50);
}

/* makeup_days 컬렉션 전체 로드 → cfg.makeupDays 캐시 재구성 */
async function loadMakeupDaysFromCollection(){
  const {getDocs, collection} = fb();
  try{
    const snap = await getDocs(collection(fbDb(), 'makeup_days'));
    const newMd = {};
    snap.forEach(doc => {
      const data = doc.data();
      const dateStr = doc.id; // 문서 ID = YYYY-MM-DD
      const monthKey = dateStr.slice(0,7);
      if(!newMd[monthKey]) newMd[monthKey] = [];
      newMd[monthKey].push({ date: dateStr, students: data.students || [] });
    });
    // 월별 정렬
    Object.keys(newMd).forEach(k => newMd[k].sort((a,b) => a.date.localeCompare(b.date)));
    cfg.makeupDays = newMd;

    // 구버전 마이그레이션: config/main 또는 config/makeupDays에 데이터가 남아있으면 이전
    await migrateLegacyMakeupDays();
  } catch(e){
    console.warn('makeup_days 로드 실패:', e);
    if(!cfg.makeupDays) cfg.makeupDays = {};
  }
}

/* 구버전 cfg.makeupDays → makeup_days 컬렉션 자동 마이그레이션 */
async function migrateLegacyMakeupDays(){
  const {getDoc, setDoc} = fb();
  // config/makeupDays 문서 확인 (이전 분리 방식)
  let legacyMd = null;
  try{
    const oldSnap = await getDoc(makeupDayDocRef('__legacy__').parent.parent || configDocRef());
    // config/main에 makeupDays가 있는지 확인
    const mainSnap = await getDoc(configDocRef());
    if(mainSnap.exists() && mainSnap.data().makeupDays){
      legacyMd = mainSnap.data().makeupDays;
    }
  } catch(e){}

  if(!legacyMd || typeof legacyMd !== 'object') return;
  if(Array.isArray(legacyMd)) return; // 너무 구버전은 스킵

  // makeup_days 컬렉션이 이미 비어있지 않으면 마이그레이션 스킵
  const existingDates = Object.values(cfg.makeupDays).flat().map(e=>e.date);
  if(existingDates.length > 0) return;

  console.log('구버전 makeupDays 마이그레이션 시작...');
  const writes = [];
  Object.values(legacyMd).forEach(monthList => {
    if(!Array.isArray(monthList)) return;
    monthList.forEach(entry => {
      if(!entry || !entry.date) return;
      writes.push(setDoc(makeupDayDocRef(entry.date), {
        date: entry.date,
        students: entry.students || []
      }));
    });
  });
  if(writes.length > 0){
    await Promise.all(writes);
    await loadMakeupDaysFromCollection(); // 다시 로드
    console.log(`마이그레이션 완료: ${writes.length}개 보강일`);
  }
}

/* 보강일 학생 목록 — 새 형식 [{id, period, teacher}]로 정규화
 기존 형식 entry.studentIds=[...] 호환
 teacher가 비어있으면 학생의 평일/금 담당을 자동 fallback */
function getMakeupStudents(entry){
  const studs=cfg.students||[];
  const validIds=new Set(studs.map(s=>s.id));
  const fillTeacher=(rec)=>{
    if(rec.teacher) return rec;
    const stu=studs.find(x=>x.id===rec.id);
    if(stu){ rec.teacher = stu.teacher || stu.fridayTeacher || ''; }
    return rec;
  };
  if(Array.isArray(entry.students) && entry.students.length){
    return entry.students
      .map(x=>{ const rec=typeof x==='string'?{id:x,period:'',teacher:''}:{id:x.id,period:x.period||'',teacher:x.teacher||''}; return fillTeacher(rec); })
      .filter(rec=>validIds.has(rec.id)); // 삭제된 학생 제외
  }
  if(Array.isArray(entry.studentIds)){
    return entry.studentIds
      .map(id=>fillTeacher({id, period:'', teacher:''}))
      .filter(rec=>validIds.has(rec.id)); // 삭제된 학생 제외
  }
  return [];
}

        card+=`<select ${hasFriday?'':'disabled'} style="width:100%;padding:4px 7px;border:1px solid ${hasFriday?'var(--blue)':'var(--border)'};border-radius:var(--r);font-size:11px;font-family:inherit;${hasFriday?'':'background:var(--bg2);color:var(--text3)'}" onchange="saveStudentTeacher('${s.id}','fridayTime',this.value)">${frOpts}</select></div>`;

        });
        const passedTbsCard = sTbs.filter((t)=>{

        card+=`<button class="btn btn-sm" onclick="openM('assignTextbook','${s.id}')">+ 교재 배정</button>`;
        card+=`</div>`;
        if(activeTbsCard.length){
          activeTbsCard.forEach((t)=>{
            const ti = sTbs.indexOf(t);
            const bk = (cfg.textbooks||[]).find(b=>b.id===t.tbId);
            const name = bk?bk.name:(t.name||'교재');
            const tbId = t.tbId||('p_'+s.id+'_'+encodeURIComponent(t.name||''));
            const prog = textbookProgress[tbKey(s.id,tbId)]||{};
            const startDate=prog.startDate||t.startDate||'';
            const dur=startDate?durationLabel(startDate):'';
            card+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap">`;

            card+=`</div>`;

        } else {

        }
        if(passedTbsCard.length){
          card+=`<div style="font-size:10px;color:var(--green);margin-top:4px;cursor:pointer" onclick="openM('studentProfile','${s.id}')">✅ 완료 ${passedTbsCard.length}권 — 상세 보기에서 확인</div>`;
        }
        card+=`</div>`;
        card+=`</div>`; // collapse 영역 닫기
        // 기본 특이사항
        card+=`<div style="margin-top:6px">`;
        card+=`<div class="field-lbl">📌 기본 특이사항 (오늘진도·수업기록표 항상 표시)</div>`;

        card+=`</div>`;
      }
      card+=`</div>`;
      h+=card;
    });
    h+=`</div>`;
  });
  if(!total)h+=`<div class="empty">학생 없음</div>`;
  return h;
}

/* ── SETTINGS ── */
function rMyClass(){
  // 조교선생님 전용: 담당 학생 직접 지정
  if(session?.role!=='assistant'){
    // 전임/원장은 탭 자체가 숨겨지지만, 직접 접근 시 방어
    st.tab='today'; render(); return '';
  }
  const me=session.username;
  const allStudents=cfg.students||[];
  const assignedIds=(cfg.assistantStudents||{})[me]||[];
  const allCTs=Object.entries(CT());

  let h=`<div class="main">`;
  h+=`<div class="toolbar" style="margin-bottom:4px"><b>📋 내 담당반 설정</b></div>`;
  h+=`<div class="info-box" style="margin-bottom:14px">담당할 학생을 선택하세요. 선택한 학생의 출결·과제점수를 <b>오늘 입력</b> 탭에서 기록할 수 있습니다.</div>`;

  if(!allStudents.length){
    h+=`<div class="empty">등록된 학생이 없습니다.</div>`;
  } else {
    // 전임선생님 교시별 일괄 선택 섹션
    const fullTeachers=allTeachers(); // 전임선생님 목록
    if(fullTeachers.length){
      // 교시별로 grouping된 학생 목록 생성 (weekdayTime 기준)
      const teacherTimeGroups={}; // {'선생님__교시': [students]}
      allStudents.forEach(s=>{
        const teacher=s.teacher||'';
        if(!teacher) return;
        const time=s.weekdayTime||'';
        const key=`${teacher}__${time}`;
        if(!teacherTimeGroups[key]) teacherTimeGroups[key]={teacher,time,students:[]};
        teacherTimeGroups[key].students.push(s);
      });
      const groupEntries=Object.values(teacherTimeGroups).filter(g=>g.students.length>0);
      groupEntries.sort((a,b)=>{
        const ti=fullTeachers.indexOf(a.teacher)-fullTeachers.indexOf(b.teacher);
        if(ti!==0) return ti;
        return Number(a.time||0)-Number(b.time||0);
      });
      if(groupEntries.length){
        h+=`<div class="card" style="margin-bottom:14px;background:#f5f9fd;border-color:#b0cef0">`;
        h+=`<div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:10px">⚡ 교시별 빠른 선택</div>`;
        h+=`<div style="display:flex;flex-wrap:wrap;gap:6px">`;
        groupEntries.forEach(g=>{
          const ids=g.students.map(s=>s.id);
          const allChecked=ids.every(id=>assignedIds.includes(id));
          const label=g.time?`${esc(g.teacher)} ${g.time}교시`:`${esc(g.teacher)} (교시미정)`;
          h+=`<button class="btn btn-sm" style="font-size:11px;${allChecked?'background:var(--blue);color:#fff;border-color:var(--blue)':''}"
            onclick="toggleAssistantTeacherTime('${esc(me)}','${esc(g.teacher)}','${esc(g.time)}',${!allChecked})">
            ${allChecked?'✓ ':''}${label} <span style="opacity:.75">${g.students.length}명</span>
          </button>`;
        });
        h+=`</div></div>`;
      }
    }

    // 반별로 그룹핑
    if(allCTs.length){
      allCTs.forEach(([ctk, ctv])=>{
        const studsInCt=allStudents.filter(s=>s.classType===ctk);
        if(!studsInCt.length) return;
        h+=`<div class="card" style="margin-bottom:12px">`;
        h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">`;
        h+=`<b style="font-size:13px"><span class="badge ${ctv.badge||'b-mwf'}" style="margin-right:6px">${esc(ctv.label)}</span>${studsInCt.length}명</b>`;
        // 전체선택/해제 버튼
        const allChecked=studsInCt.every(s=>assignedIds.includes(s.id));
        h+=`<button class="btn btn-sm" onclick="toggleAllClassAssistant('${esc(me)}','${ctk}',${!allChecked})">${allChecked?'전체 해제':'전체 선택'}</button>`;
        h+=`</div>`;
        h+=`<div style="display:flex;flex-wrap:wrap;gap:6px">`;
        studsInCt.forEach(s=>{
          const checked=assignedIds.includes(s.id);
          h+=`<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;
            background:${checked?'var(--blue-bg)':'var(--bg2)'};
            border:1px solid ${checked?'#b0cef0':'var(--border)'};
            border-radius:20px;padding:5px 12px;transition:all .15s">
            <input type="checkbox" ${checked?'checked':''} onchange="toggleAssistantStudent('${esc(me)}','${s.id}',this.checked)" style="margin:0">
            <span style="font-weight:${checked?'600':'400'}">${esc(s.name||s.id)}</span>
            ${s.grade?`<span style="font-size:10px;color:var(--text3)">${esc(s.grade)}</span>`:''}
          </label>`;
        });
        h+=`</div></div>`;
      });
    } else {
      // 반 구분 없이 전체 표시
      h+=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:6px">`;
      allStudents.forEach(s=>{
        const checked=assignedIds.includes(s.id);
        h+=`<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;
          background:${checked?'var(--blue-bg)':'var(--bg2)'};
          border:1px solid ${checked?'#b0cef0':'var(--border)'};
          border-radius:20px;padding:5px 12px">
          <input type="checkbox" ${checked?'checked':''} onchange="toggleAssistantStudent('${esc(me)}','${s.id}',this.checked)" style="margin:0">
          ${esc(s.name||s.id)}
          ${s.grade?`<span style="font-size:10px;color:var(--text3)">${esc(s.grade)}</span>`:''}
        </label>`;
      });
      h+=`</div></div>`;
    }

    // 현재 담당 요약 (삭제된 학생 제외)
    const validAssigned=assignedIds.filter(id=>allStudents.some(x=>x.id===id));
    if(validAssigned.length){
      h+=`<div class="card" style="margin-top:4px;border-color:var(--blue)">`;
      h+=`<div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px">✅ 현재 내 담당 학생 (${validAssigned.length}명)</div>`;
      h+=`<div style="display:flex;flex-wrap:wrap;gap:5px">`;
      validAssigned.forEach(id=>{
        const s=allStudents.find(x=>x.id===id);
        if(s) h+=`<span style="font-size:12px;background:var(--blue-bg);color:var(--blue);border:1px solid #b0cef0;border-radius:20px;padding:3px 10px">${esc(s.name||id)}</span>`;
      });
      h+=`</div></div>`;
    }
  }

  h+=`</div>`;
  return h;
}

async function toggleAllClassAssistant(assistantName, ctk, checked){
  const studsInCt=(cfg.students||[]).filter(s=>s.classType===ctk);
  cfg.assistantStudents=cfg.assistantStudents||{};
  cfg.assistantStudents[assistantName]=cfg.assistantStudents[assistantName]||[];
  studsInCt.forEach(s=>{
    if(checked){
      if(!cfg.assistantStudents[assistantName].includes(s.id))
        cfg.assistantStudents[assistantName].push(s.id);
    } else {
      cfg.assistantStudents[assistantName]=cfg.assistantStudents[assistantName].filter(x=>x!==s.id);
    }
  });
  try{
    await gasCall('saveConfig',{config:cfg});
    render();
    toast(checked?`${studsInCt.length}명 담당으로 추가됨`:`${studsInCt.length}명 담당 해제됨`);
  } catch(e){ toast('저장 실패: '+e.message,true); }
}

// 전임선생님 + 교시 조합으로 해당 학생 전체 선택/해제
async function toggleAssistantTeacherTime(assistantName, teacher, time, checked){
  const studs=(cfg.students||[]).filter(s=>s.teacher===teacher && String(s.weekdayTime||'')===String(time));
  if(!studs.length){ toast('해당 조건의 학생이 없습니다',true); return; }
  cfg.assistantStudents=cfg.assistantStudents||{};
  cfg.assistantStudents[assistantName]=cfg.assistantStudents[assistantName]||[];
  studs.forEach(s=>{
    if(checked){
      if(!cfg.assistantStudents[assistantName].includes(s.id))
        cfg.assistantStudents[assistantName].push(s.id);
    } else {
      cfg.assistantStudents[assistantName]=cfg.assistantStudents[assistantName].filter(x=>x!==s.id);
    }
  });
  try{
    await gasCall('saveConfig',{config:cfg});
    render();
    toast(checked?`${studs.length}명 담당으로 추가됨`:`${studs.length}명 담당 해제됨`);
  } catch(e){ toast('저장 실패: '+e.message,true); }
}

}async function saveStudentTeacher(sid, field, val){
  const s=cfg.students.find(x=>x.id===sid);
  if(!s) return;
  s[field]=(val||'').trim();
  try{
    await gasCall('saveConfig',{config:cfg});
    const labels={teacher:'평일 담당',fridayTeacher:'금요일 담당',grade:'학년',level:'레벨',weekdayTime:'월~목 교시',fridayTime:'금요일 교시'};
    const lbl=labels[field]||field;
    toast(`${s.name} ${lbl} → ${val||'(미지정)'} 저장됨`);
    if(field==='grade'||field==='level'||field==='weekdayTime'||field==='fridayTime') render();
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

async function saveStudentClassType(sid, newType){
  const s=cfg.students.find(x=>x.id===sid);
  if(!s) return;
  const oldType=s.classType;
  if(oldType===newType) return;
  const oldCt=CT()[oldType], newCt=CT()[newType];
  const oldLabel=oldCt?oldCt.label:oldType;
  const newLabel=newCt?newCt.label:newType;
  if(!confirm(`${s.name} 학생의 반을 변경합니다.\n\n${oldLabel} → ${newLabel}\n\n계속하시겠어요?`)) {
    render(); // 드롭다운 원복
    return;
  }
  // 새 반에 금요일 수업이 없는데 fridayTime이 있으면 자동 정리
  const hadFriday=oldCt&&oldCt.days&&oldCt.days.includes(5);
  const hasFridayNow=newCt&&newCt.days&&newCt.days.includes(5);
  s.classType=newType;
  if(!hasFridayNow){
    if(s.fridayTime) s.fridayTime='';
    if(s.fridayTeacher) s.fridayTeacher='';
  }
  try{
    await gasCall('saveConfig',{config:cfg});
    toast(`${s.name} 반 변경: ${oldLabel} → ${newLabel}`);
    render();
  }catch(e){
    s.classType=oldType; // 롤백
    toast('저장 실패: '+e.message,true);
    render();
  }
}
