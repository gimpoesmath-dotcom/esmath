/* 특강 결석 보강 신청 확정 */
async function confSpecialMakeup(spId, sid, sn){
  const targetDate=document.getElementById('spMkDate')?.value;
  const period=document.getElementById('spMkPeriod')?.value||'1';
  const teacher=document.getElementById('spMkTeacher')?.value||'';
  if(!targetDate){ alert('보강 토요일을 선택해주세요'); return; }
  const entry=getMkEntryByDate(targetDate);
  if(!entry){ alert('해당 날짜는 등록된 토요보강일이 아닙니다'); return; }

  // ── 특강 사이클 내 중복 보강 경고 (push 전에 먼저 체크) ──
  const spKey=spLessonKey(spId,sid,sn);
  const existingSpecialMakeups=Object.entries(specialLessons||{}).filter(([k,v])=>
    k!==spKey &&
    v.studentId===sid &&
    v.specialId===spId &&
    v.specialMakeupRequest
  );
  if(existingSpecialMakeups.length){
    const dateList=existingSpecialMakeups.map(([,v])=>`  · ${v.sessionNo}회차 → ${v.specialMakeupRequest.date} 보강`).join('\n');
    if(!confirm(`⚠️ 이 특강에 이미 보강이 있습니다.\n${dateList}\n\n추가 보강은 예외적으로 처리됩니다. 그래도 등록하시겠어요?`)) return;
  }

  // makeupDays에 학생 추가/업데이트
  // 구형 데이터(makeupType 없음)도 함께 검색해 태깅, 없으면 새로 push
  let arr=getMakeupStudents(entry);
  const idx=arr.findIndex(x=>x.id===sid && (
    (x.makeupType==='special' && x.specialId===spId) ||
    (!x.makeupType && !x.specialId)
  ));
  if(idx>=0) arr[idx]={id:sid, period, teacher, makeupType:'special', specialId:spId};
  else arr.push({id:sid, period, teacher, makeupType:'special', specialId:spId});
  entry.students=arr;
  delete entry.studentIds;

  // specialLesson에 specialMakeupRequest 저장
  const key=spLessonKey(spId,sid,sn);
  const l=specialLessons[key]||{specialId:spId, studentId:sid, sessionNo:sn};
  l.specialMakeupRequest={date:targetDate, period, teacher};
  specialLessons[key]=l;

  try{
    await saveMakeupDayDoc(targetDate);
    await gasCall('saveSpecialLesson',{lesson:l});
    toast(`특강 보강 ${targetDate} ${period}교시 등록되었습니다`);
    closeM();
    render();
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

/* 특강 보강 신청 취소 */
async function cancelSpecialMakeup(spId, sid, sn){
  const key=spLessonKey(spId,sid,sn);
  const l=specialLessons[key];
  if(!l||!l.specialMakeupRequest) return;
  const req=l.specialMakeupRequest;
  // makeupDays에서 해당 특강 항목만 제거 (같은 날 정규 보강은 유지)
  const entry=getMkEntryByDate(req.date);
  if(entry){
    let arr=getMakeupStudents(entry);
    arr=arr.filter(x=>!(x.id===sid && x.makeupType==='special' && x.specialId===spId));
    entry.students=arr;
    delete entry.studentIds;
    await saveMakeupDayDoc(req.date).catch(()=>{});
  }
  delete l.specialMakeupRequest;
  try{
    await gasCall('saveSpecialLesson',{lesson:l});
    toast('특강 보강 신청이 취소됐습니다');
    render();
  }catch(e){ toast('취소 실패: '+e.message,true); }
}

// 특강 lesson 저장
async function spSave(spId, sid, sn, field, val){
  const key=spLessonKey(spId, sid, sn);
  const existing=specialLessons[key]||{specialId:spId, studentId:sid, sessionNo:sn};
  const oldV=existing[field];
  existing[field]=val;
  specialLessons[key]=existing;
  try{
    await gasCall('saveSpecialLesson', {lesson: existing});
    // 활동 로그 (선생님일 때만)
    const sp=(cfg.specialClasses||[]).find(x=>x.id===spId);
    const stud=(cfg.students||[]).find(x=>x.id===sid);
    if(session?.role!=='principal'){
      logActivity('special_edit', sid, existing.date||'', `[${sp?.name||'특강'}] ${sn}회차 ${field}`, oldV, val);
    }
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

async function spAttend(spId, sid, sn, v){
  const key=spLessonKey(spId, sid, sn);
  const existing=specialLessons[key]||{specialId:spId, studentId:sid, sessionNo:sn};
  const oldV=existing.attendance||'';
  existing.attendance=(existing.attendance===v?'':v);
  specialLessons[key]=existing;
  render();
  try{
    await gasCall('saveSpecialLesson', {lesson: existing});
    const sp=(cfg.specialClasses||[]).find(x=>x.id===spId);
    if(session?.role!=='principal'){
      logActivity('special_attendance', sid, existing.date||'', `[${sp?.name||'특강'}] ${sn}회차 출결`, oldV, existing.attendance);
    }
  }catch(e){ toast('저장 실패: '+e.message,true); }
}

async function delSpecial(spId){
  const sp=(cfg.specialClasses||[]).find(x=>x.id===spId);
  if(!sp) return;
  if(!confirm(`'${sp.name}' 특강을 삭제합니다. 모든 회차 기록이 사라져요. 계속하시겠어요?`)) return;
  cfg.specialClasses=(cfg.specialClasses||[]).filter(x=>x.id!==spId);
  try{
    await gasCall('saveConfig', {config: cfg});
    await gasCall('deleteSpecialLessons', {specialId: spId});
    toast('특강 삭제 완료');
    render();
  }catch(e){ toast('삭제 실패: '+e.message,true); }
}

// 특강 엑셀 다운로드 — 학생별 모든 회차의 출결/점수/진도/과제/특이사항을 한 표로
function exportSpecialExcel(spId){
  const sp=(cfg.specialClasses||[]).find(x=>x.id===spId);
  if(!sp){ toast('특강을 찾을 수 없습니다',true); return; }
  const studs=(cfg.students||[]).filter(s=>(sp.students||[]).includes(s.id));
  if(!studs.length){ toast('신청 학생이 없습니다',true); return; }

  const attMap={attend:'출석', late:'지각', absent:'결석', '':'-'};
  const totalSessions=sp.totalSessions||0;

  // 1) 시트1: 회차별 매트릭스 (가로=회차×5컬럼, 세로=학생)
  const headRow1=['학생','학년','반'];
  const headRow2=['','',''];
  for(let sn=1; sn<=totalSessions; sn++){
    headRow1.push(`${sn}회차`,'','','','');
    headRow2.push('날짜','출결','과제','시험','진도/특이');
  }
  const rows=[headRow1, headRow2];
  studs.forEach(s=>{
    const ct=CT()[s.classType];
    const row=[s.name, s.grade||'', ct?.label||s.classType];
    for(let sn=1; sn<=totalSessions; sn++){
      const l=specialLessons[spLessonKey(spId,s.id,sn)] || {};
      row.push(
        l.date||'',
        attMap[l.attendance||''] || '-',
        l.homeworkScore||'',
        l.testScore||'',
        l.progress||''
      );
    }
    rows.push(row);
  });

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // 셀 너비 조정
  const cols=[{wch:10},{wch:8},{wch:12}];
  for(let sn=1; sn<=totalSessions; sn++){
    cols.push({wch:12},{wch:8},{wch:8},{wch:8},{wch:24});
  }
  ws['!cols']=cols;
  // 1행 회차명 셀 병합 (각 회차 5칸씩)
  const merges=[];
  for(let sn=0; sn<totalSessions; sn++){
    const startCol=3 + sn*5;
    merges.push({s:{r:0,c:startCol}, e:{r:0,c:startCol+4}});
  }
  ws['!merges']=merges;
  XLSX.utils.book_append_sheet(wb, ws, '회차 매트릭스');

  // 2) 시트2: 학생별 통계 요약
  const sumRows=[['학생','학년','반','출석','지각','결석','과제평균','시험평균','진행률(%)']];
  studs.forEach(s=>{
    const ct=CT()[s.classType];
    let attend=0,absent=0,late=0,hwScores=[],testScores=[],filled=0;
    for(let sn=1; sn<=totalSessions; sn++){
      const l=specialLessons[spLessonKey(spId,s.id,sn)];
      if(!l) continue;
      if(l.attendance==='attend') attend++;
      else if(l.attendance==='absent') absent++;
      else if(l.attendance==='late') late++;
      const hs=parseFloat(l.homeworkScore); if(!isNaN(hs)) hwScores.push(hs);
      const ts=parseFloat(l.testScore); if(!isNaN(ts)) testScores.push(ts);
      if(l.attendance||l.homeworkScore||l.testScore||l.progress) filled++;
    }
    const hwAvg=hwScores.length?Math.round(hwScores.reduce((a,b)=>a+b,0)/hwScores.length):'';
    const testAvg=testScores.length?Math.round(testScores.reduce((a,b)=>a+b,0)/testScores.length):'';
    const prog=totalSessions>0?Math.round(filled/totalSessions*100):0;
    sumRows.push([s.name, s.grade||'', ct?.label||s.classType, attend, late, absent, hwAvg, testAvg, prog]);
  });
  const ws2=XLSX.utils.aoa_to_sheet(sumRows);
  ws2['!cols']=[{wch:10},{wch:8},{wch:12},{wch:8},{wch:8},{wch:8},{wch:10},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, '학생별 요약');

  // 3) 특강 정보 시트
  const infoRows=[
    ['특강 정보',''],
    ['이름', sp.name],
    ['총 회차', sp.totalSessions||0],
    ['시작일', sp.startDate||''],
    ['담당 선생님', sp.teacher||''],
    ['신청 학생 수', studs.length],
    ['생성 일시', new Date().toLocaleString('ko-KR')],
  ];
  const ws3=XLSX.utils.aoa_to_sheet(infoRows);
  ws3['!cols']=[{wch:14},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws3, '특강 정보');

  const safeName=sp.name.replace(/[\\/:*?"<>|]/g,'_');
  XLSX.writeFile(wb, `특강_${safeName}_${dk(new Date())}.xlsx`);
  toast('특강 엑셀 다운로드 완료');
}

/* 교재가 통과됐는지 판별하는 헬퍼 */
function isTbPassed(sid, tbId){
  return (textbookTests[sid]||{})[tbId]?.some(a=>a.passed)||false;
}

function rTextbook(){
  const isPrin=session?.role==='principal';
  const allStuds=cfg.students||[];
  const studs=(!isPrin && !st.viewAll)
    ? allStuds.filter(s=>isStudentOfTeacher(s, session?.username))
    : allStuds;
  const filterSt=st.tbFilterSt||'all';

  let h=`<div class="toolbar">
    <div class="tleft">
      <select onchange="st.tbFilterSt=this.value;render()">
        <option value="all">전체 학생</option>
        ${studs.map(s=>`<option value="${s.id}" ${filterSt===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select>
    </div>
  </div>`;

  const filtered=studs.filter(s=>filterSt==='all'||s.id===filterSt);
  if(!filtered.length){ h+=`<div class="empty">학생이 없습니다.</div>`; return h; }

  // 반별 그룹화 (진행 중 교재가 있는 학생만 표시)
  const byClass=new Map();
  filtered.forEach(s=>{
    // 통과되지 않은 교재가 하나라도 있어야 표시
    const activeTbs=(s.textbooks||[]).filter(t=>{
      const tbId=t.tbId||('p_'+s.id+'_'+encodeURIComponent(t.name||''));
      return !isTbPassed(s.id, tbId);
    });
    if(filterSt!=='all'||activeTbs.length){
      const k=s.classType;
      if(!byClass.has(k)) byClass.set(k,[]);
      byClass.get(k).push({s, activeTbs});
    }
  });

  if(!byClass.size){
    h+=`<div class="empty">진행 중인 교재가 없습니다.<br><small style="color:var(--text3)">모든 교재가 완료됐거나 배정된 교재가 없습니다.</small></div>`;
    return h;
  }

  byClass.forEach((items,type)=>{
    const ct=CT()[type];
    h+=`<div style="margin-bottom:14px">
      <div style="padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;gap:6px">
        <span class="badge ${ct?.badge||'b-mwf'}" style="font-size:11px">${esc(ct?.label||type)}</span>
        <span style="font-size:11px;color:var(--text2)">${items.length}명</span>
      </div>
      <div style="border:1px solid var(--border);border-top:none;border-radius:0 0 var(--rl) var(--rl);background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">`;
    items.forEach(({s, activeTbs})=>{ h+=renderTextbookStudentCard(s, activeTbs); });
    h+=`</div></div>`;
  });

  // ── 완료된 교재 섹션 ──
  const completeRows=[];
  filtered.forEach(s=>{
    const myTests=textbookTests[s.id]||{};
    (s.textbooks||[]).forEach(t=>{
      const tbId=t.tbId||('p_'+s.id+'_'+encodeURIComponent(t.name||''));
      if(!isTbPassed(s.id, tbId)) return;
      const tbName=t.name||(cfg.textbooks||[]).find(b=>b.id===t.tbId)?.name||'교재';
      const attempts=(myTests[tbId]||[]);
      const passAttempt=attempts.find(a=>a.passed);
      const prog=textbookProgress[tbKey(s.id,tbId)]||{};
      completeRows.push({s, tbId, tbName, passAttempt, attempts, prog});
    });
  });

  if(completeRows.length){
    // 반별 그룹화
    const byClassC=new Map();
    completeRows.forEach(r=>{
      const k=r.s.classType;
      if(!byClassC.has(k)) byClassC.set(k,[]);
      byClassC.get(k).push(r);
    });

    h+=`<div style="margin-top:20px">
      <div style="font-size:13px;font-weight:700;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:6px">
        ✅ 완료된 교재
        <span style="font-size:11px;font-weight:400;color:var(--text3)">${completeRows.length}건 통과</span>
      </div>`;
    byClassC.forEach((items,type)=>{
      const ct=CT()[type];
      h+=`<div style="margin-bottom:16px">
        <div style="padding:6px 12px;background:var(--green-bg);border:1px solid #80c090;border-radius:var(--rl) var(--rl) 0 0;display:flex;align-items:center;gap:6px">
          <span class="badge ${ct?.badge||'b-mwf'}" style="font-size:11px">${esc(ct?.label||type)}</span>
          <span style="font-size:11px;color:var(--green)">${items.length}건 완료</span>
        </div>
        <div style="border:1px solid #80c090;border-top:none;border-radius:0 0 var(--rl) var(--rl);background:var(--bg)">`;
      items.forEach(({s, tbId, tbName, passAttempt, attempts, prog})=>{
        const startDate=prog.startDate||'';
        const passDate=passAttempt?.date||'';
        const dateRange=startDate&&passDate?`${startDate} → ${passDate}`:(startDate?`${startDate} 시작`:(passDate?`${passDate} 완료`:''));
        const elapsed=durationBetweenLabel(startDate, passDate);
        h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap">`;
        h+=`<div style="display:flex;align-items:center;gap:5px;min-width:80px;flex-shrink:0">`;
        h+=`<span style="font-weight:700;font-size:13px;cursor:pointer" onclick="openM('studentProfile','${s.id}')">${esc(s.name)}</span>`;
        if(s.grade) h+=gradeBadge(s.grade);
        if(s.level) h+=levelBadge(s.level);
        h+=`</div>`;
        h+=`<div style="flex:1;min-width:100px">`;
        h+=`<div style="font-size:12px;font-weight:600">📖 ${esc(tbName)}</div>`;
        if(dateRange) h+=`<div style="font-size:10px;color:var(--text3);margin-top:1px">${esc(dateRange)}</div>`;
        if(elapsed) h+=`<div style="font-size:10px;font-weight:600;color:var(--green);margin-top:1px">⏱ ${esc(elapsed)}</div>`;
        h+=`</div>`;
        h+=`<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">`;
        h+=passAttempt?.manualComplete
          ? `<span style="font-size:13px;font-weight:700;color:var(--green)">✅ 완료 처리</span>`
          : `<span style="font-size:13px;font-weight:700;color:var(--green)">✅ ${passAttempt?.score}점</span>`;
        h+=`<span style="font-size:10px;color:var(--text3)">${attempts.length}차 시도</span>`;
        h+=`</div>`;
        h+=`</div>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }

  return h;
}

function renderTextbookStudentCard(s, activeTbs){
  // activeTbs: 전달되면 그것만 표시, 없으면 통과 안 된 것만 필터
  const allTbs=s.textbooks||[];
  const myTests=textbookTests[s.id]||{};
  const sTbs=activeTbs||allTbs.filter(t=>{
    const tbId=t.tbId||('p_'+s.id+'_'+encodeURIComponent(t.name||''));
    return !isTbPassed(s.id, tbId);
  });
  const ct=CT()[s.classType];
  const hasFriday=ct&&ct.days&&ct.days.includes(5);
  const wdInfo=[s.weekdayTime?`${s.weekdayTime}교시`:'', s.teacher?s.teacher:''].filter(Boolean).join(' · ');
  const friInfo=hasFriday?[s.fridayTime?`금 ${s.fridayTime}교시`:'', s.fridayTeacher?s.fridayTeacher:s.teacher?s.teacher:''].filter(Boolean).join(' · '):'';

  let h=`<div style="padding:10px 12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)">`;
  h+=`<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap">`;
  h+=`<span style="font-weight:700;font-size:13px;cursor:pointer" onclick="openM('studentProfile','${s.id}')">${esc(s.name)}</span>`;
  if(s.grade) h+=gradeBadge(s.grade);
  if(s.level) h+=levelBadge(s.level);
  h+=`<div style="display:flex;gap:3px;margin-left:auto">`;
  h+=`<button class="btn btn-sm" style="padding:2px 7px;font-size:10px" onclick="openM('assignTextbook','${s.id}')">+배정</button>`;
  if(allTbs.length) h+=`<button class="btn btn-sm" style="padding:2px 7px;font-size:10px" onclick="openM('addTest','${s.id}')">✱시험</button>`;
  h+=`</div></div>`;
  if(wdInfo||friInfo){
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px">`;
    if(wdInfo) h+=`<span style="font-size:10px;color:#1558a8;background:#e5effc;border-radius:6px;padding:1px 6px">${esc(wdInfo)}</span>`;
    if(friInfo) h+=`<span style="font-size:10px;color:#7a4e00;background:#fdf0d8;border-radius:6px;padding:1px 6px">금 ${esc(friInfo)}</span>`;
    h+=`</div>`;
  }
  if(s.specialNote){
    h+=`<div style="font-size:10px;color:#5a2080;background:#f3e8fc;border-radius:4px;padding:2px 6px;margin-bottom:5px">📌 ${esc(s.specialNote)}</div>`;
  }
  if(!sTbs.length){
    h+=`<div style="font-size:11px;color:var(--text3)">진행 중인 교재 없음</div>`;
  } else {
    sTbs.forEach(t=>{
      const tbId=t.tbId||('p_'+s.id+'_'+encodeURIComponent(t.name||''));
      const tbName=t.name||(cfg.textbooks||[]).find(b=>b.id===t.tbId)?.name||'교재';
      const attempts=myTests[tbId]||[];
      const passed=attempts.some(a=>a.passed);
      const lastScore=attempts.length?attempts[attempts.length-1].score:null;
      const dot=passed?'✅':attempts.length?'❌':'○';
      const dotTitle=passed?'통과':attempts.length?`${lastScore}점 재시험`:'미응시';
      const origIdx=allTbs.findIndex(x=>(x.tbId||('p_'+s.id+'_'+encodeURIComponent(x.name||'')))===tbId);
      h+=`<div style="display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--border)">`;
      h+=`<span style="font-size:10px;flex-shrink:0" title="${dotTitle}">${dot}</span>`;
      h+=`<span style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="openM('editProgress','${s.id}','${tbId}')" title="${esc(tbName)}">${esc(tbName)}</span>`;
      h+=`<button style="border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0" onclick="removeStuTextbook('${s.id}','${tbId}')" title="삭제">×</button>`;
      h+=`</div>`;
    });
  }
  h+=`</div>`;
  return h;
}

      if(elapsed) h+=`<div style="font-size:10px;font-weight:600;color:var(--green);margin-top:1px">⏱ ${esc(elapsed)}</div>`;
      h+=`</div>`;
      // 통과 정보
      h+=`<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">`;
      h+=passAttempt?.manualComplete
        ? `<span style="font-size:13px;font-weight:700;color:var(--green)">✅ 완료 처리</span>`
        : `<span style="font-size:13px;font-weight:700;color:var(--green)">✅ ${passAttempt?.score}점</span>`;
      h+=`<span style="font-size:10px;color:var(--text3)">${attempts.length}차 시도</span>`;
      h+=`</div>`;
      h+=`</div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function showTbAssignedStudents(tbId){

      h+=`<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg2);border-radius:5px;cursor:pointer" onclick="document.getElementById('tbAssignPopOverlay').remove();openM('studentProfile','${s.id}')">
        <span style="font-weight:600;font-size:12px">${esc(s.name)}</span>

      </div>`;
    });
    h+=`</div></div>`;
    return h;
  };

  overlay.id='tbAssignPopOverlay';
  overlay.innerHTML=`<div class="modal" style="max-width:380px">
    <h3>📖 ${esc(bk.name)} — 배정 학생</h3>
    ${renderGroup('진행 중','🔵','var(--blue)','#e5effc',inProgress)}

    <div class="mfoot"><button class="btn" onclick="document.getElementById(\'tbAssignPopOverlay\').remove()">닫기</button></div>
  </div>`;
  document.body.appendChild(overlay);
}

async function changeSeriesTier(seriesName, tier){
  const books = cfg.textbooks||[];
  let changed = 0;
  books.forEach(bk=>{
    if(bk.seriesName===seriesName){
      bk.masterTier = tier;
      changed++;
    }
  });
  if(!changed) return;
  try{
    await gasCall('saveConfig',{config:cfg});
    const label = tier==='none'?'포인트 없음':tier==='high'?'HIGH 5,000P':'LOW 2,000P';
    toast(`'${seriesName}' 시리즈 ${changed}권 → ${label} 변경됨`);
    render();
  }catch(e){ toast('저장 실패: '+e.message, true); }
}

async function delTextbook(id){
  if(!confirm('교재를 삭제합니다. 학생 배정 정보도 함께 제거됩니다. 계속하시겠어요?')) return;
  cfg.textbooks = (cfg.textbooks||[]).filter(b=>b.id!==id);
  // 학생들의 textbooks에서도 제거
  (cfg.students||[]).forEach(s=>{
    if(s.textbooks) s.textbooks=s.textbooks.filter(t=>t.tbId!==id);
  });
  await gasCall('saveConfig',{config:cfg});
  render();
}

// Alert flags
function getAlerts(stats, ev){
  const flags=[];
  if(stats.absent>=2)  flags.push({type:'red',   icon:'🚫', text:`결석 ${stats.absent}회`});
  if(stats.late>=3)    flags.push({type:'amber',  icon:'⚠️', text:`지각 ${stats.late}회`});
  if(stats.hwAvg!==null&&stats.hwAvg<=60) flags.push({type:'amber', icon:'📝', text:`과제평균 ${stats.hwAvg}점`});
  if(ev){
    if(ev.app>0 && ev.app<=2) flags.push({type:'amber', icon:'🧠', text:`응용력 ${'★'.repeat(ev.app)}${'☆'.repeat(5-ev.app)}`});
    if(ev.focus>0 && ev.focus<=2) flags.push({type:'amber', icon:'👁', text:`집중도 ${'★'.repeat(ev.focus)}${'☆'.repeat(5-ev.focus)}`});
    if(ev.hw>0 && ev.hw<=2) flags.push({type:'amber', icon:'📋', text:`과제충실도 ${'★'.repeat(ev.hw)}${'☆'.repeat(5-ev.hw)}`});
  }
  return flags;
}

/* 학생이 특정 기간(startDate~endDate)에 본 전범위 시험 목록
   - lesson(testIsFullRange)만 기준으로 추출
   - attempt(1차/2차/...)는 같은 교재 내에서 시간순으로 자체 계산
   - 교재명은 textbookTests에서 같은 날짜+점수로 매칭 */
function getFullRangeTestsInWeek(sid, startDate, endDate){
  if(!startDate || !endDate) return [];
  const studTests = textbookTests[sid] || {};
  const books = cfg.textbooks || [];
  const stud = (cfg.students||[]).find(x=>x.id===sid);

  // 교재명 추출 헬퍼
  const resolveBookName=(date, score)=>{
    let name = '전범위 시험';
    Object.entries(studTests).forEach(([tbId, attempts])=>{
      attempts.forEach(att=>{
        if(att.date === date && parseFloat(att.score)===score){
          const bk = books.find(b=>b.id===tbId);
          const studTb = (stud?.textbooks||[]).find(t=>t.tbId===tbId || ('p_'+sid+'_'+encodeURIComponent(t.name||''))===tbId);
          name = bk?.name || studTb?.name || name;
        }
      });
    });
    return name;
  };

  // 1) 학생의 모든 전범위 시험 lesson을 시간순으로
  const allFullRangeLessons = Object.values(mdb.lessons||{})
    .filter(l=> l.studentId===sid && l.testIsFullRange && l.testScore && String(l.testScore).trim()!=='' && !isNaN(parseFloat(l.testScore)))
    .sort((a,b)=> a.date.localeCompare(b.date));

  // 2) 각 lesson에 교재명 + 교재별 시간순 attempt 번호
  const lessonsWithName = allFullRangeLessons.map(l=>{
    const score = parseFloat(l.testScore);
    return { lesson:l, score, bookName: resolveBookName(l.date, score) };
  });
  const bookCounter = {};
  lessonsWithName.forEach(item=>{
    bookCounter[item.bookName] = (bookCounter[item.bookName]||0) + 1;
    item.attempt = bookCounter[item.bookName];
  });

  // 3) 해당 기간 안의 lesson만 결과로
  const result = [];
  lessonsWithName.forEach(item=>{
    if(item.lesson.date < startDate || item.lesson.date > endDate) return;
    result.push({
      textbookName: item.bookName,
      attempt: item.attempt,
      score: item.score,
      passed: item.score >= 80,
      date: item.lesson.date,
    });
  });
  return result;
}

/* ── WEEKLY RENDER ── */
function rWeekly(){
  const studs=cfg.students||[];
  if(!studs.length) return `<div class="empty">학생이 없습니다.</div>`;

  const filterMode=st.weeklyFilter||'all'; // 'all' | 'care'
  const filterClass=st.weeklyClass||'all';
  const isPrin=session?.role==='principal';
  const filterTeacher=isPrin?(st.weeklyTeacher||''):'';
  const todayStr=dk(new Date());

  // 학생별 회차 기준 주차 계산 (항상 4주차로 분할)
  // - 주3회반 (월수금/화목금): 1달=12회, 1주차=3회
  // - 주2회반 (월수/화목): 1달=8회, 1주차=2회
  function getStudentWeeks(s){
    const ct=CT()[s.classType];
    if(!ct) return [];
    const sessions=sessionsForMonthWithCycle(s.classType,st.year,st.month);
    if(!sessions.length) return [];
    const perWeek = Math.max(1, Math.round(sessions.length / 4));
    const weeks=[];
    for(let i=0; i<sessions.length; i+=perWeek){
      const chunk=sessions.slice(i, i+perWeek);
      if(!chunk.length) break;
      weeks.push({
        weekNo: weeks.length+1,
        sessions: chunk,
        dates: chunk.map(x=>x.dateStr),
      });
      if(weeks.length>=4) break;
    }
    // 각 주차의 시간 범위(rangeStart~rangeEnd) 계산
    // - rangeStart: 첫 회차 날짜
    // - rangeEnd: 다음 주차 첫 회차 직전 (마지막 주차는 마지막 회차 + 7일)
    weeks.forEach((w, idx)=>{
      w.rangeStart = w.dates[0];
      if(idx < weeks.length-1){
        // 다음 주차 첫 회차 - 1일
        const nextStart = weeks[idx+1].dates[0];
        const dt = parseDate(nextStart);
        dt.setDate(dt.getDate()-1);
        w.rangeEnd = dk(dt);
      } else {
        // 마지막 주차: 마지막 회차 + 7일
        const dt = parseDate(w.dates[w.dates.length-1]);
        dt.setDate(dt.getDate()+7);
        w.rangeEnd = dk(dt);
      }
    });
    return weeks;
  }

  // 각 주차의 통계 계산 — 정규 회차(week.dates)만 사용 (토요보강 제외)
  function calcWeekStats(sid, week, classType){
    const dates=[...week.dates]; // 정규 회차만
    let attend=0,absent=0,late=0;
    let hwScores=[], testScores=[];
    dates.forEach(d=>{
      const l=mdb.lessons[lk(sid,d)];
      if(!l) return;
      if(l.attendance==='attend') attend++;
      else if(l.attendance==='absent') absent++;
      else if(l.attendance==='late') late++;
      const hs=parseFloat(l.homeworkScore);
      if(!isNaN(hs)) hwScores.push(hs);
      // 전범위 시험은 평균에서 제외
      if(!l.testIsFullRange){
        const ts=parseFloat(l.testScore);
        if(!isNaN(ts)) testScores.push(ts);
      }
    });
    const hwAvg=hwScores.length?Math.round(hwScores.reduce((a,b)=>a+b,0)/hwScores.length):null;
    const testAvg=testScores.length?Math.round(testScores.reduce((a,b)=>a+b,0)/testScores.length):null;
    return {attend,absent,late,hwAvg,testAvg,total:dates.length,allDates:dates};
  }

  // 관리 필요 학생 카운트
  const careStudents=new Set();
  studs.forEach(s=>{
    if(filterTeacher && !isStudentOfTeacher(s,filterTeacher)) return;
    // 선생님이고 viewAll 꺼져있으면 본인 담당 학생만 (평일/금요일 어느 하나라도 담당이면 표시)
    if(!isPrin && !st.viewAll && !isStudentOfTeacher(s, session?.username)) return;
    const weeks=getStudentWeeks(s);
    weeks.forEach(w=>{
      const stats=calcWeekStats(s.id, w, s.classType);
      const wKey=`${st.year}-${String(st.month).padStart(2,'0')}-w${w.weekNo}`;
      const ev=getWkEval(s.id,wKey);
      if(getAlerts(stats,ev).length>0) careStudents.add(s.id);
    });
  });

  let h=`<div class="toolbar">
    <div class="tleft" style="flex-wrap:wrap">
      <div class="wk-filter-tabs">
        <button class="wk-ftab${filterMode==='all'?' active':''}" onclick="setWkFilter('all')">전체 학생</button>
        <button class="wk-ftab${filterMode==='care'?' active':''}" onclick="setWkFilter('care')">🚨 관리 필요 (${careStudents.size}명)</button>
      </div>
      <select onchange="setWkClass(this.value)">
        <option value="all" ${filterClass==='all'?'selected':''}>전체 반</option>
        ${Object.entries(CT()).map(([k,v])=>`<option value="${k}" ${filterClass===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      ${isPrin?`<select onchange="setWkTeacher(this.value)" title="선생님별 필터">
        <option value="" ${!filterTeacher?'selected':''}>👩‍🏫 전체 선생님</option>
        ${allTeachers().map(t=>`<option value="${esc(t)}" ${filterTeacher===t?'selected':''}>${esc(t)}</option>`).join('')}
      </select>`:''}
    </div>
    <button class="btn btn-green" onclick="exportWeeklyExcel()">📥 주간요약 엑셀</button>
  </div>
  <div class="notice" style="margin-top:8px">📌 주차는 <b>학생 본인의 회차 기준</b>입니다 · 주2회반(월수/화목)은 한 주에 2회 · 주3회반(월수금/화목금)은 한 주에 3회 · <b>총 4주차</b>로 구분되며 매 주차마다 응용력·집중도·과제충실도를 평가합니다</div>`;

  // 관리 필요 배너
  if(careStudents.size>0){
    const careNames=[...careStudents].map(id=>(studs.find(s=>s.id===id)||{}).name).filter(Boolean);
    h+=`<div class="care-header">🚨 관리 필요 학생 ${careStudents.size}명: ${careNames.join(', ')}</div>`;
  }

  // 4주차 각각을 섹션으로 표시
  for(let weekNo=1; weekNo<=4; weekNo++){
    // 이 주차에 해당하는 학생들 (모두 12회차/8회차로 분할되어 있음)
    let weekStuds=studs.filter(s=>{
      if(filterClass!=='all' && s.classType!==filterClass) return false;
      if(filterMode==='care' && !careStudents.has(s.id)) return false;
      if(filterTeacher && !isStudentOfTeacher(s,filterTeacher)) return false;
      // 선생님이고 viewAll 꺼져있으면 본인 담당 학생만
      if(!isPrin && !st.viewAll && !isStudentOfTeacher(s, session?.username)) return false;
      const weeks=getStudentWeeks(s);
      return weeks.length>=weekNo;
    });
    if(!weekStuds.length) continue;

    // 이번 주에 해당하는 학생이 있는지
    const isCurrentWeek=weekStuds.some(s=>{
      const weeks=getStudentWeeks(s);
      const w=weeks[weekNo-1];
      if(!w) return false;
      return w.dates.some(d=>d===todayStr);
    });

    h+=`<div class="wk-section">
      <div class="wk-title">
        ${weekNo}주차
        ${isCurrentWeek?'<span class="badge" style="background:#fff5cc;color:#7a4e00;font-size:11px">진행 중</span>':''}
        <span style="font-size:11px;color:var(--text3)">${weekStuds.length}명</span>
      </div>
      <div class="wk-grid">`;

    weekStuds.forEach(s=>{
      const weeks=getStudentWeeks(s);
      const w=weeks[weekNo-1];
      if(!w) return;
      const stats=calcWeekStats(s.id, w, s.classType);
      const wKey=`${st.year}-${String(st.month).padStart(2,'0')}-w${weekNo}`;
      const ev=getWkEval(s.id, wKey);
      const alerts=getAlerts(stats, ev);
      const needsCare=alerts.length>0;

      // 회차별 출결 pill
      const datePills=w.sessions.map(sess=>{
        const d=sess.dateStr;
        const l=mdb.lessons[lk(s.id,d)]||{};
        const att=l.attendance||'';
        const cls=att==='attend'?'pill-a':att==='late'?'pill-l':att==='absent'?'pill-x':'pill-n';
        const label=att==='attend'?'출':att==='late'?'지':att==='absent'?'결':'?';
        return `<span class="att-pill ${cls}" title="${d}">${sess.sessionNo}회 ${label}</span>`;
      }).join('');

      h+=`<div class="wk-card${needsCare?' needs-care':''}">
        <div class="wk-card-hdr">
          <b style="font-size:13px">${s.name}</b>
          ${s.grade?gradeBadge(s.grade):''}
          <button onclick="openM('studentProfile','${s.id}')" style="padding:2px 8px;font-size:11px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit">📋 상세</button>
          <div class="att-pills" style="flex-wrap:wrap;gap:3px">${datePills}</div>
        </div>
        <div class="wk-card-body">`;

      // Alert badges
      if(alerts.length){
        h+=`<div class="alert-row">`;
        alerts.forEach(a=>{ h+=`<span class="alert-badge alert-${a.type}">${a.icon} ${a.text}</span>`; });
        h+=`</div>`;
      } else {
        h+=`<div class="alert-row"><span class="alert-badge alert-green">✅ 이상 없음</span></div>`;
      }

      // 출결 + 점수 평균 라인
      h+=`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-bottom:10px;padding:6px 8px;background:var(--bg2);border-radius:6px">
        <span>출 <b style="color:var(--green)">${stats.attend}</b></span>
        <span>지 <b style="color:var(--amber)">${stats.late}</b></span>
        <span>결 <b style="color:var(--red)">${stats.absent}</b></span>
        <span style="margin-left:auto">📝 과제평균 <b style="color:${stats.hwAvg!==null && stats.hwAvg<=60?'var(--red)':'var(--text)'}">${stats.hwAvg!==null?stats.hwAvg+'점':'-'}</b></span>
        <span>📊 시험평균 <b>${stats.testAvg!==null?stats.testAvg+'점':'-'}</b></span>
      </div>`;

      // 그 주차에 본 전범위 시험 표시
      const fullRangeTests = getFullRangeTestsInWeek(s.id, w.rangeStart||stats.allDates[0], w.rangeEnd||stats.allDates[stats.allDates.length-1]);
      if(fullRangeTests.length){
        fullRangeTests.forEach(t=>{
          const ordLabel = t.attempt===1 ? '시험' : `${t.attempt}차시험`;
          const passLabel = t.passed
            ? `<span style="color:#3a6818;font-weight:700">합격</span>`
            : `<span style="color:#a02828;font-weight:700">불합격</span>`;
          h+=`<div style="font-size:12px;padding:7px 10px;background:#fff8e8;border:1px solid #f0d090;border-radius:6px;margin-bottom:6px">
            📚 <b>${esc(t.textbookName)}</b> 전범위 서술형 ${ordLabel} 결과: <b style="color:${t.passed?'#3a6818':'#a02828'}">${t.score}점</b> ${passLabel}
          </div>`;
        });
      }

      // 평가 행
      h+=`<div class="eval-row"><span class="eval-lbl">응용력</span>${starsHtml(s.id,wKey,'app',ev.app)}</div>`;
      h+=`<div class="eval-row"><span class="eval-lbl">집중도</span>${starsHtml(s.id,wKey,'focus',ev.focus)}</div>`;
      h+=`<div class="eval-row"><span class="eval-lbl">과제충실도</span>${starsHtml(s.id,wKey,'hw',ev.hw)}</div>`;

      // Memo
      h+=`<div style="margin-top:6px">
        <textarea class="wk-memo" placeholder="주간 메모 (선생님 코멘트)" onblur="wkSetMemo('${s.id}','${wKey}',this.value)">${esc(ev.memo||'')}</textarea>
      </div>`;

      h+=`</div></div>`;
    });

    h+=`</div></div>`;
  }

  return h;
}

/* ── MONTHLY SUMMARY TAB ── */
function rMonthly(){
  const studs = cfg.students||[];
  if(!studs.length) return `<div class="empty">학생이 없습니다.</div>`;

  const isPrin = session?.role==='principal';
  const filterClass = st.monthlyClass||'all';

  let filtered = studs.filter(s=>{
    if(filterClass!=='all' && s.classType!==filterClass) return false;
    if(!isPrin && !st.viewAll && !isStudentOfTeacher(s, session?.username)) return false;
    return true;
  });

  // 월 전체 출결 통계
  function calcMonthStats(sid, classType){
    // 통계는 이번달 귀속 사이클만 사용 (이전달 overflow 제외)
    const _ownCycleSt=_getAllCycles(classType).find(c=>c.ownerMonth===`${st.year}-${String(st.month).padStart(2,'0')}`);
    const sessions = _ownCycleSt ? _ownCycleSt.dates.map((d,i)=>({sessionNo:i+1,dateStr:d})) : [];
    let attend=0, absent=0, late=0, testScores=[];
    sessions.forEach(sess=>{
      const l = mdb.lessons[lk(sid, sess.dateStr)];
      if(!l) return;
      if(l.attendance==='attend') attend++;
      else if(l.attendance==='absent') absent++;
      else if(l.attendance==='late') late++;
      if(l.attendance!=='absent' && !l.testIsFullRange){ const ts=parseFloat(l.testScore); if(!isNaN(ts)) testScores.push(ts); }
    });
    const testAvg = testScores.length ? Math.round(testScores.reduce((a,b)=>a+b,0)/testScores.length) : null;
    return { attend, absent, late, testAvg, totalSessions: sessions.length };
  }

  // 전범위 1차 90점 이상 여부 — 해당 사이클(ownerMonth) 기준
  function hasMasterScore(sid){
    const myTests = textbookTests[sid]||{};
    const targetMonthStr = `${st.year}-${String(st.month).padStart(2,'0')}`;
    return Object.values(myTests).some(arr=>{
      const first = arr.find(a=>Number(a.attempt)===1);
      if(!first || first.manualComplete) return false;
      if(!isNaN(parseFloat(first.score)) && parseFloat(first.score)>=90){
        // 포인트 없는 교재는 제외
        const bk=(cfg.textbooks||[]).find(b=>b.id===first.textbookId);
        if((bk?.masterTier||'high')==='none') return false;
        // 시험 날짜의 ownerMonth(사이클 기준)가 현재 보는 달인지 확인
        const testDate = first.date||'';
        if(testDate){
          // 이 학생의 classType 사이클에서 날짜 조회
          const sid2 = first.studentId;
          const stu = (cfg.students||[]).find(x=>x.id===sid2)||(cfg.students||[]).find(x=>x.id===sid);
          const ct2 = stu ? stu.classType : null;
          if(ct2){
            const _cyc = _getAllCycles(ct2);
            let ownerM = testDate.substring(0,7);
            for(const c of _cyc){ if(c.dates.includes(testDate)){ ownerM=c.ownerMonth; break; } }
            if(ownerM !== targetMonthStr) return false;
          } else {
            // classType 모를 때: calendar month 기준
            if(testDate.substring(0,7) !== targetMonthStr) return false;
          }
        }
        return true;
      }
      return false;
    });
  }

  // 상 계산
  function calcAwards(sid, classType){
    const stats = calcMonthStats(sid, classType);
    const awards = [];
    const ct2 = CT()[classType];
    const requiredSessions = ct2 ? (ct2.sessions || 0) : 0;
    // 수상 판단은 이번달 귀속 사이클만 사용 (이전달 overflow 제외)
    const _ownCycleAw=_getAllCycles(classType).find(c=>c.ownerMonth===`${st.year}-${String(st.month).padStart(2,'0')}`);
    const allSessions = _ownCycleAw ? _ownCycleAw.dates.map((d,i)=>({sessionNo:i+1,dateStr:d})) : [];
    // 포인트 정산과 동일 기준: 사이클 날짜 수(sessions.length)가 필요 회차 이상이면 완료로 판단
    const cycleComplete = requiredSessions > 0 && allSessions.length >= requiredSessions;

    // 등록일 기준: 사이클 전체 참여 여부 확인
    const stu = (cfg.students||[]).find(x=>x.id===sid);
    const joinDate = stu?.joinDate||'';
    const validSessions = joinDate ? allSessions.filter(s=>s.dateStr>=joinDate) : allSessions;
    const canEarnAward = cycleComplete && validSessions.length >= requiredSessions;

    if(canEarnAward){
      if(stats.absent===0 && stats.late===0 && stats.attend>=requiredSessions)
        awards.push({id:'perfect', label:'PERFECT', sub:'출석상', icon:'🏅', color:'#1e6e3a', bg:'#e2f2e9', border:'#80c090'});
      else if(stats.absent===0 && stats.late>=1 && stats.late<=2 && (stats.attend+stats.late)>=requiredSessions)
        awards.push({id:'steady',  label:'STEADY',  sub:'출석상', icon:'⭐', color:'#1558a8', bg:'#e5effc', border:'#90b8e8'});
    }
    if(canEarnAward && stats.testAvg!==null && stats.testAvg>=80)
      awards.push({id:'daily', label:'DAILY', sub:'챌린지상', icon:'📊', color:'#7a4e00', bg:'#fdf0d8', border:'#e0c060'});
    if(canEarnAward && hasMasterScore(sid))
      awards.push({id:'master', label:'MASTER', sub:'인증상', icon:'👑', color:'#5a2080', bg:'#f3e8fc', border:'#c090e0'});
    return { awards, stats };
  }

  // 상별 집계
  const awardGroups = { perfect:[], steady:[], daily:[], master:[] };

    const {awards} = calcAwards(s.id, s.classType);

  const yl = `${st.year}년 ${st.month}월`;

  let h = `<div class="toolbar">
    <div class="tleft" style="flex-wrap:wrap;gap:8px">
      <b style="font-size:14px">🏆 ${yl} 월간 요약</b>

        <option value="all" ${filterClass==='all'?'selected':''}>전체 반</option>
        ${Object.entries(CT()).map(([k,v])=>`<option value="${k}" ${filterClass===k?'selected':''}>${v.label}</option>`).join('')}

  </div>

  <div class="notice" style="margin-top:0;margin-bottom:14px">

      <div style="font-size:22px;font-weight:700;color:#1e6e3a;margin-top:6px">${awardGroups.perfect.length}명</div>

      <div style="font-size:22px;font-weight:700;color:#1558a8;margin-top:6px">${awardGroups.steady.length}명</div>
    </div>
    <div style="padding:12px 14px;border-radius:var(--rl);border:1px solid #e0c060;background:#fdf0d8">
      <div style="font-size:14px;font-weight:800;color:#7a4e00">📊 DAILY 챌린지상</div>
      <div style="font-size:11px;color:#7a4e00;margin-top:3px">시험 평균 80점 이상</div>
      <div style="font-size:22px;font-weight:700;color:#7a4e00;margin-top:6px">${awardGroups.daily.length}명</div>
    </div>
    <div style="padding:12px 14px;border-radius:var(--rl);border:1px solid #c090e0;background:#f3e8fc">

// 포인트 계산 상수
const PT = {
  PERFECT: 5000,
  STEADY:  2000,
  DAILY:   2000,
  MASTER_HIGH: 5000,
  MASTER_LOW:  2000,
};

// 학생의 특정 월 포인트 자동 계산 (미적립 상태 미리보기용)
function calcMonthPoints(sid, classType, year, month, lessonsOverride){
  // lessonsOverride: 특정 월 로드 데이터가 있을 경우 mdb.lessons 대신 사용
  const _lessons = lessonsOverride || mdb.lessons;
  // 포인트 계산은 이번달 귀속 사이클만 사용 (이전달 overflow 회차 제외)
  const targetMonthStr=`${year}-${String(month).padStart(2,'0')}`;
  const allCycles=_getAllCycles(classType);
  const ownCycle=allCycles.find(c=>c.ownerMonth===targetMonthStr);
  const sessions = ownCycle ? ownCycle.dates.map((d,i)=>({sessionNo:i+1,dateStr:d})) : [];
  const earned = [];

  // ── 등록일(joinDate) 기준 참여 가능 회차 필터링 ──
  // joinDate가 있으면 그 날짜 이후 회차만 유효
  const stu = (cfg.students||[]).find(x=>x.id===sid);
  const joinDate = stu?.joinDate||'';
  // 이 사이클에서 실제로 참여 가능한 회차 (joinDate 이후)
  const validSessions = joinDate
    ? sessions.filter(sess=>sess.dateStr >= joinDate)
    : sessions;
  // 출결상은 사이클 전체(stdSessions)를 채워야 하므로
  // 참여 가능 회차가 stdSessions 미만이면 출결상 불가

  // ── 출결 보상 ──
  const ct = CT()[classType];
  const stdSessions = ct ? (ct.sessions || sessions.length) : sessions.length;
  let absent=0, late=0, attend=0;
  validSessions.forEach(sess=>{
    const l = _lessons[lk(sid, sess.dateStr)];
    if(!l) return;
    if(l.attendance==='absent') absent++;
    else if(l.attendance==='late') late++;
    else if(l.attendance==='attend') attend++;
  });
  // 출결상 조건:
  // 1) 사이클 전체 회차(8/12회)가 완료됐어야 함
  // 2) 참여 가능 회차가 stdSessions와 같아야 함 (중간 입학이면 불가)
  const cycleComplete = stdSessions > 0 && sessions.length >= stdSessions;
  const canEarnAttend = cycleComplete && validSessions.length >= stdSessions;
  if(canEarnAttend){
    if(absent===0 && late===0 && attend>=stdSessions){
      earned.push({type:'PERFECT', label:'PERFECT 출석상', points:PT.PERFECT,
        note:`결석 0 · 지각 0 (${stdSessions}회 완료)`});
    } else if(absent===0 && late>=1 && late<=2 && (attend+late)>=stdSessions){
      earned.push({type:'STEADY', label:'STEADY 출석상', points:PT.STEADY,
        note:`결석 0 · 지각 ${late}회 (${stdSessions}회 완료)`});
    }
  }

  // ── DAILY 챌린지상 (전범위 제외 시험 평균 80점↑) ──
  // 출결상과 동일 기준: 사이클 전체 회차(8/12회)를 처음부터 참여한 경우에만 수여
  // 중간 등록(joinDate 이후 참여 가능 회차 < stdSessions)이면 불가
  if(canEarnAttend){
    const testScores=[];
    validSessions.forEach(sess=>{
      const l = _lessons[lk(sid, sess.dateStr)];
      if(!l || l.attendance==='absent' || l.testIsFullRange) return;
      const ts = parseFloat(l.testScore);
      if(!isNaN(ts)) testScores.push(ts);
    });
    if(testScores.length>0){
      const avg = Math.round(testScores.reduce((a,b)=>a+b,0)/testScores.length);
      if(avg>=80){
        earned.push({type:'DAILY', label:'DAILY 챌린지상', points:PT.DAILY, note:`시험 평균 ${avg}점`});
      }
    }
  }

  // ── MASTER 인증상 (전범위 1차 90점↑) ──
  // 날짜 기준: 시험 날짜의 calendar month가 아니라
  // 해당 날짜가 속한 사이클(ownerMonth)을 기준으로 판단
  // 예: 4월 30일이 5월 사이클 1회차이면 → 5월 정산에 포함
  const myTests = textbookTests[sid]||{};
  // 이 학생의 classType 사이클 정보 (날짜→ownerMonth 역조회)
  const _cycles = _getAllCycles(classType);
  function _getOwnerMonthForDate(dateStr){
    for(const c of _cycles){
      if(c.dates.includes(dateStr)) return c.ownerMonth; // 'YYYY-MM'
    }
    // 사이클에 없으면 (보강일 등) 날짜의 calendar month 사용
    return dateStr ? dateStr.substring(0,7) : '';
  }
  // targetMonthStr은 함수 상단(3353번)에서 이미 선언됨

  Object.entries(myTests).forEach(([tbId, arr])=>{
    const first = arr.find(a=>Number(a.attempt)===1);
    if(!first || first.manualComplete) return;
    const sc = parseFloat(first.score);
    if(isNaN(sc) || sc < 90) return;
    // 시험 날짜의 ownerMonth 기준으로 정산월 판단
    const testDate = first.date||'';
    if(testDate){
      const ownerMonth = _getOwnerMonthForDate(testDate);
      if(ownerMonth !== targetMonthStr) return;
    }
    // 사이클 전체 회차를 처음부터 참여한 경우에만 MASTER 수여
    // 중간 등록 학생(canEarnAttend=false)은 불가
    if(!canEarnAttend) return;
    const bk=(cfg.textbooks||[]).find(b=>b.id===tbId);
    const tier = (bk?.masterTier||'high')==='high' ? 'high' : (bk?.masterTier==='none' ? 'none' : 'low');
    if(tier==='none') return; // 포인트 없는 교재는 제외
    const pts  = tier==='high' ? PT.MASTER_HIGH : PT.MASTER_LOW;
    earned.push({
      type: tier==='high'?'MASTER_HIGH':'MASTER_LOW',
      label: `MASTER 인증상 (${tier==='high'?'HIGH':'LOW'})`,
      points: pts,
      note: `${bk?.name||'교재'} 1차 ${sc}점 (${testDate})`,
    });
  });

  return earned;
}

// 학교 성적 포인트 적립 (버튼 클릭 시에만)
async function settleSchoolExamPoint(sid, settleId, points, type, label, note){
  if(!confirm(`${label} +${points.toLocaleString()}P를 적립하시겠어요?\n\n${note}`)) return;
  const pd = pointsData[sid]||{balance:0,history:[],settled:[]};
  // 중복 체크
  if((pd.history||[]).some(h=>h.settleId===settleId)){
    toast('이미 적립된 내역입니다.', true); return;
  }
  // 정산 연월 기준으로 저장 (현재 날짜 아님)
  const recYear  = st.ptSettleYear  || (st.month===1 ? st.year-1 : st.year);
  const recMonth = st.ptSettleMonth || (st.month===1 ? 12 : st.month-1);
  pd.balance = (pd.balance||0) + points;
  pd.history = [...(pd.history||[]), {
    id:'h'+Date.now()+Math.random(),
    type,
    label,
    points,
    note,
    settleId,
    year: recYear,
    month: recMonth,
    date: dk(new Date()),
    by: session?.username||'',
  }];
  await savePointsData(sid, pd);
  toast(`${label} +${points.toLocaleString()}P 적립됐습니다`);
  render();
}

}

// 포인트 차감 (사용 처리)
async function confUsePoint(){
  const sid   = document.getElementById('ptUseSid').value;
  const pts   = parseInt(document.getElementById('ptUseAmount').value);
  const note  = document.getElementById('ptUseNote').value.trim();
  if(!sid){alert('학생을 선택해주세요');return;}
  if(isNaN(pts)||pts<=0){alert('차감할 포인트를 입력해주세요');return;}
  const pd = pointsData[sid]||{balance:0,history:[],settled:[]};
  if((pd.balance||0) < pts){
    if(!confirm(`잔액(${(pd.balance||0).toLocaleString()}P)보다 차감액이 큽니다. 계속할까요?`)) return;
  }
  pd.balance = (pd.balance||0) - pts;
  pd.history = [...(pd.history||[]), {
    id:'h'+Date.now()+Math.random(),
    type:'USE',
    label:'포인트 사용',
    points: -pts,
    note: note||'수강료 차감',
    year: st.year, month: st.month,
    date: dk(new Date()),
    by: session?.username||'',
  }];
  await savePointsData(sid, pd);
  toast(`${pts.toLocaleString()}P 차감 처리됐습니다`);
  closeM(); render();
}

// 포인트 내역 삭제
async function delPointHistory(sid, hid){
  if(!confirm('이 포인트 내역을 삭제하시겠어요?')) return;
  const pd = pointsData[sid];
  if(!pd) return;
  const target = pd.history.find(h=>h.id===hid);
  if(!target) return;
  pd.history = pd.history.filter(h=>h.id!==hid);
  pd.balance = (pd.balance||0) - target.points; // 역산
  await savePointsData(sid, pd);
  toast('삭제됐습니다'); render();
}

                border:1px solid ${canEarnAttendSettle?(sel==='perfect'?'#1e6e3a':'#80c090'):'#ddd'}">🏅 PERFECT</button>
              <button onclick="setPtAttendSel('${s.id}','steady')"
                ${canEarnAttendSettle?'':'disabled title="중간 등록으로 출결상 불가"'}
                style="padding:2px 8px;font-size:10px;border-radius:20px;cursor:${canEarnAttendSettle?'pointer':'not-allowed'};font-family:inherit;font-weight:600;
                background:${sel==='steady'?'#1558a8':'transparent'};color:${canEarnAttendSettle?(sel==='steady'?'#fff':'#1558a8'):'#bbb'};
                border:1px solid ${canEarnAttendSettle?(sel==='steady'?'#1558a8':'#90b8e8'):'#ddd'}">⭐ STEADY</button>
            </div>
          </div>
          ${(()=>{
            // 사이클 경계 날짜 안내 (이전달/다음달에 걸친 회차)
            const _settleMonthPfx = `${settleYear}-${String(settleMonth).padStart(2,'0')}`;
            const _crossDates = sessions.map((sess,i)=>({no:i+1, dateStr:sess.dateStr}))
              .filter(x=>x.dateStr.substring(0,7)!==_settleMonthPfx);
            if(!_crossDates.length) return '';
            return `<div style="font-size:10px;color:#7a4e00;background:#fff8e8;border-top:1px solid #f0dda0;padding:3px 8px;display:flex;gap:6px;flex-wrap:wrap">
              ${_crossDates.map(x=>{
                const isPrev = x.dateStr.substring(0,7) < _settleMonthPfx;
                const label  = isPrev ? '이전달' : '다음달';
                const color  = isPrev ? '#7a4e00' : '#1558a8';
                const bg     = isPrev ? '#fff3d0' : '#e5effc';
                const border = isPrev ? '#e0c060' : '#90b8e8';
                return `<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:${bg};color:${color};border:1px solid ${border};font-weight:600">${label} ${x.dateStr.substring(5)} · ${x.no}회차</span>`;
              }).join('')}
            </div>`;
          })()}
        </div>`;
      });
      h += `</div>`;

      // 선택 현황 요약 + 적립 버튼
      const selMap   = st.ptAttendSel||{};
      const perfCnt  = unsetList.filter(s=>selMap[s.id]==='perfect').length;
      const stCnt    = unsetList.filter(s=>selMap[s.id]==='steady').length;
      const totalPt  = perfCnt*PT.PERFECT + stCnt*PT.STEADY;
      const anySelected = perfCnt+stCnt > 0;

      h += `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--rl);margin-bottom:8px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text2)">
          선택: PERFECT <b>${perfCnt}명</b> · STEADY <b>${stCnt}명</b>
          ${anySelected?` · 총 <b style="color:#1e6e3a">+${totalPt.toLocaleString()}P</b>`:''}
        </span>
        <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
          ${isPrin&&anySelected?`<button class="btn btn-primary" onclick="confirmAttendSettle(${settleYear},${settleMonth})">✅ ${settleYl} 출결 포인트 적립</button>`:''}
          ${anySelected?`<button class="btn" onclick="st.ptAttendSel={};render()">초기화</button>`:''}
          ${isPrin&&unsetList.length?`<button class="btn" style="color:var(--text3)" onclick="skipAttendSettle(${settleYear},${settleMonth})">이달 출결 없음으로 완료</button>`:''}
        </div>
      </div>`;
    }

    if(doneList.length){
      h += `<div style="margin-top:10px">
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px">정산 완료 (${doneList.length}명)</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">`;
      doneList.forEach(s=>{
        const ct = CT()[s.classType];
        const attHistory = (pointsData[s.id]?.history||[])
          .filter(hh=>hh.year===settleYear&&hh.month===settleMonth&&(hh.type==='PERFECT'||hh.type==='STEADY'))
          .reverse();
        const attPt = attHistory.reduce((a,hh)=>a+hh.points,0);
        h += `<div data-pt-name="${esc(s.name)}" style="display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--rl);background:#fff;flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:2px">
              <b style="font-size:15px">${esc(s.name)}</b>
              ${s.grade?gradeBadge(s.grade):''}
              ${ct?`<span class="badge ${ct.badge||'b-mwf'}" style="font-size:9px">${ct.label}</span>`:''}
            </div>
            <div style="font-size:11px;color:${attPt>0?'#1e6e3a':'var(--text3)'}">
              ${attHistory.length?attHistory.map(hh=>`${hh.label} +${hh.points.toLocaleString()}P`).join(' · '):'출결 포인트 없음'}
            </div>
          </div>
          ${isPrin?`<button class="btn btn-sm" style="font-size:10px;color:var(--red);flex-shrink:0" onclick="resetAttendSettle('${s.id}',${settleYear},${settleMonth})">취소</button>`:''}
        </div>`;
      });
      h += `</div></div>`;
    }
  }

  // ══════════════════════════════════════
  // 탭 2: 기타 포인트 정산 (DAILY/MASTER/성적보상)
  // ══════════════════════════════════════
  else if(ptTab==='other'){
    h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:600">정산 기준월</span>
      <select style="font-size:13px;padding:5px 10px" onchange="
        const [y,m]=this.value.split('-').map(Number);
        st.ptSettleYear=y; st.ptSettleMonth=m; render()
      ">
        ${monthOpts.map(o=>`<option value="${o.year}-${o.month}" ${o.year===settleYear&&o.month===settleMonth?'selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>

    <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px">DAILY 챌린지상 / MASTER 인증상 — 시스템 자동 계산 결과</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px">`;

    // 정산 기준월 데이터 사용 — 반드시 3-way 머지본(_mergedLessonsCache) 사용
    const _settleKey = `${settleYear}-${String(settleMonth).padStart(2,'0')}`;
    const _curKey2 = `${st.year}-${String(st.month).padStart(2,'0')}`;
    const _isCurrentMonth = (_settleKey === _curKey2);
    const _mergedCached = _mergedLessonsCache[_settleKey];
    const _settleLessons = _isCurrentMonth ? mdb.lessons : (_mergedCached || null);
    if(!_isCurrentMonth && !_mergedCached){
      _loadLessonsForMonth(settleYear, settleMonth).then(()=>{ render(); });
    }

    filtered.forEach((s,i)=>{
      const ct = CT()[s.classType];
      const earned = calcMonthPoints(s.id, s.classType, settleYear, settleMonth, _settleLessons)
        .filter(e=>e.type==='DAILY'||e.type==='MASTER_HIGH'||e.type==='MASTER_LOW');
      const alreadySettled = (pointsData[s.id]?.history||[])
        .some(h=>h.year===settleYear&&h.month===settleMonth&&(h.type==='DAILY'||h.type==='MASTER_HIGH'||h.type==='MASTER_LOW'));
      if(!earned.length && !alreadySettled) return;

      h += `<div data-pt-name="${esc(s.name)}" style="border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column">
        <div style="padding:7px 10px;flex:1">
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px">
            <b style="font-size:20px">${esc(s.name)}</b>
            ${s.grade?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#eef0f3;color:#3a4555;border:1px solid #d8dde5">${s.grade}</span>`:''}
            ${ct?`<span class="badge ${ct.badge||'b-mwf'}" style="font-size:9px">${ct.label}</span>`:''}
          </div>
          ${earned.map(e=>`<div style="font-size:13px;color:var(--text2)">• ${esc(e.label)} <b style="color:#1e6e3a">+${e.points.toLocaleString()}P</b> <span style="color:var(--text3)">${esc(e.note)}</span></div>`).join('')}
          ${alreadySettled?`<div style="font-size:10px;color:#1e6e3a;margin-top:2px">✅ 이미 적립됨</div>`:''}
        </div>
        ${isPrin&&earned.length&&!alreadySettled?`<div style="padding:5px 8px;background:var(--bg2);border-top:1px solid var(--border)"><button class="btn btn-sm btn-primary" style="font-size:11px;padding:3px 10px;width:100%" onclick="settleOtherPoints('${s.id}',${settleYear},${settleMonth})">+${earned.reduce((a,e)=>a+e.points,0).toLocaleString()}P 적립</button></div>`:''}
      </div>`;
    });

    const anyOther = filtered.some(s=>{
      const earned=calcMonthPoints(s.id,s.classType,settleYear,settleMonth,_settleLessons).filter(e=>e.type==='DAILY'||e.type==='MASTER_HIGH'||e.type==='MASTER_LOW');
      const done=(pointsData[s.id]?.history||[]).some(h=>h.year===settleYear&&h.month===settleMonth&&(h.type==='DAILY'||h.type==='MASTER_HIGH'||h.type==='MASTER_LOW'));
      return earned.length||done;
    });
    if(!anyOther) h += `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px;grid-column:1/-1">해당 월에 DAILY/MASTER 실적이 없습니다</div>`;
    h += `</div>`;

    // ── 학교 성적 포인트 자동 계산 (인증된 학생만)
    // ※ 학교 시험은 학기 단위이므로 위 정산 기준월과 무관하게 전체 인증 성적을 표시합니다
    h += `<div style="margin-top:24px;padding-top:20px;border-top:2px solid var(--border)">`;
    h += `<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px">🏆 학교 성적 포인트 <span style="font-size:11px;font-weight:400;color:var(--text3)">(정산 기준월 무관 · 성적표 인증 학생 전체)</span></div>`;
    h += `<div style="font-size:11px;color:var(--text2);padding:8px 12px;background:var(--amber-bg);border:1px solid #e8c860;border-radius:var(--r);margin-bottom:10px;line-height:1.7">
      <b>절대성적</b>: TOP HONOR (100점) 20,000P · HIGH HONOR (90점↑) 중등 10,000P/고등 20,000P<br>
      <b>향상</b>: GROWTH+30 20,000P · +20 10,000P · +10 5,000P<br>
      <span style="color:#a05a00">※ 성적표 파일 업로드(인증)된 학생만 자동 표시 · 적립 버튼 클릭 후 저장됩니다 · 위 정산 기준월과 별개</span>
    </div>`;
    h += `<div style="border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:16px">`;

    // 성적 포인트 대상 학생 계산
    const schoolPtRows = [];
    filtered.forEach(s=>{
      const sDb = schoolExamData[s.id]||{exams:[]};
      const sExams = (sDb.exams||[]).filter(e=>e.type==='school');
      if(!sExams.length) return;
      const isHighStu = s.grade && s.grade.startsWith('고');

      // 학년별로 그룹
      const gradeGroups = {};
      sExams.forEach(e=>{
        const gl = e.gradeLabel||(s.grade||'');
        if(!gradeGroups[gl]) gradeGroups[gl]=[];
        gradeGroups[gl].push(e);
      });

      Object.entries(gradeGroups).forEach(([gl, gExams])=>{
        const examMapG = {};
        gExams.forEach(e=>{ examMapG[e.key]=e; });
        const EXAM_ORDER = ['s1_mid','s1_fin','s2_mid','s2_fin'];
        const EXAM_LABELS = {s1_mid:'1학기 중간',s1_fin:'1학기 기말',s2_mid:'2학기 중간',s2_fin:'2학기 기말'};
        const PREV_MAP = {s1_fin:'s1_mid',s2_mid:'s1_fin',s2_fin:'s2_mid'};
        // 학년 순서 (직전 학년 참조용)
        const GRADE_ORDER_LIST=['초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];

        gExams.forEach(ex=>{
          // 점수가 없으면 스킵
          if(ex.score===null || ex.score===undefined) return;
          const sc = ex.score;

          // growth 계산: 인증 필수 (바로 앞 순서 시험만 참조, 건너뛰기 없음)
          const prevKey = PREV_MAP[ex.key];
          let prevSc = null;
          if(ex.certified){ // growth는 현재 시험도 인증 필요
            if(ex.key==='s1_mid'){
              const glIdx = GRADE_ORDER_LIST.indexOf(gl);
              if(glIdx > 0){
                const prevGrade = GRADE_ORDER_LIST[glIdx-1];
                const prevGradeEx = (sDb.exams||[]).find(e=>
                  e.type==='school' && e.gradeLabel===prevGrade && e.key==='s2_fin'
                );
                if(prevGradeEx && prevGradeEx.certified && prevGradeEx.score!==null && prevGradeEx.score!==undefined){
                  prevSc = prevGradeEx.score;
                }
              }
            } else if(prevKey){
              const prevEx = examMapG[prevKey];
              if(prevEx && prevEx.certified && prevEx.score!==null && prevEx.score!==undefined){
                prevSc = prevEx.score;
              }
            }
          }
          const growth = (prevSc!==null&&!isNaN(sc)&&!isNaN(prevSc))?(sc-prevSc):null;

          // 포인트 계산
          // TOP HONOR / HIGH HONOR: 인증 없이도 점수만으로 수여 가능
          // GROWTH: 인증 필수 (위에서 certified 체크)
          const candidates = [];
          if(sc===100 || (isHighStu && sc===-1)){
            candidates.push({type:'TOP_HONOR', label:'Top Honor', points:20000, note:`${gl} ${EXAM_LABELS[ex.key]||ex.key} 100점${ex.certified?'':' (미인증)'}`});
          } else if(sc>=90){
            candidates.push({type:isHighStu?'HIGH_HONOR_HIGH':'HIGH_HONOR_MID', label:'High Honor', points:isHighStu?20000:10000, note:`${gl} ${EXAM_LABELS[ex.key]||ex.key} ${sc}점${ex.certified?'':' (미인증)'}`});
          }
          if(growth!==null){
            if(growth>=30) candidates.push({type:'GROWTH_30',label:'Growth+30',points:20000,note:`${gl} ${EXAM_LABELS[ex.key]||ex.key} +${growth}점`});
            else if(growth>=20) candidates.push({type:'GROWTH_20',label:'Growth+20',points:10000,note:`${gl} ${EXAM_LABELS[ex.key]||ex.key} +${growth}점`});
            else if(growth>=10) candidates.push({type:'GROWTH_10',label:'Growth+10',points:5000,note:`${gl} ${EXAM_LABELS[ex.key]||ex.key} +${growth}점`});
          }
          if(!candidates.length) return;
          // 이미 적립된 항목은 목록에서 완전히 제외
          candidates.forEach(c=>{
            const settleId = `${c.type}__${gl}__${ex.key}`;
            const alreadyDone = (pointsData[s.id]?.history||[]).some(hh=>hh.settleId===settleId);
            if(alreadyDone) return; // 적립 완료 → 노출 안 함
            schoolPtRows.push({s, c, ex, gl, settleId, alreadyDone:false});
          });
        });
      });
    });

    if(!schoolPtRows.length){
      h += `<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">성적표 인증된 성적 포인트 대상이 없습니다</div>`;
    } else {
      schoolPtRows.forEach((row,i)=>{
        const {s,c,ex,gl,settleId,alreadyDone}=row;
        const ct=CT()[s.classType];
        h += `<div data-pt-name="${esc(s.name)}" style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:${i%2===0?'#fff':'#fafaf9'};flex-wrap:wrap">
          <div style="flex:1;min-width:120px">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
              <b style="font-size:13px">${esc(s.name)}</b>
              ${s.grade?gradeBadge(s.grade):''}
              ${ct?`<span class="badge ${ct.badge||'b-mwf'}" style="font-size:10px">${ct.label}</span>`:''}
              <span style="font-size:10px;color:var(--text3)">${esc(gl)}</span>
            </div>
            <div style="font-size:11px;color:var(--text2)">• ${esc(c.label)} <b style="color:#1e6e3a">+${c.points.toLocaleString()}P</b> <span style="color:var(--text3)">${esc(c.note)}</span></div>
            <div style="font-size:10px;color:var(--text3)">✅ 성적표 인증 완료</div>
            ${alreadyDone?`<div style="font-size:11px;color:#1e6e3a;margin-top:2px">✅ 이미 적립됨</div>`:''}
          </div>
          ${isPrin&&!alreadyDone?`<button class="btn btn-sm btn-primary" onclick="settleSchoolExamPoint('${s.id}','${settleId}',${c.points},'${c.type}','${c.label}','${c.note.replace(/'/g,"\'")}')">+${c.points.toLocaleString()}P 적립</button>`:''}
        </div>`;
      });
    }
    h += `</div>`;
    h += `</div>`; // 학교 성적 포인트 wrapper 닫기

    // 성적 보상 수동 적립 안내
    h += `<div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px">✏️ 성적 보상 수동 적립</div>
    <div style="padding:12px 14px;border:1px solid var(--border);border-radius:var(--rl);background:var(--bg);margin-bottom:8px">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">자동 목록 외 추가 적립이 필요한 경우 직접 입력하세요. <b>성적표 인증된 학생만 지급</b>.</div>
      ${isPrin?`<button class="btn btn-primary btn-sm" onclick="openM('addManualPoint')">✏️ 수동 적립</button>`:''}
      <div style="font-size:11px;color:var(--text3);margin-top:6px">💡 성적 기록은 학생 관리 → 상세 탭에서 확인 및 입력할 수 있습니다.</div>
    </div>

    <!-- 이달 수상자 현황 요약 -->
    <div style="margin:16px 0 8px;display:flex;align-items:center;gap:8px">
      <button onclick="st.ptAwardOpen=!st.ptAwardOpen;render()" style="display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;font-weight:700;border:1px solid var(--border2);border-radius:var(--r);background:${st.ptAwardOpen?'var(--text)':'var(--bg)'};color:${st.ptAwardOpen?'#fff':'var(--text2)'};cursor:pointer;font-family:inherit">
        🏆 ${settleYl} 수상 현황 요약 ${st.ptAwardOpen?'▲':'▼'}
      </button>
    </div>
    `;

    // 수상 현황 계산 (토글 여부와 무관하게 항상 계산)
    const awardDefs2 = [
      {id:'perfect', label:'🏅 PERFECT 출석상', color:'#1e6e3a', bg:'#e2f2e9', border:'#80c090'},
      {id:'steady',  label:'⭐ STEADY 출석상',  color:'#1558a8', bg:'#e5effc', border:'#90b8e8'},
      {id:'daily',   label:'📊 DAILY 챌린지상', color:'#7a4e00', bg:'#fdf0d8', border:'#e0c060'},
      {id:'master',  label:'👑 MASTER 인증상',  color:'#5a2080', bg:'#f3e8fc', border:'#c090e0'},
    ];
    const awardCount = {perfect:0, steady:0, daily:0, master:0};
    const awardNames = {perfect:[], steady:[], daily:[], master:[]};

    filtered.forEach(s=>{
      const hist = pointsData[s.id]?.history||[];
      const hasPerf  = hist.some(h=>h.year===settleYear&&h.month===settleMonth&&h.type==='PERFECT');
      const hasSteady= hist.some(h=>h.year===settleYear&&h.month===settleMonth&&h.type==='STEADY');
      const hasDaily = hist.some(h=>h.year===settleYear&&h.month===settleMonth&&h.type==='DAILY');
      const hasMaster= hist.some(h=>h.year===settleYear&&h.month===settleMonth&&(h.type==='MASTER_HIGH'||h.type==='MASTER_LOW'));
      if(hasPerf)  { awardCount.perfect++; awardNames.perfect.push(s.name); }
      if(hasSteady){ awardCount.steady++;  awardNames.steady.push(s.name);  }
      if(hasDaily) { awardCount.daily++;   awardNames.daily.push(s.name);   }
      if(hasMaster){ awardCount.master++;  awardNames.master.push(s.name);  }
    });

    // 버튼 클릭 시에만 수상 현황 카드 표시
    if(st.ptAwardOpen){
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:14px">`;
      awardDefs2.forEach(def=>{
        const cnt   = awardCount[def.id];
        const names = awardNames[def.id];
        h += `<div style="padding:10px 12px;border-radius:var(--rl);border:1px solid ${def.border};background:${def.bg}">
          <div style="font-size:12px;font-weight:700;color:${def.color};margin-bottom:4px">${def.label}</div>
          <div style="font-size:20px;font-weight:800;color:${def.color};margin-bottom:4px">${cnt}명</div>
          ${names.length?`<div style="font-size:10px;color:${def.color};opacity:.8">${names.map(n=>esc(n)).join(', ')}</div>`:'<div style="font-size:10px;color:var(--text3)">해당 없음</div>'}
        </div>`;
      });
      h += `</div>`;
    }
  }

  // ══════════════════════════════════════
  // 탭 3: 잔액 현황
  // ══════════════════════════════════════
  else if(ptTab==='balance'){
    // ── 이름 검색 (DOM 조작 방식 — render 없이 실시간 필터, 끊김 없음) ──
    const balSearchVal = st.ptBalSearch||'';
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <input type="text" id="ptBalSearchInp"
        placeholder="🔍 학생 이름 검색"
        value="${esc(balSearchVal)}"
        oninput="ptBalSearchFilter(this.value)"
        style="padding:5px 10px;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);width:160px;font-family:inherit">
      <button id="ptBalClearBtn" class="btn btn-sm" onclick="ptBalSearchFilter('');document.getElementById('ptBalSearchInp').value=''" style="color:var(--red);display:${balSearchVal?'':'none'}">✕</button>
      <span style="font-size:11px;color:var(--text3);margin-left:auto">가나다 순 · 클릭하면 내역 펼침</span>
    </div>`;

    // 가나다 정렬 (반 필터는 상단 공통 필터 사용)
    const sorted = [...filtered].sort((a,b)=>a.name.localeCompare(b.name,'ko'));

    if(!sorted.length){
      h += `<div class="empty">해당 조건의 학생이 없습니다.</div>`;
    } else {
      // 펼쳐진 학생은 단독 전체행, 나머지는 2열 카드
      // 구현: 카드 목록을 순서대로 출력하되 펼쳐진 카드는 grid-column:1/-1
      h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">`;
      sorted.forEach(s=>{
        const pd  = pointsData[s.id]||{balance:0,history:[]};
        const bal = pd.balance||0;
        const ct  = CT()[s.classType];
        const yearEarned = (pd.history||[]).filter(hh=>hh.year===st.year&&hh.points>0).reduce((a,hh)=>a+hh.points,0);
        const isHonor = yearEarned>=100000;
        const isExpanded = st.ptExpanded===s.id;
        const balColor = bal>0?'#1e6e3a':bal<0?'#a02828':'#aaa';

        // 펼쳐진 카드는 2열 전체를 차지
        h += `<div data-pt-name="${esc(s.name)}" data-bal-name="${esc(s.name.toLowerCase())}" style="${isExpanded?'grid-column:1/-1;':''} border:1px solid ${isExpanded?'#90b8e8':' var(--border)'};border-radius:var(--rl);background:#fff;overflow:hidden">`;

        // 카드 상단 클릭 영역
        h += `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:${isExpanded?'#eef5ff':'#fff'}"
          onclick="st.ptExpanded=(st.ptExpanded==='${s.id}'?null:'${s.id}');render()">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:2px">
              <b style="font-size:15px">${esc(s.name)}</b>
              ${s.grade?gradeBadge(s.grade):''}
              ${ct?`<span class="badge ${ct.badge||'b-mwf'}" style="font-size:9px">${ct.label}</span>`:''}
              ${isHonor?`<span style="font-size:9px;padding:1px 5px;border-radius:20px;background:#f3e8fc;color:#5a2080;border:1px solid #c090e0;font-weight:700">👑</span>`:''}
            </div>
            <div style="font-size:10px;color:var(--text3)">${st.year}년 누적 ${yearEarned.toLocaleString()}P</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <span style="font-size:18px;font-weight:800;color:${balColor}">${bal.toLocaleString()}P</span>
            <span style="font-size:11px;color:var(--text3)">${isExpanded?'▲':'▼'}</span>
          </div>
        </div>`;

        // 펼쳐진 내역
        if(isExpanded){
          const history = [...(pd.history||[])].reverse();
          h += `<div style="padding:10px 14px;border-top:1px solid #c8d8f0">
            <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
              ${isPrin?`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();openM('addManualPoint','${s.id}')">✏️ 적립</button>`:''}
              ${isPrin?`<button class="btn btn-sm" onclick="event.stopPropagation();openM('usePoint','${s.id}')">💳 차감</button>`:''}
            </div>
            <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px">전체 내역 (${history.length}건)</div>`;
          if(!history.length){
            h += `<div style="padding:12px;text-align:center;color:var(--text3);font-size:12px">포인트 내역이 없습니다</div>`;
          } else {
            // 2열 내역 그리드
            h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">`;
            history.forEach(item=>{
              const isPlus=item.points>0;
              h += `<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;background:var(--bg2);flex-wrap:wrap">
                <div style="flex:1;min-width:80px">
                  <div style="font-size:11px;font-weight:600">${esc(item.label)}</div>
                  <div style="font-size:10px;color:var(--text3)">${esc(item.date||'')}${item.by?' · '+esc(item.by):''}</div>
                </div>
                <span style="font-size:13px;font-weight:700;color:${isPlus?'#1e6e3a':'var(--red)'};white-space:nowrap">${isPlus?'+':''}${item.points.toLocaleString()}P</span>
                ${isPrin?`<button class="btn btn-sm" style="color:var(--red);padding:1px 5px;font-size:10px"
                  onclick="event.stopPropagation();delPointHistory('${s.id}','${item.id}')">✕</button>`:''}
              </div>`;
            });
            h += `</div>`;
          }
          h += `</div>`;
        }

        h += `</div>`;
      });
      h += `<div id="ptBalEmpty" style="display:none;padding:20px;text-align:center;color:var(--text3);font-size:12px;grid-column:1/-1">검색 결과가 없습니다.</div>`;
      h += `</div>`;
    }
  }

  return h;
}

// 포인트 탭 검색 전용 render — input 포커스/커서 위치 보존
// 포인트 게시판 (학원 게시용 수상자 포스터)
function ptSearchFilter(val){
  st.ptSearch = val.trim().toLowerCase();
  // 각 학생 행에 data-name 속성 기준으로 show/hide
  document.querySelectorAll('[data-pt-name]').forEach(el=>{
    const name = el.getAttribute('data-pt-name').toLowerCase();
    el.style.display = (!st.ptSearch || name.includes(st.ptSearch)) ? '' : 'none';
  });
  // 초기화 버튼 토글
  const clrBtn = document.getElementById('ptSearchClear');
  if(clrBtn) clrBtn.style.display = st.ptSearch ? '' : 'none';
}

// 포인트 탭 검색 초기화
function ptSearchClear(){
  st.ptSearch = '';
  const inp = document.getElementById('ptSearchInp');
  if(inp){ inp.value=''; inp.focus(); }
  ptSearchFilter('');
}

// 잔액 현황 탭 이름 검색 — DOM show/hide (render 없음 = 끊김 없음)
function ptBalSearchFilter(val){
  st.ptBalSearch = val; // 상태 저장 (render 시 input value 복원용)
  const kw = val.trim().toLowerCase();
  document.querySelectorAll('[data-bal-name]').forEach(el=>{
    const name = el.getAttribute('data-bal-name')||'';
    el.style.display = (!kw || name.includes(kw)) ? '' : 'none';
  });
  // 검색 결과 없을 때 안내
  const empty = document.getElementById('ptBalEmpty');
  if(empty){
    const visible = [...document.querySelectorAll('[data-bal-name]')].filter(el=>el.style.display!=='none');
    empty.style.display = visible.length ? 'none' : '';
  }
  // X 버튼 토글 (render 없이 직접)
  const xBtn = document.getElementById('ptBalClearBtn');
  if(xBtn) xBtn.style.display = kw ? '' : 'none';
}

// 포인트 인쇄용 페이지 (해당월 체크박스 형식)
function printPointsSummary(){
  const studs = cfg.students||[];
  const filterClass = st.ptFilterClass||'all';

  const printYear  = st.ptSettleYear  || (st.month===1 ? st.year-1 : st.year);
  const printMonth = st.ptSettleMonth || (st.month===1 ? 12 : st.month-1);
  const yl = `${printMonth}월`;

  const filtered = studs.filter(s=> filterClass==='all' || s.classType===filterClass);

  // 열 정의 — 학원생활 / 학교생활 / 성장상 그룹
  const GROUPS = [
    {
      label: '학원생활', cols: [
        { key:'PERFECT',     label:'Perfect<br>출석상',        pts:5000  },
        { key:'STEADY',      label:'Steady<br>출석상',         pts:2000  },
        { key:'DAILY',       label:'Daily<br>챌린지상',        pts:2000  },
        { key:'MASTER_HIGH', label:'Master 인증상<br>High ver', pts:5000  },
        { key:'MASTER_LOW',  label:'Master 인증상<br>low ver',  pts:2000  },
      ]
    },
    {
      label: '학교생활', cols: [
        { key:'TOP_HONOR',       label:'Top Honor',                pts:20000 },
        { key:'HIGH_HONOR_HIGH', label:'High Honor<br>(고등)',     pts:10000 },
        { key:'HIGH_HONOR_MID',  label:'High Honor<br>(중등)',     pts:5000  },
      ]
    },
    {
      label: '성장상', cols: [
        { key:'GROWTH_30', label:'Growth+30', pts:20000 },
        { key:'GROWTH_20', label:'Growth+20', pts:10000 },
        { key:'GROWTH_10', label:'Growth+10', pts:5000  },
      ]
    },
  ];
  const ALL_COLS = GROUPS.flatMap(g=>g.cols);

  function getMonthHistory(sid){
    return (pointsData[sid]?.history||[]).filter(h=>h.year===printYear && h.month===printMonth);
  }

  function isChecked(history, colKey){
    // 1) type 필드가 colKey와 정확히 일치 (학교성적상 포함)
    if(history.some(h=>h.type===colKey)) return true;
    // 2) settleId 기반 매칭 — 학교성적 포인트는 settleId가 "TYPE__gradeLabel__examKey" 형태
    if(history.some(h=>h.settleId && h.settleId.startsWith(colKey+'__'))) return true;
    // 3) MANUAL 타입으로 저장된 경우 label fallback 매칭
    const labelMap = {
      TOP_HONOR:       'Top Honor',
      HIGH_HONOR_HIGH: 'High Honor 고등',
      HIGH_HONOR_MID:  'High Honor 중등',
      GROWTH_30:       'GROWTH +30',
      GROWTH_20:       'GROWTH +20',
      GROWTH_10:       'GROWTH +10',
    };
    if(labelMap[colKey]){
      return history.some(h=>h.type==='MANUAL' && (h.label||'').replace(/\s/g,'').toLowerCase().includes(labelMap[colKey].replace(/\s/g,'').toLowerCase()));
    }
    return false;
  }

  // 이전달 누적 잔액 계산 (이달 적립 전)
  function getPrevBalance(sid){
    const pd = pointsData[sid];
    if(!pd) return 0;
    const thisMonthPts = (pd.history||[])
      .filter(h=>h.year===printYear && h.month===printMonth)
      .reduce((a,h)=>a+h.points, 0);
    return (pd.balance||0) - thisMonthPts;
  }

  function getMonthEarned(history){
    return history.filter(h=>h.points>0).reduce((a,h)=>a+h.points,0);
  }

  // 행 생성
  const rows = filtered.map((s,i)=>{
    const history     = getMonthHistory(s.id);
    const monthEarned = getMonthEarned(history);
    const prevBal     = getPrevBalance(s.id);
    const totalBal    = pointsData[s.id]?.balance||0;
    const bg = i%2===0 ? '#fff' : '#f8f8f6';

    const cells = ALL_COLS.map(col=>{
      const checked = isChecked(history, col.key);
      return `<td style="text-align:center;background:${bg};font-size:13px">${checked?'✅':'□'}</td>`;
    }).join('');

    return `<tr>
      <td style="font-weight:600;white-space:nowrap;background:${bg};padding:5px 10px;font-size:12px">${esc(s.name)}</td>
      <td style="text-align:right;font-weight:700;background:${bg};padding:5px 8px;color:#1a1a1a">${prevBal>0?prevBal.toLocaleString():0}</td>
      ${cells}
      <td style="text-align:right;font-weight:700;color:#1e6e3a;background:${bg};white-space:nowrap;padding:5px 8px">${monthEarned>0?monthEarned.toLocaleString():''}</td>
      <td style="text-align:right;font-weight:800;background:${monthEarned>0?'#fff9e6':bg};color:${totalBal>0?'#c8000a':'#1a1a1a'};white-space:nowrap;padding:5px 8px">${totalBal.toLocaleString()}</td>
    </tr>`;
  }).join('');

  // 그룹 헤더 행 1: 그룹명
  const groupHeaderCells = GROUPS.map(g=>
    `<th colspan="${g.cols.length}" style="text-align:center;background:#dce8f8;font-size:12px;font-weight:700;color:#1a3a6a;padding:5px">${g.label}</th>`
  ).join('');

  // 그룹 헤더 행 2: 포인트
  const ptHeaderCells = ALL_COLS.map(col=>
    `<th style="text-align:center;background:#eef4fb;font-size:11px;font-weight:700;color:#1558a8;padding:4px 3px">${col.pts.toLocaleString()}</th>`
  ).join('');

  // 그룹 헤더 행 3: 항목명
  const labelHeaderCells = ALL_COLS.map(col=>
    `<th style="text-align:center;background:#f5f8fd;font-size:10px;font-weight:600;color:#333;padding:4px 3px;line-height:1.4">${col.label}</th>`
  ).join('');

  const printHtml = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ES수학학원 종합 포인트 관리 시스템 (${yl})</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11px;color:#1a1a1a;padding:14px}
  h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:16px;letter-spacing:-.3px}
  h2{font-size:14px;font-weight:800;margin:20px 0 10px;padding-bottom:4px;border-bottom:2px solid #1558a8;color:#1a3a6a}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th,td{border:1px solid #bbb;padding:4px 5px;vertical-align:middle}
  th{font-weight:600}
  @media print{
    body{padding:6px}
    @page{margin:8mm;size:A3 landscape}
    .no-print{display:none}
  }
</style>
</head>
<body>
  <h1>ES수학학원 종합 포인트 관리 시스템 (${yl})</h1>

  <!-- 섹션 1: 체크표 -->
  <table>
    <thead>
      <tr>
        <th rowspan="3" style="background:#f0f4fa;min-width:60px">이름</th>
        <th rowspan="3" style="background:#f0f4fa;min-width:64px;text-align:center">지난달<br>합계</th>
        ${groupHeaderCells}
        <th rowspan="3" style="background:#e8f5e9;min-width:56px;text-align:center;color:#1e6e3a">이번달</th>
        <th rowspan="3" style="background:#fff3cd;min-width:64px;text-align:center;color:#c8000a">누적합계</th>
      </tr>
      <tr>${ptHeaderCells}</tr>
      <tr>${labelHeaderCells}</tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>

  <script>window.onload=()=>window.print();<\/script>
</body>
</html>`;

  const w = window.open('','_blank','width=1200,height=750');
  w.document.write(printHtml);
  w.document.close();
}
